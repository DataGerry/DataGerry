    - {prefix: /extendable_options, tag: ExtendableOptions, dir: extendable_options, description: API Routes related to **ExtendableOptions**}
    - {prefix: /isms/risk_classes, tag: ISMS-RiskClasses, dir: isms/risk_classes, description: API Routes related to ISMS **RiskClasses**}
    - {prefix: /isms/likelihoods, tag: ISMS-Likelihoods, dir: isms/likelihoods, description: API Routes related to ISMS **Likelihoods**}
