    - {prefix: /isms/risk_matrix, tag: ISMS-RiskMatrix, dir: isms/risk_matrix, description: API Routes related to ISMS **RiskMatrix**}
    - {prefix: /isms/risks, tag: ISMS-Risks, dir: isms/risks, description: API Routes related to ISMS **Risks**}
    - {prefix: /isms/threats, tag: ISMS-Threats, dir: isms/threats, description: API Routes related to ISMS **Threats**}
