level_notes:
    LOCKED: "_Not available with the cloud API key (frontend only in the cloud); on self-hosted installations it is reachable with Basic auth._"
    SUPER_ADMIN: "_In the cloud this operation is reserved to the operator (API level SUPER_ADMIN); on self-hosted installations it is reachable with Basic auth and the right above._"

exclude:
    - {path: "/", reason: "Connection test of the frontend (infrastructure, no API level)"}
    - {path: "/frontend_init", reason: "Bootstrap data of the frontend (infrastructure, no API level)"}
    - {path: "/setup/.*", reason: "Tenant setup of the cloud operator (SUPER_ADMIN, cloud only, refuses everything but the operator's account)"}
    - {path: "/auth/login", reason: "Token login of the frontend; the REST API authenticates every request with Basic auth instead"}
    - {path: "/chatgpt/.*", reason: "Backend of the frontend's ChatGPT helper in the DocAPI editor (LOCKED, no right of its own)"}
    - {path: "/start_assistant/.*", reason: "Backend of the frontend's start assistant (onboarding wizard of an empty installation, LOCKED)"}
    - {path: "/open_celium/.*", reason: "Backend of the OpenCelium integration screens: forwards to the OpenCelium server (LOCKED); integrate with OpenCelium's own API instead"}
    - {path: "/config_file/status/opencelium", reason: "Tells the frontend whether the OpenCelium integration is configured (LOCKED)"}
    - {path: "/users/\\{user_id\\}/settings/.*", reason: "Per-user preferences of the frontend (table layouts, views; LOCKED) - no API use"}

_section_template_query: &section_template_query
    - {name: public_id, required: true, schema: {type: integer}, description: The **public_id** of the SectionTemplate to update}
    - {name: name, required: true, schema: {type: string}, description: The unique name of the SectionTemplate (immutable - it is the key the consuming Types reference it by)}
    - {name: label, required: true, schema: {type: string}, description: The label shown in the frontend}
    - {name: type, required: true, schema: {type: string}, description: "The section type (e.g. section, multi-data-section)"}
    - {name: is_global, required: true, schema: {type: boolean}, description: Whether the template is global (a global template cannot become non-global)}
    - {name: predefined, required: true, schema: {type: boolean}, description: Whether the template is predefined (predefined templates cannot be changed)}
    - {name: fields, required: true, schema: {type: string}, description: The fields of the template as a JSON-encoded list}

_multiple_note: &multiple_note "The body is a JSON **array** of the documents to update, each carrying its `public_id`."

overrides:
    POST /isms/control_measures/catalog_import:
        summary: Import or update the requirements of a bundled OSCAL catalog as ControlMeasures
    PATCH /objects/:
        query:
            - name: objectIDs
              required: true
              style: form
              explode: true
              description: "The public_ids of the Objects to change, as a repeated parameter (`?objectIDs=1&objectIDs=2`); at most 5000"
              schema: {type: array, items: {type: integer}}
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        description: Only these three keys are accepted; a body that sets no field and no active state is refused
                        properties:
                            fields:
                                type: array
                                description: The field values to set on every Object
                                items:
                                    type: object
                                    required: [name, value]
                                    properties:
                                        name: {type: string, minLength: 1}
                                        value: {description: "The new value (any JSON type, null allowed)"}
                                        type: {type: string}
                            comment: {type: string, nullable: true, description: Comment for the edit logs}
                            active: {type: boolean, description: "Activate / deactivate the Objects (needs base.framework.object.activation when it changes a stored state)"}
    PUT /section_templates/:
        query: *section_template_query
        description: "The template is passed in the **query string**, not in the body (`parse_request_parameters`)."
    PATCH /section_templates/:
        query: *section_template_query
        description: "The template is passed in the **query string**, not in the body (`parse_request_parameters`)."
    PATCH /isms/risk_classes/multiple:
        description: *multiple_note
        requestBody:
            required: true
            content:
                application/json:
                    schema: {type: array, items: {$ref: "../../../components/schemas/isms/IsmsRiskClass.yaml"}}
    PATCH /isms/impact_categories/multiple:
        description: *multiple_note
        requestBody:
            required: true
            content:
                application/json:
                    schema: {type: array, items: {$ref: "../../../components/schemas/isms/IsmsImpactCategory.yaml"}}
    PATCH /reports/{public_id}:
        requestBody:
            required: true
            content:
                application/json:
                    schema: {$ref: "../../components/schemas/CmdbReport.yaml"}
    POST /object_relations/delete/many:
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        required: [target_ids]
                        properties:
                            target_ids: {type: array, items: {type: integer}, description: The public_ids of the ObjectRelations to delete}
    POST /search/:
        requestBody:
            required: true
            content:
                application/json:
                    schema:
                        type: array
                        description: The search parameters (the same JSON array GET takes in `?query=`)
                        items: {type: object, additionalProperties: true}
    POST /auth/settings:
        requestBody: &auth_settings_body
            required: true
            content:
                application/json:
                    schema:
                        type: object
                        additionalProperties: true
                        description: The complete authentication settings section (as GET /auth/settings returns it)
    PUT /auth/settings:
        requestBody: *auth_settings_body
