# Rules for docs/_tools/openapi/generate.py - see README.md
#
# areas:            path prefix -> tag, directory below paths/ and the tag description. The longest prefix wins.
# exclude:          routes that are not documented, each with its reason (regex on the OpenAPI path, optional
#                   method / api_level / no_api_level). First match wins.
# result_components: the existing component schema used for `result`/`results`/`raw` of an operation on exactly
#                   <prefix> or <prefix>/{id} (as the hand-written files do); everything else is a generic object.
# level_notes:      a sentence added to the description of operations with that API level.
# overrides:        "<METHOD> <path>" -> summary / description (appended) / query (extra parameters) /
#                   requestBody (replaces the derived one) / operationId.

areas:
