    - {prefix: /webhook_events, tag: WebhookEvents, dir: webhook_events, description: "API Routes related to **WebhookEvents** (the delivery log of the Webhooks)"}
    - {prefix: /reports, tag: Reports, dir: reports, description: API Routes related to **Reports**}
