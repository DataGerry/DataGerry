    /types: CmdbType.yaml
    /categories: CmdbCategory.yaml
    /section_templates: CmdbSectionTemplate.yaml
    /users: CmdbUser.yaml
    /groups: CmdbUserGroup.yaml
    /persons: CmdbPerson.yaml
    /person_groups: CmdbPersonGroup.yaml
    /relations: CmdbRelation.yaml
    /object_relations: CmdbObjectRelation.yaml
    /webhooks: CmdbWebhook.yaml
    /reports: CmdbReport.yaml
    /report_categories: CmdbReportCategory.yaml
    /extendable_options: CmdbExtendableOption.yaml
    /isms/risk_classes: isms/IsmsRiskClass.yaml
    /isms/likelihoods: isms/IsmsLikelihood.yaml
    /isms/impacts: isms/IsmsImpact.yaml
    /isms/impact_categories: isms/IsmsImpactCategory.yaml
