openapi: 3.0.3
info:
    title: DataGerry API
    description: |
        The REST API of DataGerry, for the DataGerry Cloud and for self-hosted (on-premise) installations.
        <br><hr><br>

        **DataGerry Cloud**: base URL `https://api.datagerry.com/rest`. Every request carries **Basic auth** with
        the e-mail address and password of your DataGerry Cloud account **and** the `x-api-key` header with the
        API key of your subscription, which you find in the Service Portal.

        **Self-hosted**: base URL `https://<your-host>/rest`. Every request carries **Basic auth** with the user
        name and password of a DataGerry user; no API key. The REST API is a licensed feature: the installation
        needs a license that includes the **REST API** feature.

        In both editions the user's rights decide what a request may do: every operation names the
        **Required User Right** at the top of its description.

        **Editions in the summaries**: `[Cloud]` marks an operation the cloud API key can reach, `[OnPremise]`
        an operation available on self-hosted installations. An operation marked only `[OnPremise]` cannot be
        reached with the cloud API key (in the cloud most of them are reserved to the DataGerry web interface).

        **New after 3.3.0**: operations marked so (and with `x-since`) were added after release 3.3.0. They are
        available in the cloud now (3.3.1 and later) and on self-hosted installations from version 3.4.
        <br><br><hr>
    version: "3.3.2"
    license:
        name: GNU Affero General Public License
        url: https://www.gnu.org/licenses/agpl-3.0

servers:
    - url: https://api.datagerry.com/rest
      description: DataGerry Cloud
    - url: https://{host}/rest
      description: Self-hosted DataGerry
      variables:
          host:
              default: datagerry.example.com
              description: Host name (and port, if not the default) of your DataGerry installation

