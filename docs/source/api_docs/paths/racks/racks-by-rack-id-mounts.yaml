post:
    tags:
        - Racks
    summary: Mount an Object into a Rack [OnPremise]
    description: |
        Required User Right: **base.framework.rack.edit**
        <br><hr><br>
        _Not available with the cloud API key (frontend only in the cloud); on self-hosted installations it is reachable with Basic auth._

        With no area the object is assigned to the rack without being placed in it (the UNASSIGNED bucket);
        with a main area it is placed, which requires a start slot and a height and is refused when the
        slots are taken or the mount would stick out of the rack

        An object that another Rack holds is MOVED here: its old mount is deleted and its place in the
        location tree follows. The frontend knows this is coming, because the picker row it was chosen from
        names the rack it is in. An object already in THIS rack is refused - a PATCH re-places it

        The whole request runs inside the rack's placement lock (``hold_rack_placement_lock``): the rack's height is
        read, the overlap checked and the mount written while no other placement on this rack can run, so two requests
        can never both claim the same slots

        **Errors:** 403 when the caller may not read and change the Rack or the object it moves (the object ACL), 400 when the object may not be mounted, the placement is invalid or the rack stays busy with another placement (``RACK_BUSY``), 404 when the Rack does not exist, 500 on an unexpected error
    parameters:
        -   name: rack_id
            in: path
            required: true
            description: public_id of the Rack the object is mounted into
            schema:
                type: integer
