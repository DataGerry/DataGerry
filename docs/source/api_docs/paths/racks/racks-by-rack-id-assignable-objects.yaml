    summary: List the Objects that can be mounted into a Rack [OnPremise]
    description: |
        Required User Right: **base.framework.rack.view**
        <br><hr><br>
        _Not available with the cloud API key (frontend only in the cloud); on self-hosted installations it is reachable with Basic auth._

        Three rules decide it: the object's type must declare a location field (a member is mirrored into the
        location tree, and that field is what records it), an object of a RACK-marked type is never mountable
        (Racks do not nest), and an object already in THIS rack can not be added to it again. All are appended
        behind the caller's own `?filter=`, so a filter can narrow the candidates but never widen them past
        the rules

        An object held by a DIFFERENT rack is offered, with `assigned_rack_id` / `assigned_rack_name` naming
        that rack: mounting it moves it. `?only_unmounted=true` narrows the list to the objects in no rack

        Guarded by the Rack's view right: this is a question, not a change. The candidates are read through the
        caller's READ ACL - a picker offers only what the caller may open, like the IPAM picker and
        `GET /objects/` - and the page total follows. A holding rack the caller may not read keeps its id in the
        hint, so the frontend still warns that the mount moves the object, and loses its name

        **Errors:** 403 when the caller may not read the Rack (the object ACL on its type), 400 when the object is not a Rack or one of the picker's reads fails (the Rack, the candidates, their details, the mounts, the types - each names its own), 404 when the Rack does not exist, 503 when the candidate read runs past its time budget, 500 on an unexpected error
