patch:
    tags:
        - Racks
    summary: Place, move, resize, reorder or unplace a mounted Object [OnPremise]
    description: |
        Required User Right: **base.framework.rack.edit**
        <br><hr><br>
        _Not available with the cloud API key (frontend only in the cloud); on self-hosted installations it is reachable with Basic auth._

        Only the keys the body carries are applied, so a request naming just an area moves the mount without
        touching its geometry. Setting the area to UNASSIGNED unplaces the object: its slots are freed and
        it stays a member of the Rack, with its height kept as a hint for re-placing it. The mount being
        changed is excluded from its own overlap check, so re-slotting does not collide with where it is

        A side list and the unassigned bucket are ordered by `position`, and naming one is how a row is
        reordered. A move into another of those areas without a position appends the row to its end

        Runs inside the rack's placement lock (``hold_rack_placement_lock``), like the POST, so the overlap check and the
        write cannot be interleaved with another placement on this rack

        **Errors:** 403 when the caller may not read and change the Rack or the object it moves (the object ACL), 400 when the requested placement is invalid or the rack stays busy with another placement (``RACK_BUSY``), 404 when the Rack or the mount does not exist, 500 on an unexpected error
    parameters:
