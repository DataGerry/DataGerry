delete:
    tags:
        - Racks
    summary: Remove an Object from a Rack [OnPremise]
    description: |
        Required User Right: **base.framework.rack.edit**
        <br><hr><br>
        _Not available with the cloud API key (frontend only in the cloud); on self-hosted installations it is reachable with Basic auth._

        Removes the MEMBERSHIP only - the CmdbObject itself is never touched and survives untouched. This is
        the stronger of the two removal verbs: to keep the object in the Rack but free its slots, PATCH its
        area to UNASSIGNED instead

        Note this is guarded by the Rack's edit right, not delete: deleting a Rack means deleting the Rack
        CmdbObject, while un-mounting is a change to the Rack's layout

        **Errors:** 403 when the caller may not read and change the Rack or the object it moves (the object ACL), 404 when the Rack or the mount does not exist, 400 when the delete fails, 500 on an unexpected error
    parameters:
        -   name: rack_id
            in: path
            required: true
            description: public_id of the Rack owning the mount
            schema:
                type: integer
        -   name: mount_id
            in: path
            required: true
            description: public_id of the CmdbRackMount to remove
            schema:
                type: integer
    operationId: delete_rack_mount
