post:
    tags:
        - MediaFiles
    summary: Upload a MediaFile into the library [OnPremise]
    description: |
        Required User Right: **base.framework.object.edit**
        <br><hr><br>
        _Not available with the cloud API key (frontend only in the cloud); on self-hosted installations it is reachable with Basic auth._

        Requires the ``base.framework.object.edit`` right. The file arrives as the ``file`` form part and its
        metadata as the ``metadata`` one; ``author_id`` and ``mime_type`` are server-owned. The metadata holds
        only declared keys, each of its declared type (``MEDIA_FILE_METADATA_SCHEMA``), the file's name follows
        the naming rule (``filename_problem``), and a ``parent`` names an existing folder

        Uploading over an entry of the same name in the same folder REPLACES it, in three steps
        (`MediaFilesManager.replace_file`): the new content is stored under a name of its own, the old entry is
        removed, and the new one takes the name. A refused or failing upload leaves the previous file intact; a
        failure of the last step leaves the new content in the folder under its ``replacing_(<ID>)_`` name. The
        replaced entry's reference and reference_type are carried over, because what points at the library entry
        must survive its content being replaced

        **Errors:** 403 when the user lacks the right; 400 when the request carries no usable file or metadata, its parent is no folder, another upload took the name in the meantime, or a read or write fails; 500 on an unexpected error
    operationId: add_new_file
    requestBody:
        required: true
        content:
            multipart/form-data:
                schema:
                    type: object
                    properties:
                        file:
                            type: string
                            format: binary
                        metadata:
                            type: string
    responses:
        '201':
            description: The stored MediaFile and its public_id
            content:
                application/json:
                    schema:
                        allOf:
                            -   $ref: ../../components/schemas/ApiResponses.yaml#/ResponseEnvelope
