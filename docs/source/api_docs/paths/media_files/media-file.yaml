                                        type: object
                                        additionalProperties: true
        '400':
            $ref: ../../components/responses.yaml#/BadRequest
        '401':
            $ref: ../../components/responses.yaml#/Unauthorized
        '403':
            $ref: ../../components/responses.yaml#/Forbidden
        '500':
            $ref: ../../components/responses.yaml#/InternalServerError
put:
    tags:
        - MediaFiles
    summary: Update a MediaFile's name, folder or metadata [OnPremise]
    description: |
        Required User Right: **base.framework.object.edit**
        <br><hr><br>
        _Not available with the cloud API key (frontend only in the cloud); on self-hosted installations it is reachable with Basic auth._

        Requires the ``base.framework.object.edit`` right. The body is the whole MediaFile document, held to
        ``MEDIA_FILE_UPDATE_SCHEMA``: an integer public_id, a usable filename and a metadata sub-document of
        declared keys and types, stored whole as an upload's is. The identity comes from the stored file, so a
        payload public_id can not rewrite it; the author is stamped as the last modifier and the mime type stays
        the stored one. Whether the entry is a folder can not change, and a new ``parent`` has to be an existing
        folder outside the moved entry's own subtree

        The ``attachment`` query parameter is required. With ``{"reference": true}`` the write only re-points
        a reference and the filename is taken as given; otherwise the name has to stay unique inside its
        folder, so a clashing one is renamed to ``copy_(n)_<name>``. The unique index over (filename,
        metadata.parent) has the last word: a name another entry took in the meantime is a 400

        **Errors:** 403 when the user lacks the right; 400 when the body or the ``attachment`` parameter is unusable, the update would change the folder flag or move the entry under a parent that is no folder or lies inside it, the name is taken, or a read or the update fails; 404 when no MediaFile carries the public_id; 500 on an unexpected error
    parameters:
        -   name: attachment
            in: query
            required: false
            description: The **attachment** query parameter
            schema:
                type: string
