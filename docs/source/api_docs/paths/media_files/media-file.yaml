            required: false
            description: Parameters for filtering, limiting, sorting and pagination (`filter`, `limit`, `sort`, `order`, `page`,
                `projection`)
            schema:
                $ref: ../../components/schemas/CollectionParameters.yaml
    operationId: get_file_list
