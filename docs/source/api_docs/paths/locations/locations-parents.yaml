    summary: Move several objects' location placements under one common parent [Cloud] [OnPremise]
    description: |
        Required User Right: **base.framework.location.edit**
        <br><hr><br>
        Powers a multi-select drag-and-drop. The body carries ``{object_ids: [...], parent}``. Every
        listed object is authorized FIRST (it exists, the caller's ACL grants READ and UPDATE on its type, the
        type is active), then validated (it has a location field, the parent exists, sits in a branch the caller can
        see, is selectable-as-parent, no cycle); if any target is denied (403) or invalid (400) the whole batch is
        rejected and nothing is written. Otherwise every placement is moved and mirrored. ``parent`` null /
        non-positive removes the placement from each listed object

        Requires the ``base.framework.location.edit`` right

        The pre-flight reads are batched: the listed objects are fetched in one ``$in`` query, each distinct
        type is resolved once, and the parent - which the whole batch shares - is validated once instead of
        per object (see ``validate_object_location_moves``). The per-object cycle check still runs
        individually, because it depends on where each object currently sits

        **Errors:** 403 when the user lacks the right, may not read or change a listed CmdbObject or a Rack one of them joins or leaves, its Type is deactivated, or the parent is hidden from the user; 404 when a listed CmdbObject does not exist; 400 when ``object_ids`` is not a non-empty list of integers, a target is invalid, a Rack rule refuses a move or a write fails; 500 on an unexpected error
