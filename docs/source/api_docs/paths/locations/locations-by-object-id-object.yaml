# -------------------------------------------------------------------------------------------------------------------- #
#                                             GET - LOCATION OF ONE OBJECT                                             #
# -------------------------------------------------------------------------------------------------------------------- #

get:
  tags:
      - Locations
      - Cloud
      - OnPremise
  summary: Retrieve the Location of one Object [Cloud] [OnPremise]
  description: |
      Required User Right: **base.framework.location.view**
      <br><hr><br>
      Returns the **Location** node of the **Object** with the given **object_id** - the node that mirrors the
      Object's placement in the location tree
  operationId: get_cmdb_location_for_object
  parameters:
      - name: object_id
        in: path
        description: The **public_id** of the **Object** whose Location should be retrieved
        required: true
        schema:
            type: integer
  responses:
      "200":
          description: The Object's **Location**, as the bare document
          content:
              application/json:
                  schema:
                      $ref: "../../components/schemas/CmdbLocation.yaml"
      "400":
          description: Failed to retrieve the **Location**
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "Failed to retrieve the Location for Object with ID: 42 from the database!"
      "404":
          description: The Object has no **Location** (it is not placed, or does not exist)
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "The Location for Object with ID:42 was not found!"
      "500":
          description: Internal server error
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "Internal server error"
