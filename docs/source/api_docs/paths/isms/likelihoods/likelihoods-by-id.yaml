      "400":
          description: Failed to update the requested Likelihood
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "Failed to update the requested Likelihood"
      "404":
          description: The requested Likelihood was not found
          content:
              application/json:
                  schema:
                      type: object
                      properties:
