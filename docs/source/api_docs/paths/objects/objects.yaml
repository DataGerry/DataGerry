                most 5000
            schema:
                type: array
                items:
                    type: integer
    operationId: patch_cmdb_objects
    requestBody:
        required: true
        content:
            application/json:
                schema:
                    type: object
                    description: Only these three keys are accepted; a body that sets no field and no active state is refused
