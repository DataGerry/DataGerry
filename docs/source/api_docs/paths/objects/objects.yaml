        own stored object exactly as the single PATCH merges it (``build_patched_object_data``): every field the body
        does not name keeps its value. Multi-data rows and the location name are per object and are not accepted.
        All or nothing, like the bulk PUT (``objects_bulk_update_helper``)

        **Errors:** 400 without ``objectIDs``, on an unusable or too large selection, a body that changes nothing or carries a key a bulk change may not, or a refused target; 403 / 404 for a target the caller may not change / that does not exist, and 403 when ``active`` would change a target's stored state without ``base.framework.object.activation`` - in every case nothing is written
    x-since: cloud 3.3.1+ / self-hosted 3.4
