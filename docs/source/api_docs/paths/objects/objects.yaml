                                        description: The new value (any JSON type, null allowed)
                                    type:
                                        type: string
                        comment:
                            type: string
                            nullable: true
                            description: Comment for the edit logs
                        active:
                            type: boolean
                            description: Activate / deactivate the Objects (needs base.framework.object.activation when it
                                changes a stored state)
    responses:
        '202':
            description: One updated payload per CmdbObject, in the order they were named
