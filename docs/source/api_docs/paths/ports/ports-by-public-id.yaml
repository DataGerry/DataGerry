delete:
    tags:
        - Ports
    summary: Delete a single Port [Cloud] [OnPremise]
    description: |
        Required User Right: **base.framework.port.delete**
        <br><hr><br>
        Deleting a port never touches the owner CmdbObject, but it does take the port's CONNECTIONS and
        its INTERFACE LINKS with it - neither may be left pointing at nothing. Both go first, because each
        is found through the port and a deleted port can no longer be looked up. The peers at the other
        ends simply become free, nothing about them is rewritten since `connected` is computed on read, and
        no CmdbObject's interface rows are touched - a link's interface half is a soft reference.

        **All or nothing** (`cascade.delete_ports_with_dependents` under `undone_on_failure`): a failure part-way
        restores the connections and links already deleted, then answers the 400; an undo that cannot finish
        answers a 500 naming what is left

        **Errors:** 403 when the owner's ACL denies it; 404 when the port or its owner does not exist; 500 on an unexpected error
    parameters:
        -   name: public_id
            in: path
            required: true
            description: public_id of the CmdbPort to delete
            schema:
                type: integer
    operationId: delete_cmdb_port
    responses:
        '202':
            description: The deleted resource is returned under `raw`
            content:
                application/json:
                    schema:
                        allOf:
                            -   $ref: ../../components/schemas/ApiResponses.yaml#/ResponseEnvelope
                            -   type: object
                                properties:
                                    raw:
                                        type: object
                                        additionalProperties: true
        '204':
            description: Deleted, nothing to report
        '400':
            $ref: ../../components/responses.yaml#/BadRequest
        '401':
            $ref: ../../components/responses.yaml#/Unauthorized
        '403':
            $ref: ../../components/responses.yaml#/Forbidden
        '404':
