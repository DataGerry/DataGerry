post:
    tags:
        - Ports
    summary: Link a Port to one IPAM interface row [Cloud] [OnPremise]
    description: |
        Required User Right: **base.framework.port.edit**
        <br><hr><br>
        The port comes from the URL, so a body can not disagree with it. The addressed interface row must
        live on the port's **own** CmdbObject - a body naming a different one is refused rather than
        silently corrected - and it has to exist: a link that is dangling from the moment it is created is
        a mistake, unlike one that goes dangling later.

        Several ports of the same object may link the same interface row; only the same port twice is
        refused, by the unique index on (port + interface triple)

        **Errors:** 400 when the row id, the relation type or the row itself is unusable, when the interface belongs to another CmdbObject, or when the link already exists (by the pre-check or, under a concurrent create, by the unique index); 403 when the port owner's ACL denies it; 404 when the port or the interface object does not exist; 500 when the write fails for any other reason, when the created link cannot be read back, or on an unexpected error
    parameters:
        -   name: port_id
            in: path
            required: true
            description: public_id of the CmdbPort to link
            schema:
                type: integer
