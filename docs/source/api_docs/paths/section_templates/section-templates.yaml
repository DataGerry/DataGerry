# -------------------------------------------------------------------------------------------------------------------- #
#                                                CREATE SECTION TEMPLATE                                               #
# -------------------------------------------------------------------------------------------------------------------- #

post:
    tags:
        - Section Templates
    summary: Insert a new Section Template [Cloud] [OnPremise]
    description: |
        Required User Right: **base.framework.sectionTemplate.add**
        <br><hr><br>
        Inserts a new Section Template into the database
        <br><br>
        The **public_id** property will be automatically created and don't need to be provided.
        <br><br>
        The template is passed in the **query string**, not in the body: the route reads its parameters with
        `parse_request_parameters`. Predefined templates cannot be created through the API.
    operationId: create_section_template
    parameters:
        - name: name
          in: query
          required: true
          description: The unique name of the Section Template (it cannot be changed afterwards)
          schema:
              type: string
        - name: label
          in: query
          required: true
          description: The label shown in the frontend
          schema:
              type: string
        - name: type
          in: query
          required: true
          description: The section type (e.g. section, multi-data-section)
          schema:
              type: string
        - name: is_global
          in: query
          required: true
          description: Whether the template is global
          schema:
              type: boolean
        - name: predefined
          in: query
          required: true
          description: Must be false - predefined templates cannot be created through the API
          schema:
              type: boolean
        - name: fields
          in: query
          required: true
          description: The fields of the template as a JSON-encoded list
          schema:
              type: string
    responses:
        "200":
            description: The **public_id** of created Section Template
            content:
                application/json:
                    schema:
                        type: integer
                        example: 24
        "400":
            description: Section Template could not be created
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            error:
                                type: string
                                example: "Section Template could not be created"
        "500":
            description: An unexpected error occured
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            error:
                                type: string
                                example: "Internal server error"

# -------------------------------------------------------------------------------------------------------------------- #
#                                                 GET SECTION TEMPLATES                                                #
# -------------------------------------------------------------------------------------------------------------------- #

get:
    tags: 
        - Section Templates
    summary: Retrieve multiple Section Templates [Cloud] [OnPremise]
    description: |
        Required User Right: **base.framework.sectionTemplate.view**
        <br><hr><br>
        Returns all Section Templates if no **CollectionParameters** are passed
    parameters: 
        - name: CollectionParameters
          in: query
          description: Parameters for filtering, limiting, sorting, and pagination of Section Templates
          required: false
          schema:
            $ref: '../../components/schemas/CollectionParameters.yaml'
    operationId: get_all_section_templates
    responses:
        "200":
            description: Returns a **list of Section Templates** matching the filter criteria
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            results:
                                $ref: '../../components/schemas/CmdbSectionTemplate.yaml'
                            total:
                                type: integer
                                description: The amount of Section Templates
        "400":
            description: Could not retrieve SectionTemplates
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            error:
                                type: string
                                example: "Could not retrieve SectionTemplates"
        "500":
            description: An unexpected error occured
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            error:
                                type: string
                                example: "Internal server error!"

