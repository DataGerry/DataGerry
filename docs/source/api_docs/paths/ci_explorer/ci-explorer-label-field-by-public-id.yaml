# /ci_explorer/label_field/{public_id}

put:
    tags:
        - CI Explorer
    summary: Nominate the field the CI Explorer shows on a Type's nodes [OnPremise]
    description: |
        Required User Right: **base.framework.ciExplorer.edit**
        <br><hr><br>
        _Not available with the cloud API key (frontend only in the cloud); on self-hosted installations it is reachable with Basic auth._

        _`PATCH` and `PUT` on this path run the same code._

        ``ci_explorer_label`` holds the **name of one of the Type's own fields**, not a label: the graph
        reads that field off every object of the Type and draws its value on the node, so one nomination
        gives "db-01", "web-02", … rather than one string repeated on every node. Sending ``null``
        clears it, and the nodes fall back to "no label selected".

        Requires the ``base.framework.ciExplorer.edit`` right, and READ on the Type's ACL - like every route on
        one Type, since the answer names the Type's fields. The body is ``{'ci_explorer_label':
        <field name | null>}``. A name the Type does not offer is refused with 400 rather than stored -
        an unresolvable nomination is invisible in the UI except as unlabelled nodes. Multi-data-section
        fields are not offered: their values live per row, and a node can only show one.

        Only that one key of the CmdbType is written, so a concurrent edit of the type's fields or
        sections can not be overwritten. It records no history entry, because DataGerry keeps a history
        for CmdbObjects only and this writes a CmdbType

        **Errors:** 403 when the user lacks the right or the caller's group may not READ the Type; 400 when the body is invalid, the nominated field is not one the Type offers, or the TypesManager fails; 404 when the Type does not exist; 500 on an unexpected failure
    parameters:
        -   name: public_id
            in: path
            required: true
            description: public_id of the CmdbType which should be updated
            schema:
                type: integer
    operationId: update_type_label_field
    requestBody:
        required: true
        content:
            application/json:
                schema:
                    type: object
                    properties:
                        ci_explorer_label:
                            type: string
                            nullable: true
                    required:
                        - ci_explorer_label
    responses:
        '200':
            description: The nominated field name and the names the Type offers, so a client can refresh its picker from the
                same answer
            content:
                application/json:
                    schema:
                        description: The value itself (no response envelope)
        '400':
            $ref: ../../components/responses.yaml#/BadRequest
        '401':
            $ref: ../../components/responses.yaml#/Unauthorized
        '403':
            $ref: ../../components/responses.yaml#/Forbidden
        '404':
            $ref: ../../components/responses.yaml#/NotFound
        '500':
            $ref: ../../components/responses.yaml#/InternalServerError
