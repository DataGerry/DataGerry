# -------------------------------------------------------------------------------------------------------------------- #
#                                                   GET - USER GROUP                                                   #
# -------------------------------------------------------------------------------------------------------------------- #

get:
  tags:
      - UserGroups
  summary: Retrieve a single UserGroup [Cloud] [OnPremise]
  description: |
      Required User Right: **base.user-management.group.view**
      <br><hr><br>
      Returns the **UserGroup** with the given **public_id**
  parameters:
      - name: public_id
        in: path
        description: The **public_id** of the **UserGroup** which should be retrieved
        required: true
        schema:
            type: integer
  operationId: get_cmdb_user_group
  responses:
      "200":
          description: Returns the **UserGroup** with the given **public_id**
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          result:
                              $ref: "../../components/schemas/CmdbUserGroup.yaml"
      "400":
          description: Failed to retrieve the requested **UserGroup**
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "Failed to retrieve the requested UserGroup from the database"
      "404":
          description: The **UserGroup** was not found
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "The UserGroup was not found"
      "500":
          description: An unexpected error occured
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "Internal server error"

