# -------------------------------------------------------------------------------------------------------------------- #
#                                                      UPDATE USER                                                     #
# -------------------------------------------------------------------------------------------------------------------- #

put:
    tags:
        - Users
    summary: Update a single User [OnPremise]
    description: |
        Required User Right: **base.user-management.user.edit**
        <br><hr><br>
        Updates the User with the given **public_id**
    parameters:
        - name: public_id
          in: path
          description: The **public_id** of the User which should be updated
          required: true
          schema:
              type: integer
    requestBody:
        required: true
        content:
            application/json:
                schema:
                    $ref: "../../components/schemas/CmdbUser.yaml"
    operationId: update_cmdb_user
    responses:
        "200":
            description: Returns the updated User with the given **public_id**
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            result:
                                $ref: "../../components/schemas/CmdbUser.yaml"
        "400":
            description: Failed to update the requested User
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            error:
                                type: string
                                example: "Failed to update the requested User"
        "404":
            description: The requested User was not found
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            error:
                                type: string
                                example: "The requested User was not found"
        "500":
            description: Internal server error
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            error:
                                type: string
                                example: "Internal server error"

# -------------------------------------------------------------------------------------------------------------------- #
#                                                       GET USER                                                       #
# -------------------------------------------------------------------------------------------------------------------- #

get:
    tags:
        - Users
    summary: Retrieve a single User [Cloud] [OnPremise]
    description: |
        Required User Right: **base.user-management.user.view**
        <br><hr><br>
        Returns the **User** with the given **public_id**
    parameters:
        - name: public_id
          in: path
          description: The **public_id** of the **User** which should be retrieved
          required: true
          schema:
              type: integer
    operationId: get_user
    responses:
        "200":
            description: Returns the **User** with the given **public_id**
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            result:
                                $ref: "../../components/schemas/CmdbUser.yaml"
        "400":
            description: Failed to retrieve the requested **User**
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            error:
                                type: string
                                example: "Failed to retrieve the requested User from the database"
        "404":
            description: The **User** was not found
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            error:
                                type: string
                                example: "The User was not found"
        "500":
            description: An unexpected error occured
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            error:
                                type: string
                                example: "Internal server error"

# -------------------------------------------------------------------------------------------------------------------- #
#                                                      DELETE USER                                                     #
# -------------------------------------------------------------------------------------------------------------------- #

delete: 
    tags:
        - Users
    summary: Delete a single User [OnPremise]
    description: |
        Required User Right: **base.user-management.user.delete**
        <br><hr><br>
        Deletes the User with the given **public_id**
    parameters:
        - name: public_id
          in: path
          description: The **public_id** of the User which should be deleted
          required: true
          schema:
              type: integer
    operationId: delete_cmdb_user
    responses:
        "200":
            description: Returns the User with the given **public_id** which was deleted
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            raw:
                                $ref: "../../components/schemas/CmdbUser.yaml"
        "400":
            description: Failed to delete the User
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            error:
                                type: string
                                example: "Failed to delete the User"
        "404":
            description: The requested User was not found
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            error:
                                type: string
                                example: "The requested User was not found"
        "500":
            description: Internal server error
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            error:
                                type: string
                                example: "Internal server error"

