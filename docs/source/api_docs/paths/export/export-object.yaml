        Export objects based on the provided parameters and the requesting user's permissions.

        This function handles the export of data objects in different formats (e.g., JSON, ZIP) based on the
        provided parameters. It first determines the export format class, loads it dynamically, and then processes
        the export according to the user's permissions and the current cloud mode setting.

        **Errors:** 400 Bad Request: If the requested export format is not supported, if the objects cannot be retrieved, or if the export cannot be produced as asked for - a CSV of a selection spanning several types, an unusable `metadata` override (an XML header entry that is no element name among them), a value an XML document cannot carry, or a Type whose field names would collide in a tabular column (every ExporterError) 403 Forbidden: If the user is not permitted to read the objects being exported 500 Internal Server Error: If the resolved export format module cannot be imported, or on any other unexpected error
