    summary: Export every Type the caller's group may READ as a downloadable JSON file [OnPremise]
    description: |
        Required User Right: **base.export.type.***
        <br><hr><br>
        _Not available with the cloud API key (frontend only in the cloud); on self-hosted installations it is reachable with Basic auth._

        Exports every CmdbType the caller's group may READ as a downloadable JSON file

        The catalogue is serialized into a formatted JSON attachment, ordered by ascending public_id. A type
        whose ACL does not grant the group READ is left out, as the type listing leaves it out - the filter
        is part of the query, so the hidden types are never read

        NOTE this route also answers a by-ids export whose id list came out EMPTY: `/export/type/` is
        what `/export/type/<public_ids>` collapses to when the caller joins an empty selection into the
        URL (the frontend builds it that way). The two requests are byte-identical, so "export nothing"
        cannot be told apart from "export everything" here - a caller that must not export the whole
        catalogue has to refuse an empty selection before it sends the request

        **Errors:** 400 if the types could not be retrieved, 500 if a Type could not be serialized or on an unexpected error
