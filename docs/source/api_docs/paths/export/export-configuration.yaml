# /export/configuration

post:
    tags:
        - Export
    summary: Export the user-defined configuration as a downloadable JSON file [Cloud] [OnPremise]
    description: |
        Required User Right: **base.system.export**
        <br><hr><br>
        **New after 3.3.0:** available in the cloud now, on self-hosted installations from 3.4.

        Exports the user-defined configuration as a downloadable JSON file

        Every registered component writes its section - the documents as stored (without `_id`), in public_id order,
        and its counter. The type ACLs travel along as stored; the import drops them. The file is stamped with the
        database's updater version, read strictly: without a valid one no importable file can be produced. Its
        `information` carries the body's name and description, the DataGerry release and the entries per component;
        its `meta` is written empty, to be filled in by hand for a best-practice model. A POST although nothing is
        written: the export takes a body

        **Errors:** 403 without ``base.system.export``, 400 for a body that does not fit the schema, 500 when the database records no valid version or a component could not be read
    x-since: cloud 3.3.1+ / self-hosted 3.4
    operationId: export_configuration_file
    requestBody:
        required: true
        content:
            application/json:
                schema:
                    type: object
                    properties:
                        name:
                            type: string
                            maxLength: 255
                            minLength: 1
                            pattern: (?s).*\S.*
                        description:
                            type: string
                            maxLength: 4000
                            default: ''
                        filename:
                            type: string
                            nullable: true
                            maxLength: 255
                    required:
                        - name
    responses:
