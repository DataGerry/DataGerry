        this route at all - the URL then collapses onto the whole-catalogue export, see
        `export_cmdb_types`

        **Errors:** 400 if an id is not a plain positive number or the types could not be retrieved, 403 if a selected Type may not be read by the caller's group, 500 if a Type could not be serialized or on an unexpected error
