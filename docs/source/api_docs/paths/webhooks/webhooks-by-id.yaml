# -------------------------------------------------------------------------------------------------------------------- #
#                                                     GET - WEBHOOK                                                    #
# -------------------------------------------------------------------------------------------------------------------- #

get:
  tags:
      - Webhooks
  summary: Retrieve a single Webhook [Cloud] [OnPremise]
  description: |
      Returns the **Webhook** with the given **public_id**
  parameters:
      - name: public_id
        in: path
        description: The **public_id** of the **Webhook** which should be retrieved
        required: true
        schema:
            type: integer
  operationId: get_webhook
  responses:
      "200":
          description: Returns the **Webhook** with the given **public_id**
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          result:
                              $ref: "../../components/schemas/CmdbWebhook.yaml"
      "400":
          description: Failed to retrieve the requested **Webhook**
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "Failed to retrieve the requested Webhook from the database"
      "500":
          description: An unexpected error occured
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "Internal server error"

# -------------------------------------------------------------------------------------------------------------------- #
#                                                   UPDATE - WEBHOOK                                                   #
# -------------------------------------------------------------------------------------------------------------------- #

put:
  tags:
      - Webhooks
  summary: Update a single Webhook [Cloud] [OnPremise]
  description: |
      Updates the Webhook with the given **public_id**
  parameters:
      - name: public_id
        in: path
        description: The **public_id** of the Webhook which should be updated
        required: true
        schema:
            type: integer
  requestBody:
      required: true
      content:
          application/json:
              schema:
                  $ref: "../../components/schemas/CmdbWebhook.yaml"
  operationId: update_webhook
  responses:
      "200":
          description: Returns the updated Webhook with the given **public_id**
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          result:
                              $ref: "../../components/schemas/CmdbWebhook.yaml"
      "400":
          description: Failed to update the requested Webhook
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "Failed to update the requested Webhook"
      "404":
          description: The requested Webhook was not found
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "The requested Webhook was not found"
      "500":
          description: Internal server error
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "Internal server error"

# -------------------------------------------------------------------------------------------------------------------- #
#                                                   DELETE - WEBHOOK                                                   #
# -------------------------------------------------------------------------------------------------------------------- #

delete: 
  tags:
      - Webhooks
  summary: Delete a single Webhook [Cloud] [OnPremise]
  description: |
      Deletes the Webhook with the given **public_id**
  parameters:
      - name: public_id
        in: path
        description: The **public_id** of the Webhook which should be deleted
        required: true
        schema:
            type: integer
  operationId: delete_webhook
  responses:
      "200":
          description: Returns the Webhook with the given **public_id** which was deleted
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          raw:
                              $ref: "../../components/schemas/CmdbWebhook.yaml"
      "400":
          description: Failed to delete the Webhook
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "Failed to delete the Webhook"
      "404":
          description: The requested Webhook was not found
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "The requested Webhook was not found"
      "500":
          description: Internal server error
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "Internal server error"

