# /ipam/subnet/overview/{public_id}/unassign

post:
    tags:
        - IPAM
    summary: Unassign one or more dg-ipam-interface rows from the subnet [Cloud] [OnPremise]
    description: |
        Required User Right: **base.framework.ipam.edit**
        <br><hr><br>
        Each entry in the request's ``ips`` list identifies one currently-assigned IP of the subnet;
        the route locates its owner CmdbObject(s) and applies the chosen ``mode`` to the matching
        rows, then writes each owner with a partial ``ObjectsManager.update_object`` - the owner's
        ``multi_data_sections``, its version bump and the edit stamp; the ACL is checked per owner. Every
        written owner then gets an EDIT change-log entry and an UPDATE webhook, both best-effort. The
        ``mode`` is a single selection for the whole request (not per IP):
          - 'reference' (default): flip the row's ``dg-interface-subnet`` value to None - the row, its
            IP and MAC are kept; it is just detached from the subnet
          - 'row': delete the whole matching dg-ipam-interface row (this edits the owner object to
            drop the row; it does not delete the owner CmdbObject)
        Other interface rows on the same owner (referencing other subnets or non-target IPs of the
        same subnet) are left untouched

        **Validation** is all-or-nothing: if any requested IP is not currently assigned within the
        subnet, the route aborts 400 with the offending IPs and no write happens. Bad input shape (a
        body that is not a JSON object, missing list, empty list, non-string entry, non-canonical IP, IP
        outside the subnet, unknown mode, more than ``IpamUnassignLimits.MAX_IPS`` IPs - the last one before
        anything is read) also aborts 400 before any database write. Aborts 404 when the
        subnet does not exist and 400 when the public_id refers to a non-subnet object, no SUBNET
        CmdbType is defined, or the subnet's network-range field is missing / unparsable

        **The write phase is NOT atomic.** Once validation passes, each affected owner is written
        separately through ``ObjectsManager.update_object`` and there is no cross-owner transaction, so a
        failure part-way leaves the already-written owners unassigned while the response carries the
        error instead of a count; those owners still get their change log and webhook. The most likely
        trigger is object-level ACL: ``update_object`` enforces UPDATE permission per owner, so a user
        allowed to edit some owners but not others gets the allowed ones unassigned and a 403 for the
        first one they may not touch. Callers that need an exact picture after an error must re-read the
        subnet overview

        **An owner edited in between is not overwritten.** Each owner's write lands only while it still holds the
        sections, version and type it was planned from; a concurrent edit makes it miss, and the owner is read
        again and the unassign planned again from what is stored now. An owner that changed under every attempt
        stops the request with a 400 naming it - the owners before it stay written

        Body:
            ips (list[str]): canonical IPv4 / IPv6 strings to unassign; must be non-empty, each
                parseable, each within the subnet. Duplicates are silently collapsed while preserving
                input order
            mode (str, optional): 'reference' (clear the subnet ref, default) or 'row' (delete the
                whole row); applies to every IP in the request

        **Errors:** 400 when the body is not a JSON object, when `ips` is missing / empty / holds a non-string / names more than ``IpamUnassignLimits.MAX_IPS`` IPs, when an IP is not canonical, is outside the subnet or is not currently assigned, when an owner kept changing under every write attempt, when `mode` is unknown, when the public_id refers to a non-subnet object, when no SUBNET CmdbType is defined or when the subnet's network-range field is missing / unparsable; 403 when the object ACL denies UPDATE on an owner (see the atomicity note above - the owners written before it stay unassigned); 404 when the subnet does not exist; 500 on an unexpected error
