    summary: Export a subnet's IP rows as a CSV (.csv) file [OnPremise]
    description: |
        Required User Right: **base.framework.ipam.view**
        <br><hr><br>
        _Not available with the cloud API key (frontend only in the cloud); on self-hosted installations it is reachable with Basic auth._

        Returns the subnet's IP table as a single CSV table with the columns IP, type, status,
        assigned-to and MAC address. An IPv4 subnet exports all assignable addresses (free + assigned);
        an IPv6 subnet exports only the assigned addresses. The file is returned as an attachment
        download.

        The export is capped at IpamSubnetIpsExport.MAX_EXPORT_ROWS rows: a subnet whose export would
        exceed it aborts 400 ('too big') and no file is built. Aborts 404 when the subnet does not
        exist and 400 when the public_id refers to a non-subnet object or the subnet's network range is
        missing / unparsable

        **Errors:** 400 when the public_id refers to a non-subnet object, when no SUBNET CmdbType is defined, when the subnet's network range is missing / unparsable, or when the export would exceed IpamSubnetIpsExport.MAX_EXPORT_ROWS rows; 404 when the subnet does not exist; 500 on an unexpected error
