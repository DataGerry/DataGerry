name: Release
on:
  release:
    types: [published]
  # manual run for an existing tag, e.g. to repeat a failed release build
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag, e.g. 3.3.0'
        required: true

jobs:
  # All GitHub actions run on the host runner. Only "make" runs inside the CI image
  # becongmbh/datagerry_ci (see "build DATAGERRY"), because current actions need a
  # Node.js runtime that the CI image cannot provide.
  build:
    runs-on: ubuntu-24.04
    steps:
    - name: checkout the source code
      uses: actions/checkout@v7
      with:
        ref: ${{ github.event.release.tag_name || inputs.tag }}

    # tag name with "/" replaced by "-"
    - name: extract Github tag name
      run: echo "TAG=${RELEASE_TAG//\//-}" >> "$GITHUB_ENV"
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    - name: setup version strings
      run: |
        echo "VERSION_STRING=$(echo ${TAG})" >> $GITHUB_ENV
        echo "VERSION_ID=$(echo ${TAG})" >> $GITHUB_ENV
        echo "VERSION_PATH=$(echo ${TAG})" >> $GITHUB_ENV
        echo "VERSION_DOCKER_TAG=$(echo ${TAG})" >> $GITHUB_ENV

    - name: prepare SBOM output directory
      run: mkdir -p sbom

    # CRA: SBOM of the source dependencies (requirements.txt, app/package-lock.json)
    # generated before the build so build outputs / node_modules are not scanned
    - name: generate SBOM (source dependencies)
      uses: anchore/sbom-action@v0
      with:
        path: .
        format: cyclonedx-json
        output-file: sbom/datagerry-${{ env.TAG }}-source.cdx.json
        upload-artifact: false
        upload-release-assets: false

    # The Docker socket is mounted so that "make docker" builds the images on the
    # runner's Docker daemon, where the SBOM and push steps below find them.
    - name: build DATAGERRY
      run: |
        docker run --rm \
          -v "$GITHUB_WORKSPACE:/src" -w /src \
          -v /var/run/docker.sock:/var/run/docker.sock \
          -e BUILDVAR_VERSION="$VERSION_STRING" \
          -e BUILDVAR_VERSION_EXT="$VERSION_ID" \
          -e BUILDVAR_DOCKER_TAG="$VERSION_DOCKER_TAG" \
          --entrypoint make \
          becongmbh/datagerry_ci -e

    # CRA: SBOMs of the Docker images built by "make docker"
    - name: generate SBOM (backend image)
      uses: anchore/sbom-action@v0
      with:
        image: becongmbh/datagerry-backend:${{ env.VERSION_DOCKER_TAG }}
        format: cyclonedx-json
        output-file: sbom/datagerry-${{ env.TAG }}-backend-image.cdx.json
        upload-artifact: false
        upload-release-assets: false

    - name: generate SBOM (frontend image)
      uses: anchore/sbom-action@v0
      with:
        image: becongmbh/datagerry-frontend:${{ env.VERSION_DOCKER_TAG }}
        format: cyclonedx-json
        output-file: sbom/datagerry-${{ env.TAG }}-frontend-image.cdx.json
        upload-artifact: false
        upload-release-assets: false

    - name: store SBOMs as workflow artifact
      uses: actions/upload-artifact@v7
      with:
        name: sbom
        path: sbom/*.cdx.json
        if-no-files-found: error

    - name: install sshpass
      run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

    - name: copy artifacts to files.datagerry.com
      run: |
        sshpass -p "$SCP_PASS" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $SCP_USER@$SCP_HOST "mkdir -p $SCP_PATH/$VERSION_PATH/bin"
        sshpass -p "$SCP_PASS" scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null target/bin/datagerry $SCP_USER@$SCP_HOST:$SCP_PATH/$VERSION_PATH/bin
        sshpass -p "$SCP_PASS" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $SCP_USER@$SCP_HOST "mkdir -p $SCP_PATH/$VERSION_PATH/rpm"
        sshpass -p "$SCP_PASS" scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null target/rpm/RPMS/x86_64/DATAGERRY-*.rpm  $SCP_USER@$SCP_HOST:$SCP_PATH/$VERSION_PATH/rpm
        sshpass -p "$SCP_PASS" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $SCP_USER@$SCP_HOST "mkdir -p $SCP_PATH/$VERSION_PATH/targz"
        sshpass -p "$SCP_PASS" scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null target/targz/datagerry-*.tar.gz  $SCP_USER@$SCP_HOST:$SCP_PATH/$VERSION_PATH/targz
      env:
        SCP_HOST: ${{ secrets.SCP_HOST }}
        SCP_USER: ${{ secrets.SCP_USER }}
        SCP_PASS: ${{ secrets.SCP_PASS }}
        SCP_PATH: ${{ secrets.SCP_PATH_FILES }}

    - name: copy documentation to docs.datagerry.com
      run: |
        sshpass -p "$SCP_PASS" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $SCP_USER@$SCP_HOST "mkdir -p $SCP_PATH/$VERSION_PATH"
        sshpass -p "$SCP_PASS" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $SCP_USER@$SCP_HOST "rm -Rf $SCP_PATH/$VERSION_PATH/*"
        sshpass -p "$SCP_PASS" scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -r target/docs/*  $SCP_USER@$SCP_HOST:$SCP_PATH/$VERSION_PATH
      env:
        SCP_HOST: ${{ secrets.SCP_HOST }}
        SCP_USER: ${{ secrets.SCP_USER }}
        SCP_PASS: ${{ secrets.SCP_PASS }}
        SCP_PATH: ${{ secrets.SCP_PATH_DOCS }}

    # images are built by "make docker" as becongmbh/datagerry-{backend,frontend}
    # (see Makefile and docs/source/sources/docker.rst)
    - name: publish docker images to hub.docker.com
      run: |
        echo "$DOCKER_TOKEN" | docker login --username "$DOCKER_USER" --password-stdin
        for img in becongmbh/datagerry-backend becongmbh/datagerry-frontend; do
          docker push "$img:$VERSION_DOCKER_TAG"
          # "latest" only for regular releases, not for pre-releases
          if [ "$PRERELEASE" != "true" ]; then
            docker push "$img:latest"
          fi
        done
      env:
        DOCKER_USER: ${{ secrets.DOCKER_USER }}
        DOCKER_TOKEN: ${{ secrets.DOCKER_TOKEN }}
        PRERELEASE: ${{ github.event.release.prerelease || false }}

  # CRA: attach SBOMs to the GitHub release and archive them (WORM) in Azure Blob Storage.
  # Separate job so the archive step also runs (and reports) if a publish step above fails.
  sbom-archive:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
    - name: download SBOMs
      uses: actions/download-artifact@v8
      with:
        name: sbom
        path: sbom

    - name: check SBOMs are not empty
      run: |
        for f in sbom/*.cdx.json; do
          n=$(jq '.components | length' "$f")
          v=$(jq -r '.specVersion' "$f")
          echo "$f: CycloneDX $v, $n components"
          if [ "$n" -lt 10 ]; then echo "::error::$f has only $n components"; exit 1; fi
          # BSI TR-03183-2 requires CycloneDX >= 1.5
          case "$v" in 1.5|1.6|1.7) ;; *) echo "::error::$f uses CycloneDX $v (< 1.5)"; exit 1;; esac
        done

    - name: attach SBOMs to GitHub release
      run: gh release upload "$RELEASE_TAG" sbom/*.cdx.json --clobber --repo "$GITHUB_REPOSITORY"
      env:
        GH_TOKEN: ${{ github.token }}

    - name: archive SBOMs in Azure Blob Storage
      run: |
        az storage blob upload-batch \
          --destination sbom \
          --destination-path "datagerry/${RELEASE_TAG//\//-}" \
          --source sbom --pattern "*.cdx.json"
      env:
        AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.SBOM_STORAGE_CONN }}
