# Runs when a GitHub release is published. It does NOT build or publish
# packages or Docker images - those are built separately (packages on
# Buildkite, images pushed to Docker Hub). This workflow only:
#   - builds the documentation and publishes it to docs.datagerry.com
#   - generates the CRA SBOMs (source dependencies and the published images),
#     attaches them to the release and archives them in Azure Blob Storage
# SBOMs for older releases, or after the images were pushed later, can be
# (re)generated with the "SBOM (manual)" workflow.
name: Release
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  docs:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
    - name: checkout the source code
      uses: actions/checkout@v7

    - name: set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip

    # "make docs" installs requirements.txt and builds into target/docs
    - name: build documentation
      run: make -e docs BUILDVAR_VERSION="${TAG//\//-}"

    - name: install sshpass
      run: sudo apt-get update && sudo apt-get install -y sshpass

    - name: copy documentation to docs.datagerry.com
      run: |
        VERSION_PATH="${TAG//\//-}"
        sshpass -p "$SCP_PASS" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $SCP_USER@$SCP_HOST "mkdir -p $SCP_PATH/$VERSION_PATH"
        sshpass -p "$SCP_PASS" ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $SCP_USER@$SCP_HOST "rm -Rf $SCP_PATH/$VERSION_PATH/*"
        sshpass -p "$SCP_PASS" scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -r target/docs/*  $SCP_USER@$SCP_HOST:$SCP_PATH/$VERSION_PATH
      env:
        SCP_HOST: ${{ secrets.SCP_HOST }}
        SCP_USER: ${{ secrets.SCP_USER }}
        SCP_PASS: ${{ secrets.SCP_PASS }}
        SCP_PATH: ${{ secrets.SCP_PATH_DOCS }}

  # CRA: SBOMs of the source dependencies and of the published Docker images,
  # attached to the GitHub release and archived (WORM) in Azure Blob Storage.
  sbom:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
    - name: checkout the source code
      uses: actions/checkout@v7

    - name: prepare SBOM output directory
      run: mkdir -p sbom

    # (requirements.txt, app/package-lock.json)
    - name: generate SBOM (source dependencies)
      uses: anchore/sbom-action@v0
      with:
        path: .
        format: cyclonedx-json
        output-file: sbom/datagerry-${{ env.TAG }}-source.cdx.json
        upload-artifact: false
        upload-release-assets: false

    # published images are pulled from Docker Hub; missing tags are skipped with a warning
    # (push the images before publishing the release, or run "SBOM (manual)" afterwards)
    - name: check which published images exist
      id: images
      run: |
        for c in backend frontend; do
          if docker manifest inspect "becongmbh/datagerry-$c:$TAG" >/dev/null 2>&1; then
            echo "$c=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::becongmbh/datagerry-$c:$TAG not found on Docker Hub - skipping image SBOM"
            echo "$c=false" >> "$GITHUB_OUTPUT"
          fi
        done

    - name: generate SBOM (backend image)
      if: steps.images.outputs.backend == 'true'
      uses: anchore/sbom-action@v0
      with:
        image: becongmbh/datagerry-backend:${{ env.TAG }}
        format: cyclonedx-json
        output-file: sbom/datagerry-${{ env.TAG }}-backend-image.cdx.json
        upload-artifact: false
        upload-release-assets: false

    - name: generate SBOM (frontend image)
      if: steps.images.outputs.frontend == 'true'
      uses: anchore/sbom-action@v0
      with:
        image: becongmbh/datagerry-frontend:${{ env.TAG }}
        format: cyclonedx-json
        output-file: sbom/datagerry-${{ env.TAG }}-frontend-image.cdx.json
        upload-artifact: false
        upload-release-assets: false

    - name: check SBOMs are not empty
      run: |
        for f in sbom/*.cdx.json; do
          n=$(jq '.components | length' "$f")
          v=$(jq -r '.specVersion' "$f")
          echo "$f: CycloneDX $v, $n components"
          if [ "$n" -lt 10 ]; then echo "::error::$f has only $n components"; exit 1; fi
          # BSI TR-03183-2 requires CycloneDX >= 1.5
          case "$v" in 1.5|1.6|1.7) ;; *) echo "::error::$f uses CycloneDX $v (< 1.5)"; exit 1;; esac
        done

    - name: store SBOMs as workflow artifact
      uses: actions/upload-artifact@v7
      with:
        name: sbom
        path: sbom/*.cdx.json
        if-no-files-found: error

    - name: attach SBOMs to GitHub release
      run: gh release upload "$TAG" sbom/*.cdx.json --clobber --repo "$GITHUB_REPOSITORY"
      env:
        GH_TOKEN: ${{ github.token }}

    - name: archive SBOMs in Azure Blob Storage
      run: |
        az storage blob upload-batch \
          --destination sbom \
          --destination-path "datagerry/${TAG//\//-}" \
          --source sbom --pattern "*.cdx.json"
      env:
        AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.SBOM_STORAGE_CONN }}
