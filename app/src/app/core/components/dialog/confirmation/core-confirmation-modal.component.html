<dg-modal icon="fas fa-circle-question" [title]="title" titleId="confirmation-title"
  (dismiss)="activeModal.dismiss('cancel')">

  <div id="confirmation-message" class="confirmation-lead">
    {{ message }}
  </div>

  @if (warningMessage) {
  <app-warning-alert [title]="warningTitle" [message]="warningMessage" [iconClass]="warningIconClass">
  </app-warning-alert>
  }

  @if (confirmationText) {
  <app-form-input class="confirmation-input" [label]="'Type ' + confirmationText + ' to confirm'"
    [formControl]="confirmationControl" (keydown.enter)="confirm()"></app-form-input>
  }

  <app-button dgModalFooter [bootstrapClass]="'btn-secondary'" [label]="cancelButtonText" type="button"
    (clicked)="activeModal.dismiss()">
  </app-button>

  <app-button dgModalFooter [bootstrapClass]="confirmButtonClass" [label]="confirmButtonText" type="button"
    [disabled]="!canConfirm" (clicked)="confirm()">
  </app-button>
</dg-modal>
