<div class="premium-modal">
  <app-button class="premium-modal__close" variant="ghost" tone="neutral" size="sm" icon="fas fa-times" [pill]="true"
              ariaLabel="Close upgrade dialog" (clicked)="onDismiss()">
  </app-button>

  <div class="premium-modal__hero">
    <span class="premium-modal__badge">
      <i class="fas fa-crown" aria-hidden="true"></i>
      {{ editionLabel }}
    </span>

    <span class="premium-modal__icon">
      <i [class]="icon" aria-hidden="true"></i>
    </span>
  </div>

  <div class="premium-modal__body">
    <h2 id="premium-feature-title" class="premium-modal__title">{{ title }}</h2>
    <p class="premium-modal__subtitle">{{ subtitle }}</p>
    <p id="premium-feature-description" class="premium-modal__description">{{ description }}</p>

    @if (benefits.length) {
    <ul class="premium-modal__benefits">
      @for (benefit of benefits; track benefit) {
      <li class="premium-modal__benefit">
        <span class="premium-modal__benefit-icon">
          <i class="fas fa-check" aria-hidden="true"></i>
        </span>
        <span class="premium-modal__benefit-label">{{ benefit }}</span>
      </li>
      }
    </ul>
    }
  </div>

  <div class="premium-modal__footer">
    <app-button variant="outline" tone="neutral" size="lg" [pill]="true" [label]="secondaryActionLabel"
                (clicked)="onDismiss()">
    </app-button>

    <app-button variant="solid" tone="brand" size="lg" [pill]="true" [block]="true" [label]="primaryActionLabel"
                icon="fas fa-arrow-right" iconPosition="end" (clicked)="onUpgrade()">
    </app-button>
  </div>
</div>
