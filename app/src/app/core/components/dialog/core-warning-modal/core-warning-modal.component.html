<dg-modal [icon]="warningIconClass" [title]="title" (dismiss)="cancel()">

    <app-warning-alert [title]="warningTitle" [message]="message" [iconClass]="warningIconClass">
    </app-warning-alert>

    @if (cancelLabel) {
    <app-button dgModalFooter variant="outline" tone="neutral" [label]="cancelLabel" type="button"
        (clicked)="cancel()">
    </app-button>
    }

    @if (confirmLabel) {
    <app-button dgModalFooter variant="solid" tone="danger" [label]="confirmLabel" type="button"
        (clicked)="navigate()">
    </app-button>
    }
</dg-modal>
