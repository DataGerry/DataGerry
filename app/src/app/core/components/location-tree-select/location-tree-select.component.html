<div class="lts-field">
    <button type="button" class="form-control lts-display" (click)="openPicker()" [disabled]="disabled"
        [class.has-clear]="clearable && selectedId != null && !disabled" aria-haspopup="dialog">
        @if (display) {
        <i class="lts-icon" [class]="display.icon" aria-hidden="true"></i>
        <span class="lts-text">{{ display.name }}</span>
        } @else {
        <span class="lts-text lts-placeholder">{{ placeholder }}</span>
        }
        <i class="lts-affordance fas fa-sitemap" aria-hidden="true"></i>
    </button>

    @if (clearable && selectedId != null && !disabled) {
    <app-button class="lts-clear" variant="ghost" tone="neutral" size="xs" icon="fas fa-times"
        ariaLabel="Clear selected location" (click)="$event.stopPropagation()" (clicked)="clear()">
    </app-button>
    }
</div>
