<div class="mb-3" (keydown)="$event.stopPropagation()">
  @if (label) {
<label class="form-label" [attr.for]="controlId">
    {{ label }}
    @if (required) {
<span class="text-danger">*</span>
}
  </label>
}

  <ng-select [labelForId]="controlId" [items]="items" [bindLabel]="bindLabel" [bindValue]="bindValue"
    [multiple]="multiple"
    [placeholder]="placeholder" [disabled]="disabled" [clearable]="true" [(ngModel)]="value"
    [dropdownPosition]="dropdownDirection" [appendTo]="appendTo" (change)="onValueChange($event)" (blur)="onTouched()"
    [groupBy]="groupBy" [loading]="loading" [typeahead]="typeahead" (scrollToEnd)="scrolledToEnd.emit()">
    @if (showSelectAllToggle) {

      <ng-template ng-header-tmp>
        <div class="select-all-header">
          <app-button variant="link" tone="brand" size="sm" label="Select All" icon="far fa-check-square"
                      [disabled]="allSelectableSelected" (clicked)="selectAll()">
          </app-button>
          <span class="select-all-divider" aria-hidden="true"></span>
          <app-button variant="link" tone="brand" size="sm" label="Deselect All" icon="far fa-square"
                      [disabled]="!hasSelection" (clicked)="deselectAll()">
          </app-button>
        </div>
      </ng-template>
    
}
  </ng-select>

  @if (errorMessage) {
    <div class="invalid-feedback d-block" [id]="controlId + '-error'">
      {{ errorMessage }}
    </div>
  }
</div>
