<div class="mb-3">
    @if (label) {
<label class="mb-1 mt-3">
      {{ label }}
      @if (required) {
<span class="text-danger">*</span>
}
    </label>
}
    <textarea
      class="form-control"
      [disabled]="disabled"
      [placeholder]="placeholder"
      [rows]="rows"
      (input)="onInput($event)"
      (blur)="onBlur()"
    >{{ value }}</textarea>
  
    <!-- dedicated area for errors -->
    @if (errorMessage) {
<div class="invalid-feedback d-block">
      {{ errorMessage }}
    </div>
}
  </div>
