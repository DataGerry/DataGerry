<button
  [type]="type()"
  [class]="buttonClass()"
  [disabled]="isInactive()"
  [attr.title]="title() || null"
  [attr.aria-label]="accessibleName()"
  [attr.aria-pressed]="ariaPressed()"
  [attr.aria-expanded]="ariaExpanded()"
  [attr.aria-controls]="ariaControls() || null"
  [attr.aria-haspopup]="ariaHasPopup() || null"
  [attr.aria-busy]="loading() ? 'true' : null"
  (click)="onClick()"
>
  @if (loading()) {
    <span class="dg-button__spinner" aria-hidden="true"></span>
  } @else if (icon() && iconPosition() === 'start') {
    <i [class]="icon()" aria-hidden="true"></i>
  }

  @if (displayLabel()) {
    <span class="dg-button__label">{{ displayLabel() }}</span>
  }

  @if (!loading() && icon() && iconPosition() === 'end') {
    <i [class]="icon()" aria-hidden="true"></i>
  }

  @if (badge() !== null) {
    <span class="dg-button__badge">{{ badge() }}</span>
  }
</button>
