<button
  [type]="type"
  [disabled]="disabled"
  class="btn"
  [ngClass]="bootstrapClass"
  [style.padding]="padding"
  [attr.title]="title || null"
  [attr.aria-label]="ariaLabel || null"
  [attr.aria-pressed]="ariaPressed"
  [attr.aria-expanded]="ariaExpanded"
  (click)="onClick()"
>
  @if (icon) {
    <i [class]="icon" aria-hidden="true"></i>
  }
  {{ label }}
</button>
