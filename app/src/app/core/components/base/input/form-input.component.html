<div class="mb-3">
    @if (label) {
<label class="form-label mb-1 mt-3">
      {{ label }}
      @if (required) {
<span class="text-danger">*</span>
}
    </label>
}
    <input
      [type]="type"
      class="form-control"
      [disabled]="disabled"
      [placeholder]="placeholder"
      [value]="value"
      (input)="onInput($event)"
      (blur)="onBlur()"
      [readonly]="readonly"
      [class.bg-light]="readonly"
      [class.text-muted]="readonly"
    />
    @if (errorMessage) {
<div class="invalid-feedback d-block">
      {{ errorMessage }}
    </div>
}
  </div>
