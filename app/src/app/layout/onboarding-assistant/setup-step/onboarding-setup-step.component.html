<div class="onboarding__panel">
  <div class="onboarding__heading">
    <h2 id="onboarding-title" class="onboarding__title">Setup</h2>
    <p class="onboarding__lead">Your data model is set up for this environment, edition and pro features.</p>
  </div>

  <dl class="onboarding__detect">
    @for (item of summary(); track item.id) {
    <div class="onboarding__tile">
      <span class="onboarding__chip" aria-hidden="true"><i [class]="item.icon"></i></span>
      <dt>{{ item.title }}</dt>
      <dd>{{ item.value }}</dd>
      @if (item.detail) {
        <dd class="onboarding__tile-meta">{{ item.detail }}</dd>
      }
    </div>
    }
  </dl>
</div>
