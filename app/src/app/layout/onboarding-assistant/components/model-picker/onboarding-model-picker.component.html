@if (cards().length) {
<section #section class="onboarding-models" aria-labelledby="best-practice-title">
  <div class="onboarding-models__header">
    <div class="onboarding-models__heading">
      <h3 id="best-practice-title" class="onboarding-models__title">Choose a model</h3>
      <span class="onboarding-models__count" aria-live="polite">{{ countText() }}</span>
    </div>

    <app-form-input class="onboarding-models__search" type="search" ariaLabel="Search models"
      placeholder="Search models" [formControl]="search"></app-form-input>
  </div>

  <fieldset class="onboarding-models__list">
    <legend class="visually-hidden">Best practice model</legend>

    @for (card of filteredCards(); track card.model_id) {
    <div class="onboarding-model" [class.onboarding-model--selected]="bestPractice.selectedModelId() === card.model_id"
      [class.onboarding-model--locked]="!card.applicable">
      <label class="onboarding-model__select">
        <input type="radio" name="best-practice-model" class="visually-hidden" [value]="card.model_id"
          [checked]="bestPractice.selectedModelId() === card.model_id" [disabled]="!card.applicable"
          (change)="onModelSelected(card.model_id)" [attr.aria-labelledby]="'model-title-' + card.model_id"
          [attr.aria-describedby]="'model-summary-' + card.model_id + (card.applicable ? '' : ' model-locked-' + card.model_id)" />

        <span class="onboarding-model__radio" aria-hidden="true"></span>

        <span class="onboarding-model__body">
          <span class="onboarding-model__title-row">
            <span class="onboarding-model__title" [id]="'model-title-' + card.model_id">{{ card.title }}</span>
            @if (card.badge) {
            <span class="onboarding__tag">{{ card.badge }}</span>
            }
          </span>
          <span class="onboarding-model__summary" [id]="'model-summary-' + card.model_id">{{ card.summary }}</span>

          <span class="onboarding-model__counts">
            @for (item of card.countItems; track item.id) {
            @if (!$first) {
            <span class="onboarding-model__separator" aria-hidden="true">·</span>
            }
            <span><strong>{{ item.value }}</strong> {{ item.label }}</span>
            }
          </span>

          @if (card.category_labels.length) {
          <span class="onboarding-model__chips">
            @for (label of card.category_labels; track $index) {
            <span class="onboarding-model__chip">{{ label }}</span>
            }
          </span>
          }

          @if (!card.applicable) {
          <span class="onboarding-model__locked" [id]="'model-locked-' + card.model_id">
            <i class="fas fa-lock" aria-hidden="true"></i>
            Needs {{ card.missingFeatureLabels }}, which your license does not include.
          </span>
          }
        </span>
      </label>

      <app-button class="onboarding-model__details" label="View details" variant="link" tone="brand" size="sm"
        [ariaLabel]="'View details: ' + card.title" (clicked)="onViewDetails(card)"></app-button>
    </div>
    } @empty {
    <div class="onboarding-models__empty">
      <p>No models match “{{ searchQuery() }}”.</p>
      <app-button label="Clear search" variant="link" tone="brand" size="sm"
        (clicked)="onClearSearch()"></app-button>
    </div>
    }
  </fieldset>
</section>
} @else {
<app-warning-alert iconClass="fas fa-circle-info" title=""
  message="No best practice models are available."></app-warning-alert>
}
