<div class="location-tree-container">
    <!-- Search Header -->
    <div class="search-section">
        <div class="search-box">
            <i class="fas fa-search search-icon"></i>
            <input id="location-search" class="search-input" type="text" placeholder="Search locations..."
                [(ngModel)]="searchString" autocomplete="off">
            @if (searchString) {
            <button class="clear-button" (click)="handleSearchReset()" type="button" aria-label="Clear search">
                <i class="fas fa-times"></i>
            </button>
            }
        </div>
    </div>

    <!-- Tree -->
    <div class="tree-scroll-area" [class.expanded-mode]="isExpanded">
        @if (showSidebarExpandButton) {
        <button class="sidebar-expand-button" (click)="onSidebarExpandClicked()"
            [attr.aria-label]="isExpanded ? 'Collapse sidebar' : 'Expand sidebar'"
            title="{{isExpanded ? 'Collapse sidebar' : 'Expand sidebar'}}">
            @if (!isExpanded) {
            <i class="fas fa-expand"></i>
            }
            @if (isExpanded) {
            <i class="fas fa-compress"></i>
            }
        </button>
        }

        <!-- Empty state: No locations configured -->
        @if (!hasLocations) {
        <div class="empty-state-message">
            <i class="fas fa-map-marker-alt"></i>
            <span>No location was configured</span>
        </div>
        }

        <!-- Empty state: No search results -->
        @if (hasLocations && searchString && !hasSearchResults) {
        <div class="empty-state-message">
            <i class="fas fa-search"></i>
            <span>No location found.</span>
        </div>
        }

        <!-- Tree (only show when there are locations and either no search or search has results) -->
        @if (hasLocations && (!searchString || hasSearchResults)) {
        <mat-tree [dataSource]="dataSource" [treeControl]="treeControl" class="location-tree">

            <!-- Leaf Node -->
            <mat-tree-node *matTreeNodeDef="let node" matTreeNodeToggle
                [style.display]="filterLeafNode(node) ? 'none' : 'block'" class="tree-node leaf-node"
                [class.is-selected]="node.object_id == selectedLocationID">
                <div class="node-wrapper">
                    <div class="node-indent"></div>
                    <div class="node-content" [id]="node.object_id"
                        (click)="onLocationElementClicked($event.currentTarget.id)">
                        <div class="icon-wrapper">
                            <i class="node-icon" [class]="node.icon"></i>
                        </div>
                        <span class="node-text">{{node.name}}</span>
                    </div>
                </div>
            </mat-tree-node>

            <!-- Parent Node -->
            <mat-nested-tree-node *matTreeNodeDef="let node; when: hasChild">
                <div class="tree-node parent-node" [style.display]="filterParentNode(node) ? 'none' : 'block'"
                    [class.is-selected]="node.object_id == selectedLocationID"
                    [class.is-expanded]="treeControl.isExpanded(node)">
                    <div class="node-wrapper">
                        <button mat-icon-button matTreeNodeToggle class="expand-toggle"
                            [attr.aria-label]="'Toggle ' + node.name"
                            [attr.aria-expanded]="treeControl.isExpanded(node)" (click)="onTreeExpandClicked()">
                            <svg class="chevron-icon" width="16" height="16" viewBox="0 0 16 16" fill="none">
                                <path d="M6 4L10 8L6 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                    stroke-linejoin="round" />
                            </svg>
                        </button>
                        <div class="node-content" [id]="node.object_id"
                            (click)="onLocationElementClicked($event.currentTarget.id)">
                            <div class="icon-wrapper">
                                <i class="node-icon" [class]="node.icon"></i>
                            </div>
                            <span class="node-text">{{node.name}}</span>
                        </div>
                    </div>
                </div>
                <div class="children-wrapper" [class.is-collapsed]="!treeControl.isExpanded(node)" role="group">
                    <ng-container matTreeNodeOutlet></ng-container>
                </div>
            </mat-nested-tree-node>
        </mat-tree>
        }
    </div>
</div>
