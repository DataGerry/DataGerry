@if (type) {
<li class="list-group panel">
  <a class="list-group-item d-flex justify-content-between align-items-center"
    [routerLink]="['/framework/object/type/', type.public_id]" routerLinkActive="active">
    <span class="shorten-long-text" data-bs-toggle="tooltip" title="{{type.label}}">
      <i class="{{type.render_meta['icon']}}" aria-hidden="true"></i>
      <span class="node-label">{{ type.label }}</span>
    </span>
    <span class="badge text-bg-primary rounded-pill ms-2" style="color: #FFFFFF !important;" aria-live="polite"
      aria-atomic="true"
      [attr.aria-label]="objectCounter === null ? 'Loading object count' : objectCounter + ' objects'">
      @if (objectCounter === null) {
      <i class="fas fa-spinner fa-spin" aria-hidden="true"></i>
      }
      @else {
      {{ objectCounter }}
      }
    </span>
  </a>
</li>
}
