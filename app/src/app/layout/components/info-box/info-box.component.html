<div id="infobox" class="alert alert-info shadow border" role="alert">
  <button 
    (click)="hideAlert()" 
    type="button" 
    class="btn-close" 
    aria-label="Close"
    style="position: absolute; top: 0.75rem; right: 0.75rem;">
  </button>
  <div class="icon icon-background" role="alert"><i></i></div>
  <div class="text-area">
    <h2 class="alert-heading">Getting Started</h2>
    <p>{{message}}</p>
    <hr>
    <p class="mb-0 text-end"><a target="_blank" href="{{doc}}" rel="noopener noreferrer">Read More</a></p>
  </div>
</div>
