@if (listView) {

  <table class="table framework-table table-hover table-striped table-bordered mb-0 ">
    <thead>
    <tr tableSortEvent (valueChanged)="loadFolderFiles($event)">
      <th><input type="checkbox" (click)="removeSelects()"
                 [checked]="selectedFiles.files.length > 0"
                 [disabled]="selectedFiles.files.length == 0"></th>
      <th scope="col" class="w-50 active _desc">Filename</th>
      <th scope="col" class="w-10 _desc">Size</th>
      <th scope="col" class="w-10 _desc">Date</th>
      <th scope="col" class="w-20 _desc">Type</th>
      <th class="text-center">Action</th>
    </tr>
    </thead>
    <tbody>
    @for (item of fileElements; track item) {
<tr>
      <td>
        <input type="checkbox" class="selected-file" (click)="onSelect(item)">
      </td>
      <td>{{item.filename}}</td>
      <td>{{item.size | fileSize}}</td>
      <td>{{item.upload_date | dateFormatter}}</td>
      <td><p class="thumbnail">{{item.metadata?.mime_type}}</p></td>
      <td>

        <div class="text-center">
          <app-button variant="link" tone="brand" size="xs" icon="fas fa-download icon-download"
            ariaLabel="Download" title="Download" (clicked)="downloadFile(item)"></app-button>
          <app-button variant="link" tone="brand" size="xs" icon="far fa-edit icon-edit" ariaLabel="Rename"
            title="Rename" (clicked)="renameFile(item)"></app-button>
          <app-button variant="link" tone="brand" size="xs" icon="fas fa-expand-arrows-alt icon-move"
            ariaLabel="Move to" title="Move to" (clicked)="moveFile(item)"></app-button>
          <app-button variant="link" tone="danger" size="xs" icon="far fa-trash-alt icon-delete" ariaLabel="Delete"
            title="Delete" (clicked)="deleteFile(item)"></app-button>
        </div>
        
      </td>
    </tr>
}
    </tbody>
  </table>

} @else {

  <div id="file-view-tile" class="container">
    <div class="row">
      @for (item of fileElements; track item) {
<div class="col-md-2 col-sm-3 col-xs-4 p-2" (click)="onSelect(item, $event)">
        <div style="pointer-events: none;">
          <div class="tile display-4 text-center"><i [className]="item.filename | fileExtension"></i></div>
          <div class="thumbnail text-center">{{item.filename}}</div>
        </div>
      </div>
}
    </div>
  </div>

}
