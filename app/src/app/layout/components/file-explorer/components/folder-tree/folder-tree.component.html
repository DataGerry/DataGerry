<ul id="folder-tree-view">
  <ng-template #recursiveList let-fileTree>
    @for (item of fileTree; track item) {
    <li>
      <div class="d-flex"
        [ngClass]="item.hasSubFolders ? 'caret caret-down': item.children?.length > 0 ? 'caret caret-with-subs' : 'caret'"
        [class.selected]="item.public_id === selectedFileFolder.getValue()?.public_id"
        (dblclick)="dropTree($event, item)" (click)="loadFolderFiles(item)" (contextmenu)="loadContextMenu()">
        <span class="me-auto">{{item.filename}}</span>
        <span class="context-line" [style.display]="item.filename === '' ? 'none' : 'block'">
          <app-button variant="link" tone="brand" size="xs" icon="far fa-file" ariaLabel="New folder"
            title="New folder" (clicked)="createFolder()"></app-button>
          <app-button variant="link" tone="brand" size="xs" icon="far fa-edit" ariaLabel="Rename folder"
            title="Rename folder" (clicked)="renameFolder()"></app-button>
          <app-button variant="link" tone="brand" size="xs" icon="fas fa-expand-arrows-alt" ariaLabel="Move folder"
            title="Move folder" (clicked)="moveFolder()"></app-button>
          <app-button variant="link" tone="danger" size="xs" icon="far fa-trash-alt" ariaLabel="Delete folder"
            title="Delete folder" (clicked)="deleteFolder(item)"></app-button>
        </span>
      </div>

      @if (item.children?.length > 0 && item.hasSubFolders) {
      <ul class="nested">
        <ng-container *ngTemplateOutlet="recursiveList; context:{ $implicit: item.children }"></ng-container>
      </ul>
      }
    </li>
    }
  </ng-template>
  <ng-container *ngTemplateOutlet="recursiveList; context:{ $implicit: fileTree }"></ng-container>
</ul>
