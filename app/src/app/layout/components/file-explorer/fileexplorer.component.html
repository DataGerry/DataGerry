<div class="container-fluid border fileExplorer">
  <div class="row">
    <div class="col-12 bg-light p-2 border-bottom">
      <div class="container-fluid">
        <div class="row">
          <div class="col-3 m-0 p-0 dg-button-row">
            <!-- Folder Settings -->
            <app-button variant="solid" tone="brand" size="sm" label="New Folder" icon="fas fa-folder"
              (clicked)="addFolder()">
            </app-button>
            <app-button variant="outline" tone="neutral" size="sm" label="Upload" icon="fas fa-upload"
              (clicked)="uploadFile()">
            </app-button>
          </div>
          <div class="col-6 m-0 p-0 dg-button-row">
            <!-- File Settings -->
            <app-button variant="outline" tone="neutral" size="sm" icon="fa fa-edit"
              [label]="'Rename (' + selectedFileElements.files.length + ')'"
              [disabled]="selectedFileElements.files.length != 1"
              (clicked)="renameFile(selectedFileElements.files[0])">
            </app-button>
            <app-button variant="outline" tone="neutral" size="sm" icon="fas fa-expand-arrows-alt"
              [label]="'Move (' + selectedFileElements.files.length + ')'"
              [disabled]="selectedFileElements.files.length == 0"
              (clicked)="moveFiles(selectedFileElements.files)">
            </app-button>
            <app-button variant="solid" tone="danger" size="sm" icon="far fa-trash-alt"
              [label]="'Delete (' + selectedFileElements.files.length + ')'"
              [disabled]="selectedFileElements.files.length == 0"
              (clicked)="deleteFiles(selectedFileElements.files)">
            </app-button>
          </div>
          <div class="col-3 text-end">
            <div class="dg-button-group" role="group" aria-label="View options">
              <app-button variant="ghost" tone="neutral" size="sm"
                [icon]="listView ? 'fas fa-th-large' : 'fas fa-th-list'"
                [ariaLabel]="listView ? 'Show grid view' : 'Show list view'"
                (clicked)="listView = !listView">
              </app-button>
              <app-button variant="ghost" tone="neutral" size="sm" icon="fas fa-info-circle"
                ariaLabel="Show file details" [disabled]="selectedFileElements.files.length!=1"
                (clicked)="showMetadataInfo(selectedFileElements.files[0])">
              </app-button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="col-3 border-end p-3 pre-scrollable" style="min-height: 437px" (scroll)="onScrollTreeListHost($event)">
      <cmdb-folder-tree [fileTree]="fileTree" [selectedFileFolder]="selectedFolderElement"
        (createFileElementEvent)="addFolder()" (renameFileElementEvent)="renameFile()"
        (moveFileElementEvent)="moveFile()" (deleteFileElementEvent)="deleteFile($event)"
        (loadFileElementEvent)="loadFiles()">
      </cmdb-folder-tree>
    </div>
    <div class="col-9">
      <div class="row">
        <div class="col-12 p-2 d-flex justify-content-between align-items-center border-bottom">
          <span class="col-9">
            @if (searchForm.get('search').value) {

            <i class="fas fa-caret-right"></i>

            } @else {

            <cmdb-folder-path-viewer [selectedFileFolder]="selectedFolderElement"
              [folderTree]="fileTree"></cmdb-folder-path-viewer>

            }


          </span>
          <form [formGroup]="searchForm">
            <input type="text" formControlName="search" class="form-control form-control-sm" placeholder="Filter File">
          </form>
        </div>
        <div id="file-view-list" class="col-12 p-0" (scroll)="onScrollListViewHost($event)">
          <cmdb-file-view-list [fileElements]="fileElements" [listView]="listView"
            [selectedFiles]="selectedFileElements"
            (loadFileElementEvent)="loadFiles($event, false)"></cmdb-file-view-list>
        </div>
      </div>
    </div>
    <div class="col-12 bg-light p-2 border">
      <div class="d-flex justify-content-between">
        <span><strong>File(s):</strong> {{recordsTotal}}</span>
        <span><strong>Selected File(s):</strong> {{selectedFileElements.files.length}}</span>
        <span><strong>Size:</strong> {{selectedFileElements.totalSize | fileSize}}</span>
      </div>
    </div>
  </div>
</div>


<app-loading-popup [isVisible]="isLoading$ | async" message="We're Processing the Data..."></app-loading-popup>
