<div class="modal-content">
  <div class="modal-header" style="background-color: #e94d18; color: #FFFFFF;">
    <h4 class="modal-title">
      <i class="far fa-folder"></i> <span class="mx-3">Create a new folder</span>
    </h4>
    <button type="button" class="btn-close btn-close-white" aria-label="Close"
      (click)="activeModal.close(false)"></button>
  </div>
  <form [formGroup]="basicForm">
    <div class="modal-body">
      <div class="mb-3">
        <label class="mb-2" for="folderNameInput">Folder Name: <span class="required">*</span></label>
        <input type="text" formControlName="name" class="form-control" [ngClass]="{ 'is-valid': name.valid && (name.dirty || name.touched),
                 'is-invalid': name.invalid && (name.dirty || name.touched) }" id="folderNameInput" required>
        <small id="folderNameInputHelp" class="form-text text-muted">Folder name must be unique</small>
        @if (name.invalid && (name.dirty || name.touched)) {
        <div class="invalid-feedback">
          @if (name.errors.required) {
          <div class="text-end">
            Name is required.
          </div>
          }
          @if (name.errors.nameAlreadyTaken) {
          <div class="text-end">
            A folder with this name already exists.
          </div>
          }
        </div>
        }
        <div class="clearfix"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary me-1" (click)="activeModal.close(false)">Cancel</button>
      <button type="button" class="btn btn-success" [disabled]="!name.valid" (click)="createFolder()">OK</button>
    </div>
  </form>
</div>
