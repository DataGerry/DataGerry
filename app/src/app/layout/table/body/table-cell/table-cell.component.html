<div [ngClass]="{'row-hoverable': isViewAndEditRequired}" class="clickable-container" (click)="handleObjectView()"
  (dblclick)="handleObjectEdit()">
  @if (column.template) {
  <ng-container [ngTemplateOutlet]="column.template"
    [ngTemplateOutletContext]="{ data: data, item: item, column: column}"></ng-container>
  }
  @if (data && !column.template) {

  <span>{{data}}</span>

  }
</div>
