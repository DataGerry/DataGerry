<div class="dg-button-group dropdown" role="group" aria-label="Column visibility">
  <button
    type="button"
    class="dg-button dg-button--outline dg-button--neutral dg-button--sm"
    data-bs-toggle="dropdown"
    aria-haspopup="menu"
    aria-expanded="false">
    <i class="fas fa-table" aria-hidden="true"></i>
    <span class="dg-button__label">Columns</span>
  </button>
  @if (columns.length > 0) {
  <div class="dropdown-menu">
    @for (column of columns; track column) {
    <button type="button" class="dropdown-item" [ngClass]="{'disabled': column.fixed}"
      (click)="toggleColumn(column, $event)">
      <span class="form-check">
        <input class="form-check-input" type="checkbox" [checked]="!column.hidden" [disabled]="column.fixed"
          title="toggle-{{column.name}}">
        <label class="form-check-label">
          {{column.display ? column.display : column.name}}
        </label>
      </span>
    </button>
    }
    <div class="dropdown-divider"></div>
    <button type="button" class="dropdown-item text-center" (click)="columnsReset.emit()">
      <i class="fas fa-redo"></i> Reset
    </button>
  </div>
  }
</div>
