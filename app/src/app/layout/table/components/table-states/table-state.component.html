<div class="dg-button-group dropdown me-2" role="group" aria-label="Table configurations">
    <button
      type="button"
      class="dg-button dg-button--outline dg-button--neutral dg-button--sm"
      #toggleButton
      data-bs-toggle="dropdown"
      aria-haspopup="menu"
      aria-expanded="false">
      <i class="fas fa-border-none" aria-hidden="true"></i>
      <span class="dg-button__label">Configs</span>
    </button>

    <form [formGroup]="form">
        <div class="setting-dropdown dropdown-menu dropdown-menu-end dropdown-menu-start text-center">
            <!-- Save state -->
            <span class="input-group p-2">
                <input type="text" formControlName="name" class="form-control form-control-sm me-auto p-2" [ngClass]="{ 'is-valid': nameControl.valid && (nameControl.dirty || nameControl.touched),
                                'is-invalid': nameControl.invalid && (nameControl.dirty || nameControl.touched)}" />
                <app-button variant="solid" tone="brand" icon="fas fa-save" ariaLabel="Save configuration"
                    [disabled]="form.invalid" (click)="form.valid && saveState(nameControl.value, $event)">
                </app-button>
            </span>

            <div class="dropdown-divider"></div>
            <!-- List state -->
            @for (state of tableStates; track state) {
            <div class="dropdown-item pointer d-flex config-item" (click)="selectState(state)">
                <div class="flex-grow-1">
                    {{ state.name }}
                </div>
                <div>
                    <i class="fas fa-save config-item-icon me-1" (click)="updateState(state, $event)"></i>
                    <i class="far fa-trash-alt config-item-icon" (click)="deleteState(state, $event)"></i>
                </div>
            </div>
            }

            <div class="dropdown-divider"></div>
            <!-- Set default -->
            <span class="dropdown-item pointer config-item" (click)="resetState()">
                <i class="fas fa-redo"></i> Default
            </span>
        </div>
    </form>
</div>
