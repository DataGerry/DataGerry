<form [formGroup]="form" class="row row-cols-auto g-1 align-items-center">
  <label class="col-auto col-form-label me-1">Show:</label>
  <div class="col-auto">
    <select formControlName="size" class="form-select form-select-sm" title="table-page-size-changer">
      @for (size of pageSizeList; track size) {
      <option [ngValue]="size.value">{{ size.label }}</option>
      }
    </select>
  </div>
</form>
