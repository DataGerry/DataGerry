<div class="toast-container shadow-lg {{toast.classname}}" role="alert" aria-live="assertive" aria-atomic="true">
  <span class="d-none">{{waitTillDisposal((toast.delayTime * 1000) || 3500, toast)}}</span>
  
  <div class="toast-body p-0 border-0">
    <div class="toast-content">
      <div class="toast-icon-wrapper">
        <i class="{{toast?.icon}} {{toast.iconClass}}"></i>
      </div>
      
      <div class="toast-text-wrapper">
        <h5 class="toast-header-text mb-1">{{toast?.headerName}}</h5>
        <p class="toast-message mb-0">{{toast?.text}}</p>
      </div>
      
      <button 
        type="button" 
        class="toast-close-btn" 
        (click)="closeToast(toast); $event.stopPropagation(); $event.preventDefault()"
        aria-label="Close">
        <span>×</span>
      </button>
    </div>
    
    <div class="toast-progress-bar">
      <div class="toast-progress-fill" [style.animation]="parse(toast?.delayTime)"></div>
    </div>
  </div>
</div>
