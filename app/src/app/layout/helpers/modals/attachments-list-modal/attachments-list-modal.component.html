<dg-modal
    icon="fas fa-paperclip"
    eyebrow="Object"
    title="Attachments"
    [subtitle]="'Total ' + attachments.length"
    [dismissDisabled]="inProcess"
    (dismiss)="activeModal.close({ total: recordsTotal })">

    <app-button
        *permissionLink="'base.framework.object.edit'"
        variant="solid" tone="brand" [block]="true"
        label="Add new Attachments"
        type="button"
        icon="fas fa-plus"
        (clicked)="addAttachments()">
    </app-button>

    <div class="pre-scrollable-x-hidden" (scroll)="onScrollHost($event)">
        @for (attachment of attachments; track attachment) {
        <div class="attachment-item">
            <div class="row align-items-center flex-nowrap">
                <div class="col-2">
                    <i [className]="attachment.filename | fileExtension"></i>
                </div>
                <div class="col-8 px-0">
                    <app-button
                        variant="link" tone="brand"
                        [label]="attachment.filename"
                        type="button"
                        (clicked)="downloadFile(attachment.filename)">
                    </app-button>
                    <p class="mb-0 text-muted">{{attachment.size | fileSize}}</p>
                </div>
                <div class="col-2 px-0" [hidden]="attachment.inProcess" *permissionLink="['base.framework.object.edit']">
                    <app-button
                        variant="link" tone="danger" size="xs"
                        label=""
                        type="button"
                        icon="far fa-trash-alt icon-delete"
                        [ariaLabel]="'Delete ' + attachment.filename"
                        (clicked)="deleteFile(attachment)">
                    </app-button>
                </div>
            </div>
            <div class="progress" [hidden]="!attachment.inProcess">
                <div class="progress-bar progress-bar-striped progress-bar-animated" role="progressbar"
                    aria-valuenow="75" aria-valuemin="0" aria-valuemax="100" style="width:100%">
                </div>
            </div>
        </div>
        }
    </div>

    <app-button
        dgModalFooter
        variant="outline" tone="neutral"
        label="Close"
        type="button"
        (clicked)="activeModal.dismiss('Close click')">
    </app-button>

    <app-button
        dgModalFooter
        variant="solid" tone="brand"
        label="Done"
        type="button"
        [disabled]="inProcess"
        (clicked)="activeModal.close({total: recordsTotal})">
    </app-button>
</dg-modal>


<app-loading-popup [isVisible]="isLoading$ | async" message="We're Processing the Data..."></app-loading-popup>
