<dg-modal [icon]="iconClass" eyebrow="Location" [title]="title" (dismiss)="activeModal.close('cancel')">

    <p class="locations-lead">
        This object has a location which holds at least one sub location and can't be deleted alone.
    </p>

    <ul class="locations-options">
        <li>
            If you want to delete this object and all sub objects press
            <b>'{{ deleteObjectsButton }}'</b>.
        </li>
        <li>
            If you only want to delete the location attribute from the sub objects press
            <b>'{{ deleteChildrenButton }}'</b>.
        </li>
    </ul>

    <app-button
        dgModalFooter
        variant="outline" tone="neutral"
        type="button"
        [label]="cancelButton"
        (clicked)="activeModal.close('cancel')">
    </app-button>

    <app-button
        dgModalFooter
        variant="outline" tone="danger"
        type="button"
        [label]="deleteChildrenButton"
        (clicked)="activeModal.close('locations')">
    </app-button>

    <app-button
        dgModalFooter
        variant="solid" tone="danger"
        type="button"
        [label]="deleteObjectsButton"
        (clicked)="activeModal.close('objects')">
    </app-button>
</dg-modal>
