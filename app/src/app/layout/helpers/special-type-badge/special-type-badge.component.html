@if (specialType) {
<span [class]="badgeClass" [style.--accent]="accentColor" [style.--accent-ring]="accentRing"
  [title]="description">
  <span class="special-type-badge__dot" aria-hidden="true"></span>
  <span class="special-type-badge__token">{{ displayToken }}</span>
  @if (description) {
  <span class="visually-hidden">&nbsp;&ndash; {{ description }}</span>
  }
</span>
}
