@if (faIcon) {
<i class="{{faIcon}} me-1" aria-hidden="true"></i>
}
@if (publicID && useURL) {
<a [routerLink]="['/', 'framework', 'object', 'type', publicID]">{{label}}</a>
} @else {
{{label}}
}

@if (description) {
<i class="fas fa-exclamation-circle text-end" placement="right" [ngbTooltip]="description"></i>
}
