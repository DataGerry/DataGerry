@switch (tag.searchForm) {
@case ('text') {
<i class="fas fa-font"></i>
}
@case ('regex') {
<i class="fas fa-code"></i>
}
@case ('publicID') {
<i class="fas fa-qrcode"></i>
}
@case ('type') {
<i class="fas fa-object-group"></i>
}
@case ('category') {
<i class="fas fa-folder-open"></i>
}
@default {
<i class="fas fa-font"></i>
}
}
