<dg-modal
    icon="fas fa-exclamation-triangle"
    eyebrow="Session"
    title="Session timeout"
    (dismiss)="activeModal.dismiss('Close')">

    <div class="timeout-countdown">
        <i class="fas fa-clock" aria-hidden="true"></i>
        <span class="timeout-countdown__label">Time remaining</span>
        <span class="timeout-countdown__value">{{ remainingTime }}</span>
    </div>

    <p class="timeout-lead">
        Your session will expire shortly. You will then be logged out automatically.
        If you want to extend your session, enter your password in the field below.
    </p>

    <form [formGroup]="form" class="needs-validation" novalidate>
        <label class="form-label" for="sessionTimeoutPassword">Password</label>
        <input id="sessionTimeoutPassword" type="password" formControlName="password" class="form-control"
            placeholder="Enter your password..." aria-label="Password" autocomplete="off" required>
        @if (error) {
        <small class="text-danger timeout-error">
            {{error}}
        </small>
        }
    </form>

    <app-button dgModalFooter [bootstrapClass]="'btn-primary'" label="Renew" type="button" icon="fas fa-rotate-right"
        [disabled]="form.invalid" (clicked)="onRenew()">
    </app-button>
</dg-modal>
