<dg-modal
    icon="fas fa-eye"
    eyebrow="Search result"
    title="Preview"
    (dismiss)="activeModal.dismiss()">

    <div class="renderForm">
        <cmdb-render [renderResult]="renderResult" [mode]="mode" [renderForm]="formGroupDummy"></cmdb-render>
    </div>

    <app-button dgModalFooter [bootstrapClass]="'btn-secondary'" label="Close" type="button"
        (clicked)="activeModal.close()">
    </app-button>
</dg-modal>
