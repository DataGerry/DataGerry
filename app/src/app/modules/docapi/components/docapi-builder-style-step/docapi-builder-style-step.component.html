<div class="mt-3">
    <div class="row">
        <div class="col">
            <form [formGroup]="styleForm" id="styleForm" class="needs-validation" novalidate autocomplete="off">
                <div class="mb-3">
                    <label class="mb-2" for="docCustomCssInput">(Optional) Custom CSS:</label>
                    <textarea
                        class="form-control"
                        formControlName="template_style"
                        id="docCustomCssInput"
                        rows="20"
                        aria-describedby="docCustomCssInputHelp"
                    ></textarea>
                    <small id="docCustomCssInputHelp" class="form-text text-muted">
                        Enter Custom CSS styling here
                    </small>
                    <div class="clearfix"></div>
                </div>
            </form>
        </div>
    </div>
</div>
