<div class="mt-3">
    <div class="doc-split-pane">

        <aside class="doc-outline-panel" [class.is-collapsed]="outlineCollapsed">
            <div class="outline-content">
                <div class="outline-header">
                    <span class="outline-title">Outline</span>
                </div>
                <div class="outline-body">
                    <ng-container *ngIf="headingNavigation.length > 0; else noHeadings">
                        <ng-container
                            *ngTemplateOutlet="headingTree; context: { $implicit: headingNavigation }"></ng-container>
                    </ng-container>
                    <ng-template #noHeadings>
                        <div class="outline-empty-state">
                            <div class="outline-empty-icon">
                                <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"
                                    stroke-linecap="round">
                                    <line x1="3" y1="4" x2="13" y2="4" />
                                    <line x1="3" y1="7" x2="10" y2="7" />
                                    <line x1="3" y1="10" x2="11" y2="10" />
                                    <line x1="3" y1="13" x2="8" y2="13" />
                                </svg>
                            </div>
                            <p class="outline-empty-title">Your outline will appear here</p>
                            <p class="outline-empty-desc">Start adding headings in the editor to structure your
                                document.</p>
                            <div class="outline-empty-ghost" aria-hidden="true">
                                <span class="ghost-row" style="--w: 72%"></span>
                                <span class="ghost-row ghost-row--child" style="--w: 58%"></span>
                                <span class="ghost-row ghost-row--child" style="--w: 63%"></span>
                                <span class="ghost-row" style="--w: 68%"></span>
                            </div>
                        </div>
                    </ng-template>
                </div>
            </div>

            <button type="button" class="outline-handle" (click)="outlineCollapsed = !outlineCollapsed"
                [attr.aria-label]="outlineCollapsed ? 'Show outline' : 'Hide outline'"
                [attr.title]="outlineCollapsed ? 'Show outline' : 'Hide outline'">
                <i class="fas fa-chevron-left"></i>
            </button>
        </aside>

        <div class="doc-editor-area">
            <form [formGroup]="contentForm" id="contentForm" novalidate autocomplete="off">
                <editor formControlName="template_data" id="docContentInput" [init]="editorConfig"></editor>
            </form>
        </div>

    </div>
    <small class="form-text text-muted mt-2 d-block">
        Design the content of your document. Use Document Options to configure margins, cover page, headers, footers,
        and table of contents.
    </small>
</div>

<ng-template #headingTree let-items>
    <ul class="outline-nav-list">
        <li *ngFor="let item of items; trackBy: trackByHeadingId" class="outline-nav-item"
            [attr.data-level]="item.level">
            <button type="button" class="outline-nav-btn" [class.is-active]="activeHeadingId === item.id"
                (click)="jumpToHeading(item)" (contextmenu)="openOutlineContextMenu($event, item)"
                (keydown)="onOutlineItemKeydown($event, item)" aria-haspopup="menu">
                <span class="outline-level-dot"></span>
                <span class="outline-nav-text">{{ item.text }}</span>
            </button>
            <ng-container *ngIf="item.children.length > 0">
                <ng-container *ngTemplateOutlet="headingTree; context: { $implicit: item.children }"></ng-container>
            </ng-container>
        </li>
    </ul>
</ng-template>

<div *ngIf="outlineContextMenu.visible" class="outline-context-menu" role="menu" [style.left.px]="outlineContextMenu.x"
    [style.top.px]="outlineContextMenu.y" (click)="onContextMenuContainerClick($event)">
    <button type="button" class="outline-context-menu__item" role="menuitem" (click)="duplicateFromContextMenu()">
        Duplicate section
    </button>
</div>
