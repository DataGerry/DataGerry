<aw-wizard #wizard [navBarLayout]="'large-empty-symbols'">
    <aw-wizard-step stepId="1" stepTitle="Template Settings">
        <ng-template awWizardStepSymbol>
            <i class="fas fa-cogs"></i>
        </ng-template>
        <cmdb-docapi-builder-settings-step
            [preData]="docInstance"
            [mode]="mode"
        />
        <div class="dg-button-row dg-button-row--between">
            <app-button
                label="Cancel"
                variant="outline"
                tone="neutral"
                (clicked)="cancel()"
            ></app-button>
            <app-button
                label="Next"
                variant="solid"
                tone="brand"
                icon="fas fa-angle-double-right"
                iconPosition="end"
                [disabled]="!settingsStep.settingsForm.valid"
                (clicked)="nextStep()"
            ></app-button>
        </div>
    </aw-wizard-step>

    <aw-wizard-step stepId="2" stepTitle="Template Type" (stepExit)="typeParam = { templateType: typeStep.typeForm.get('template_type')?.value, parameters: typeStep.typeParamComponent?.typeParamForm?.value }">
        <ng-template awWizardStepSymbol>
            <i class="fas fa-cogs"></i>
        </ng-template>
        <cmdb-docapi-settings-builder-type-step
            [preData]="docInstance"
            [mode]="mode"
            (formValidEmitter)="typeStepFormValid = $event"
            (typeParamReady)="onTypeParamReady()"
        />
        <div class="dg-button-row dg-button-row--between">
            <app-button
                label="Previous"
                variant="outline"
                tone="neutral"
                icon="fas fa-angle-double-left"
                (clicked)="previousStep()"
            ></app-button>
            <app-button
                label="Next"
                variant="solid"
                tone="brand"
                icon="fas fa-angle-double-right"
                iconPosition="end"
                [disabled]="!typeStep.isStepValid"
                (clicked)="nextStep()"
            ></app-button>
        </div>
    </aw-wizard-step>

    <aw-wizard-step stepId="3" stepTitle="Template Content">
        <ng-template awWizardStepSymbol>
            <i class="fas fa-file-image"></i>
        </ng-template>
        <cmdb-docapi-builder-content-step
            [preData]="docInstance"
            [typeParam]="typeParam"
            [mode]="mode"
            (previewRequested)="openPreviewObjectModal()"
        />
        <div class="dg-button-row dg-button-row--between">
            <app-button
                label="Previous"
                variant="outline"
                tone="neutral"
                icon="fas fa-angle-double-left"
                (clicked)="previousStep()"
            ></app-button>
            <app-button
                label="Next"
                variant="solid"
                tone="brand"
                icon="fas fa-angle-double-right"
                iconPosition="end"
                [disabled]="!contentStep.contentForm.valid"
                (clicked)="nextStep()"
            ></app-button>
        </div>
    </aw-wizard-step>

    <aw-wizard-step stepId="4" stepTitle="Template Custom Style">
        <ng-template awWizardStepSymbol>
            <i class="fas fa-file-image"></i>
        </ng-template>
        <cmdb-docapi-builder-style-step
            [preData]="docInstance"
            [mode]="mode"
        />
        <div class="dg-button-row dg-button-row--between">
            <app-button
                label="Previous"
                variant="outline"
                tone="neutral"
                icon="fas fa-angle-double-left"
                (clicked)="previousStep()"
            ></app-button>
            <app-button
                *permissionLink="saveRight"
                label="Save"
                variant="solid"
                tone="brand"
                icon="fas fa-check"
                [loading]="isSaving"
                loadingText="Saving…"
                (clicked)="saveDoc()"
            ></app-button>
        </div>
    </aw-wizard-step>
</aw-wizard>

<app-loading-popup
    [isVisible]="isLoading$ | async"
    message="We're Processing the Data..."
></app-loading-popup>
