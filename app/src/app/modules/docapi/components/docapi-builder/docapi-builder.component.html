<aw-wizard #wizard [navBarLayout]="'large-empty-symbols'">
    <aw-wizard-step stepId="1" stepTitle="Template Settings">
        <ng-template awWizardStepSymbol>
            <i class="fas fa-cogs"></i>
        </ng-template>
        <cmdb-docapi-builder-settings-step
            [preData]="docInstance"
            [mode]="mode"
        />
        <app-button
            label="Cancel"
            [type]="'button'"
            bootstrapClass="btn-primary prev"
            (clicked)="cancel()"
        ></app-button>
        <app-button
            label="Next"
            [type]="'button'"
            bootstrapClass="btn-success next"
            [disabled]="!settingsStep.settingsForm.valid"
            (clicked)="nextStep()"
        ></app-button>
    </aw-wizard-step>

    <aw-wizard-step stepId="2" stepTitle="Template Type" (stepExit)="typeParam = { templateType: typeStep.typeForm.get('template_type').value, parameters: typeStep.typeParamComponent?.typeParamForm?.value }">
        <ng-template awWizardStepSymbol>
            <i class="fas fa-cogs"></i>
        </ng-template>
        <cmdb-docapi-settings-builder-type-step
            [preData]="docInstance"
            [mode]="mode"
            (formValidEmitter)="typeStepFormValid = $event"
            (typeParamReady)="onTypeParamReady()"
        />
        <app-button
            label="Previous"
            [type]="'button'"
            bootstrapClass="btn-primary prev"
            (clicked)="previousStep()"
        ></app-button>
        <app-button
            label="Next"
            [type]="'button'"
            bootstrapClass="btn-success next"
            [disabled]="!typeStep.typeValid || !typeStep.typeChildValid"
            (clicked)="nextStep()"
        ></app-button>
    </aw-wizard-step>

    <aw-wizard-step stepId="3" stepTitle="Template Content">
        <ng-template awWizardStepSymbol>
            <i class="fas fa-file-image"></i>
        </ng-template>
        <cmdb-docapi-builder-content-step
            [preData]="docInstance"
            [typeParam]="typeParam"
            [mode]="mode"
        />
        <app-button
            label="Previous"
            [type]="'button'"
            bootstrapClass="btn-primary prev"
            (clicked)="previousStep()"
        ></app-button>
        <app-button
            label="Next"
            [type]="'button'"
            bootstrapClass="btn-success next"
            [disabled]="!contentStep.contentForm.valid"
            (clicked)="nextStep()"
        ></app-button>
    </aw-wizard-step>

    <aw-wizard-step stepId="4" stepTitle="Template Custom Style">
        <ng-template awWizardStepSymbol>
            <i class="fas fa-file-image"></i>
        </ng-template>
        <cmdb-docapi-builder-style-step
            [preData]="docInstance"
            [mode]="mode"
        />
        <app-button
            label="Previous"
            [type]="'button'"
            bootstrapClass="btn-primary prev"
            (clicked)="previousStep()"
        ></app-button>
        <app-button
            label="Save"
            [type]="'button'"
            bootstrapClass="btn-success next"
            (clicked)="saveDoc()"
        ></app-button>
    </aw-wizard-step>
</aw-wizard>
