<div class="modal-header">
    <h4 class="modal-title">Document Options</h4>
    <button type="button" class="btn-close btn-close btn-close-white" aria-label="Close" (click)="cancel()"></button>
</div>

<div class="modal-body">
    <ul class="nav nav-tabs options-tabs">
        <li class="nav-item">
            <button class="nav-link" type="button" [class.active]="activeTab === 'margins'"
                (click)="selectTab('margins')">
                Margins
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link" type="button" [class.active]="activeTab === 'cover'" (click)="selectTab('cover')">
                Cover Page
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link" type="button" [class.active]="activeTab === 'toc'" (click)="selectTab('toc')">
                Table of Contents
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link" type="button" [class.active]="activeTab === 'header'"
                (click)="selectTab('header')">
                Header
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link" type="button" [class.active]="activeTab === 'footer'"
                (click)="selectTab('footer')">
                Footer
            </button>
        </li>
    </ul>

    <div [formGroup]="form">
        <cmdb-docapi-page-margins-options *ngIf="activeTab === 'margins'" [marginsForm]="form" />

        <cmdb-docapi-page-cover-options *ngIf="activeTab === 'cover'" [coverForm]="form"
            [editorConfig]="coverEditorConfig" />

        <cmdb-docapi-page-header-options *ngIf="activeTab === 'header'" [headerForm]="form"
            [editorConfig]="headerEditorConfig" />

        <cmdb-docapi-page-header-options *ngIf="activeTab === 'footer'" [headerForm]="form"
            [editorConfig]="footerEditorConfig" [activatedControlName]="'footer_activated'"
            [contentControlName]="'footer_content'" [activationLabel]="'Activate footer'"
            [contentLabel]="'Footer Content'"
            [contentHelpText]="'Design the content that appears in the document footer.'" />

        <cmdb-docapi-page-toc-options *ngIf="activeTab === 'toc'" [tocForm]="form" />

        <div *ngIf="validationError" class="validation-error">
            {{ validationError }}
        </div>
    </div>
</div>

<div class="modal-footer">

    <app-button [bootstrapClass]="'btn-secondary'" label="Cancel" type="button" (clicked)="cancel()">
    </app-button>

    <app-button [bootstrapClass]="'btn-success'" label="Apply" type="button" (clicked)="apply()">
    </app-button>
</div>
