<div class="toc-pane" *ngIf="tocForm" [formGroup]="tocForm">

    <label class="toc-toggle mb-3" for="tocActivatedInput">
        <input class="toc-toggle__input" id="tocActivatedInput" type="checkbox"
            formControlName="table_of_contents_activated">
        <span class="toc-toggle__track">
            <span class="toc-toggle__thumb"></span>
        </span>
        <span class="toc-toggle__label">Activate table of contents</span>
    </label>

    <div class="toc-layout" formGroupName="table_of_contents_config">

        <section class="toc-preview">
            <div class="preview-shell">
                <div class="preview-eyebrow">Preview</div>
                <div class="preview-paper">
                    <div class="preview-chrome">
                        <span class="dot dot--r"></span>
                        <span class="dot dot--y"></span>
                        <span class="dot dot--g"></span>
                    </div>
                    <div class="preview-contents-label">Contents</div>
                    <div class="toc-entries">
                        <div class="toc-row" *ngFor="let item of previewItems" [ngStyle]="getPreviewStyle(item)">
                            <span class="toc-text">{{ item.title }}</span>
                            <span class="toc-leaders"></span>
                            <span class="toc-pg">{{ item.page }}</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section class="toc-controls">

            <div class="config-card">
                <div class="config-title">
                    Basic Settings
                    <button type="button" class="reset-btn" (click)="resetGeneralSettings()" title="Reset to defaults">
                        <svg width="11" height="11" viewBox="0 0 12 12" fill="none">
                            <path d="M10 6A4 4 0 1 1 6 2a4 4 0 0 1 2.83 1.17L10 4.5" stroke="currentColor"
                                stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M10 2v2.5H7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                        Reset
                    </button>
                </div>

                <div class="basic-grid">
                    <div class="field" formGroupName="pdftoc">
                        <label class="field-label" for="tocFontSizeInput">Text size (pt)</label>
                        <div class="stepper">
                            <button type="button" class="stepper-btn"
                                (click)="stepValue('font-size', -0.5, pdftocGroup)">−</button>
                            <input id="tocFontSizeInput" type="number" class="stepper-input" min="1" max="64" step="0.5"
                                formControlName="font-size">
                            <button type="button" class="stepper-btn"
                                (click)="stepValue('font-size', 0.5, pdftocGroup)">+</button>
                        </div>
                    </div>

                    <div class="field" formGroupName="pdftoc">
                        <label class="field-label" for="tocLineHeightInput">Line spacing</label>
                        <div class="stepper">
                            <button type="button" class="stepper-btn"
                                (click)="stepValue('line-height', -0.1, pdftocGroup)">−</button>
                            <input id="tocLineHeightInput" type="number" class="stepper-input" min="0.6" max="4"
                                step="0.1" formControlName="line-height">
                            <button type="button" class="stepper-btn"
                                (click)="stepValue('line-height', 0.1, pdftocGroup)">+</button>
                        </div>
                    </div>

                    <div class="field" formGroupName="spacing">
                        <label class="field-label" for="tocSpacingMarginTopInput">Space between entries</label>
                        <div class="stepper">
                            <button type="button" class="stepper-btn"
                                (click)="stepValue('margin-top', -0.5, spacingGroup)">−</button>
                            <input id="tocSpacingMarginTopInput" type="number" class="stepper-input" min="0" max="60"
                                step="0.5" formControlName="margin-top">
                            <button type="button" class="stepper-btn"
                                (click)="stepValue('margin-top', 0.5, spacingGroup)">+</button>
                        </div>
                    </div>
                </div>

                <div class="field mt-3">
                    <label class="field-label mb-2">Select a heading level to customize its style</label>
                    <div class="level-tabs">
                        <button type="button" class="level-tab" *ngFor="let level of levels"
                            [class.is-active]="selectedLevel === level" (click)="selectLevel(level)">
                            H{{ level + 1 }}
                        </button>
                    </div>
                    <small class="field-hint">
                        Each heading level can have its own style and indent.
                    </small>
                </div>
            </div>

            <div class="config-card config-card--accent" *ngIf="selectedLevelForm" [formGroup]="selectedLevelForm">

                <div class="config-title">
                    <span class="config-title__badge">{{ selectedLevel + 1 }}</span>
                    Heading {{ selectedLevel + 1 }} Style
                    <button type="button" class="reset-btn" (click)="resetCurrentLevel()" title="Reset to defaults">
                        <svg width="11" height="11" viewBox="0 0 12 12" fill="none">
                            <path d="M10 6A4 4 0 1 1 6 2a4 4 0 0 1 2.83 1.17L10 4.5" stroke="currentColor"
                                stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
                            <path d="M10 2v2.5H7.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                                stroke-linejoin="round" />
                        </svg>
                        Reset
                    </button>
                </div>

                <div class="style-grid">

                    <div class="field">
                        <label class="field-label" [for]="'tocLevel' + selectedLevel + 'FontSize'">Text size
                            (pt)</label>
                        <div class="stepper">
                            <button type="button" class="stepper-btn"
                                (click)="stepLevelValue('font-size', -0.5)">−</button>
                            <input [id]="'tocLevel' + selectedLevel + 'FontSize'" type="number" class="stepper-input"
                                min="1" max="64" step="0.5" formControlName="font-size">
                            <button type="button" class="stepper-btn"
                                (click)="stepLevelValue('font-size', 0.5)">+</button>
                        </div>
                    </div>

                    <div class="field">
                        <label class="field-label">Style</label>
                        <div class="style-toggles">
                            <button type="button" class="style-btn style-btn--bold"
                                [class.is-active]="selectedLevelForm.get('font-weight')?.value === 'bold'"
                                (click)="toggleBold()" title="Bold">
                                <b>B</b>
                            </button>
                            <button type="button" class="style-btn style-btn--italic"
                                [class.is-active]="selectedLevelForm.get('font-style')?.value === 'italic'"
                                (click)="toggleItalic()" title="Italic">
                                <i>I</i>
                            </button>
                        </div>
                    </div>

                    <div class="field">
                        <label class="field-label" [for]="'tocLevel' + selectedLevel + 'Color'">Color</label>
                        <div class="color-control">
                            <input [id]="'tocLevel' + selectedLevel + 'Color'" type="color" class="color-swatch"
                                formControlName="color">
                            <input type="text" class="color-hex" formControlName="color" maxlength="7">
                        </div>
                    </div>

                    <div class="field">
                        <label class="field-label" [for]="'tocLevel' + selectedLevel + 'Indent'">Indent level</label>
                        <div class="indent-wrap">
                            <div class="indent-track">
                                <div class="indent-fill" [style.width.%]="indentPercent">
                                </div>
                            </div>
                            <input [id]="'tocLevel' + selectedLevel + 'Indent'" type="range" class="indent-slider"
                                min="0" max="60" step="1" [value]="indentValue" (input)="onIndentChange($event)">
                        </div>
                    </div>

                </div>

                <button type="button" class="adv-toggle" [class.is-open]="showAdvancedSpacing"
                    (click)="toggleAdvancedSpacing()">
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                        <path d="M2 4l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                    Advanced spacing
                </button>

                <div class="adv-grid" *ngIf="showAdvancedSpacing">
                    <div class="field">
                        <label class="field-label" [for]="'tocLevel' + selectedLevel + 'MarginTop'">Space above</label>
                        <div class="stepper">
                            <button type="button" class="stepper-btn"
                                (click)="stepLevelValue('margin-top', -0.5)">−</button>
                            <input [id]="'tocLevel' + selectedLevel + 'MarginTop'" type="number" class="stepper-input"
                                min="0" max="120" step="0.5" formControlName="margin-top">
                            <button type="button" class="stepper-btn"
                                (click)="stepLevelValue('margin-top', 0.5)">+</button>
                        </div>
                    </div>

                    <div class="field">
                        <label class="field-label" [for]="'tocLevel' + selectedLevel + 'MarginBottom'">Space
                            below</label>
                        <div class="stepper">
                            <button type="button" class="stepper-btn"
                                (click)="stepLevelValue('margin-bottom', -0.5)">−</button>
                            <input [id]="'tocLevel' + selectedLevel + 'MarginBottom'" type="number"
                                class="stepper-input" min="0" max="120" step="0.5" formControlName="margin-bottom">
                            <button type="button" class="stepper-btn"
                                (click)="stepLevelValue('margin-bottom', 0.5)">+</button>
                        </div>
                    </div>

                    <div class="field">
                        <label class="field-label" [for]="'tocLevel' + selectedLevel + 'PaddingBottom'">Extra bottom
                            padding</label>
                        <div class="stepper">
                            <button type="button" class="stepper-btn"
                                (click)="stepLevelValue('padding-bottom', -0.5)">−</button>
                            <input [id]="'tocLevel' + selectedLevel + 'PaddingBottom'" type="number"
                                class="stepper-input" min="0" max="120" step="0.5" formControlName="padding-bottom">
                            <button type="button" class="stepper-btn"
                                (click)="stepLevelValue('padding-bottom', 0.5)">+</button>
                        </div>
                    </div>
                </div>

            </div>
        </section>
    </div>
</div>
