<dg-modal
    icon="fas fa-file-pdf"
    eyebrow="Document"
    title="Preview Document"
    subtitle="Pick the object the preview should be rendered for."
    (dismiss)="cancel()">

    <div class="preview-object">
        <label class="form-label">Select Object</label>
        <app-object-selector
            [typeIds]="typeIds"
            [multiple]="false"
            [includeFields]="false"
            [closeOnSelect]="true"
            [useInlineLoader]="true"
            (fullSelectionChange)="onObjectSelectionChange($event)">
        </app-object-selector>

        <small class="form-text text-muted mt-2 d-block">
            Choose the object that should be used to generate the preview document.
        </small>
    </div>

    <app-button
        dgModalFooter
        [bootstrapClass]="'btn-secondary'"
        label="Cancel"
        type="button"
        (clicked)="cancel()">
    </app-button>

    <app-button
        dgModalFooter
        [bootstrapClass]="'btn-success'"
        label="Preview"
        type="button"
        [disabled]="!selectedObject"
        (clicked)="preview()">
    </app-button>
</dg-modal>
