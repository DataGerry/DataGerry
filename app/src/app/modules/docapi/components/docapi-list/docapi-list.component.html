<span class="d-flex justify-content-between align-items-center">
    <h1>Document Templates</h1>
</span>

<hr />

<cmdb-info-box [message]="messageBlock" />

<ng-template #addButton>
    <a
      class="dg-button dg-button--solid dg-button--brand dg-button--sm me-1"
      *permissionLink="['base.docapi.template.add']"
      [routerLink]="['/docapi/add']">
      <i class="fas fa-plus" aria-hidden="true"></i>
      <span class="dg-button__label">Add</span>
    </a>
</ng-template>

<cmdb-table [items]="templates" [columns]="columns" [page]="page" [sort]="sort" [id]="'docapi-list-datatable'"
    [stateEnabled]="false" [emptyMessage]="'No doc templates were found!'" [customButtons]="[addButton]"
    [totalItems]="totalTemplates" [selectEnabled]="selectEnabled" [loading]="loading" [pageSize]="limit"
    (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)" (sortChange)="onSortChange($event)"
    (searchChange)="onSearchChange($event)" />

<ng-template #actionsTemplate let-item="item">
    <div class="d-flex justify-content-center">
        <a *permissionLink="['base.docapi.template.edit']" [routerLink]="['/docapi/edit/', item?.public_id]"
            title="Edit Template">
            <i class="far fa-edit spacing-right icon-edit"></i>
        </a>
        <a *permissionLink="['base.docapi.template.delete']" title="Delete Template"
            (click)="delDocTemplate(item?.public_id)">
            <i class="far fa-trash-alt spacing-right icon-delete"></i>
        </a>
    </div>
</ng-template>

<app-loading-popup [isVisible]="isLoading$ | async" message="We're Loading the Categories..."></app-loading-popup>
