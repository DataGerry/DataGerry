<form [formGroup]="fileForm" class="file-form">
    <div class="field">
        <app-form-select label="File format" formControlName="fileFormat" [items]="formatOptions" bindLabel="label"
            bindValue="value" placeholder="Select a format…" [required]="true"></app-form-select>
        <span class="field__hint">Choose the format of the file you want to import.</span>
    </div>

    <div class="field">
        <label for="formFile">File</label>

        <div class="dropzone" [class.dropzone--disabled]="fileFormat?.invalid">
            <input class="dropzone__input" type="file" id="formFile" [disabled]="fileFormat?.invalid"
                [accept]="selectedFileFormat" (change)="selectFile($event.target.files)">
            <div class="dropzone__content">
                <span class="dropzone__icon">
                    <i class="fas fa-cloud-arrow-up" aria-hidden="true"></i>
                </span>
                <span class="dropzone__title">
                    <strong>Click to browse</strong> or drop a file here
                </span>
                <span class="dropzone__meta">
                    @if (fileFormat?.invalid) {
                    Select a format first to enable file selection
                    } @else {
                    Accepted format: {{ selectedFileFormat }}
                    }
                </span>
            </div>
        </div>

        @if (file?.value) {
        <div class="file-chip">
            <i class="fas fa-file-lines" aria-hidden="true"></i>
            <span class="file-chip__name">{{ fileName }}</span>
            <i class="fas fa-circle-check file-chip__ok" aria-hidden="true"></i>
        </div>
        }
    </div>
</form>

<div class="step-actions step-actions--end">
    <app-button label="Next Step" bootstrapClass="btn-primary" [disabled]="fileForm.invalid" awNextStep></app-button>
</div>
