<form [formGroup]="fileForm" class="file-form">
    <div class="field">
        <app-form-select label="File format" formControlName="fileFormat" [items]="formatOptions" bindLabel="label"
            bindValue="value" placeholder="Select a format…" [required]="true"></app-form-select>
        <span class="field__hint">Choose the format of the file you want to import.</span>
    </div>

    @if (isJsonFormat) {
    <div class="step-callout" role="note">
        <i class="fas fa-circle-info" aria-hidden="true"></i>
        <span>
            The JSON file has to be a DATAGerry object export.
            <a *permissionLink="'base.export.object.*'" class="step-callout__link" routerLink="/export/objects">
                Go to object export
                <i class="fas fa-arrow-up-right-from-square" aria-hidden="true"></i>
            </a>
        </span>
    </div>
    }

    <div class="field">
        <app-file-dropzone formControlName="file" label="File" [required]="true"
            [acceptedExtensions]="selectedFileFormat"
            disabledHint="Select a format first to enable file selection"></app-file-dropzone>
    </div>
</form>

<div class="step-actions step-actions--end">
    <app-button label="Next Step" bootstrapClass="btn-primary" [disabled]="fileForm.invalid" awNextStep></app-button>
</div>
