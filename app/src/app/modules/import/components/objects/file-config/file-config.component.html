<ng-template #fileConfig></ng-template>

<div class="step-actions">
    <app-button label="Previous Step" icon="fas fa-angle-double-left" variant="outline" tone="neutral"
        awPreviousStep></app-button>
    <app-button label="Next Step" icon="fas fa-angle-double-right" iconPosition="end" variant="solid" tone="brand"
        awNextStep></app-button>
</div>

<app-loading-popup [isVisible]="isLoading$ | async" message="We're Processing the Data..."></app-loading-popup>
