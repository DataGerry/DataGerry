<ng-template #fileConfig></ng-template>

<div class="step-actions">
    <app-button label="Previous Step" icon="fas fa-angle-double-left" bootstrapClass="btn-warning"
        awPreviousStep></app-button>
    <app-button label="Next Step" bootstrapClass="btn-primary" awNextStep></app-button>
</div>

<app-loading-popup [isVisible]="isLoading$ | async" message="We're Processing the Data..."></app-loading-popup>
