<div class="select-step">
    <div class="step-callout">
        <i class="fas fa-circle-info" aria-hidden="true"></i>
        <span>
            The file has to contain a JSON list of types
        </span>
    </div>

    <form [formGroup]="fileForm" class="file-form">
        <app-file-dropzone formControlName="file" label="Type export file" [required]="true"
            acceptedExtensions="json" (fileSelected)="onFileSelected($event)" (cleared)="onFileCleared()"
            (rejected)="onFileRejected()"></app-file-dropzone>

        @if (parseError) {
        <p class="parse-error" role="alert">
            <i class="fas fa-triangle-exclamation" aria-hidden="true"></i>
            <span>{{ parseError }}</span>
        </p>
        }

        @if (canContinue) {
        <div class="parse-summary" role="status" aria-live="polite">
            <span class="parse-summary__icon" aria-hidden="true">
                <i class="fas fa-circle-check"></i>
            </span>
            <div class="parse-summary__body">
                <span class="parse-summary__title">
                    {{ parsedTypes.length }} {{ parsedTypes.length === 1 ? 'type' : 'types' }} found
                </span>
                <span class="parse-summary__text">The file was read successfully and is ready for review.</span>
            </div>
        </div>
        }
    </form>

    <div class="step-actions step-actions--end">
        <app-button label="Next Step" bootstrapClass="btn-primary" [disabled]="!canContinue" awNextStep></app-button>
    </div>
</div>
