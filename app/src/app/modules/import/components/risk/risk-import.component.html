<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span>Quick Risks Import</span>
        <!-- Add a button to navigate to the Risks Page -->
        <a class="dg-button dg-button--outline dg-button--neutral dg-button--sm" routerLink="/isms/risks">
            <span class="dg-button__label">Go to Risks Page</span>
        </a>
    </div>
    <div class="card-body">

        <app-button variant="link" tone="brand" [label]="showInstructions ? 'Hide Instructions' : 'Show Import Instructions'"
            (clicked)="showInstructions = !showInstructions"></app-button>

        @if (showInstructions) {

        <app-import-instructions [title]="importInstructions.title" [description]="importInstructions.description"
            [headers]="importInstructions.headers" [notes]="importInstructions.notes"
            [mappings]="importInstructions.mappings" [duplicates]="importInstructions.duplicates"
            [exampleCsv]="importInstructions.exampleCsv"></app-import-instructions>

        }

        <form [formGroup]="fileForm">
            <div class="mb-3">
                <label for="file" class="form-label">Select CSV File:</label>
                <input type="file" class="form-control" id="file" (change)="selectFile($event.target.files)"
                    accept=".csv" />
            </div>
            <app-button variant="solid" tone="brand" label="Import Risks" [disabled]="fileForm.invalid"
                (clicked)="importRisk()"></app-button>
        </form>
    </div>
</div>

<app-loading-popup [isVisible]="isLoading$ | async" message="Importing threat objects..."></app-loading-popup>
