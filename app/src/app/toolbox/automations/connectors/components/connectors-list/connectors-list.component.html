<div class="d-flex justify-content-between align-items-center">
  <h2>Connectors</h2>
  <div class="dg-button-row">
    <app-button variant="outline" tone="neutral" size="sm" icon="fa-solid fa-plug" label="Edit build-in Connnector"
      *permissionLink="'base.openCelium.connector.*'" (clicked)="configInternal()">
    </app-button>
    <app-button variant="solid" tone="brand" size="sm" icon="fas fa-plus" label="Add Connnector"
      *permissionLink="'base.openCelium.connector.add'" (clicked)="add()">
    </app-button>
  </div>
</div>

<hr />

<cmdb-table [items]="rows" [columns]="columns" [searchEnabled]="false" [totalItems]="totalConnectors"
  [paginationEnabled]="false" [pageSizeEnabled]="false" *permissionLink="'base.openCelium.connector.view'">
</cmdb-table>

<!-- Actions Template -->
<ng-template #actionsTemplate let-item="item">
  <span *permissionLink="'base.openCelium.connector.edit'">
    <i class="far fa-edit icon-margin icon-edit spacing-right" (click)="edit(item)" title="Edit Connector"></i>
  </span>

  <span *permissionLink="'base.openCelium.connector.delete'">
    <i class="far fa-trash-alt icon-delete" (click)="delete(item)" title="Delete Connector"></i>
  </span>
</ng-template>
