<div class="d-flex justify-content-between align-items-center">
  <h2>Automations</h2>
  <div>
    <div class="btn-group ms-2" *ngIf="automations?.length">
      <button type="button" id="autoRefreshButton" class="btn btn-sm btn-refresh dropdown-toggle text-white" data-bs-toggle="dropdown"
        aria-haspopup="true" aria-expanded="false">
        <i class="fas fa-sync-alt"></i> Auto Refresh: {{ getRefreshLabel() }}
      </button>
      <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="autoRefreshButton">
        <li>
          <button class="dropdown-item" type="button" (click)="refreshNow()">
            <i class="fas fa-sync-alt me-1"></i> Refresh now
          </button>
        </li>
        <li><hr class="dropdown-divider" /></li>
        <li *ngFor="let option of refreshOptions">
          <button class="dropdown-item" type="button" (click)="setAutoRefresh(option.value)">
            <span [class.fw-bold]="option.value === selectedRefreshMs">{{ option.label }}</span>
          </button>
        </li>
      </ul>
    </div>
    <button type="button" class="btn btn-sm btn-connectors ms-2 text-white" [routerLink]="['/automations/connectors']">
      <i class="fa-solid fa-plug"></i> Manage Connectors
    </button>
    <button type="button" class="btn btn-sm btn-licenses ms-2 text-white" [routerLink]="['/automations/licenses']" *ngIf="!isCloudMode">
      <i class="fa-solid fa-key"></i> View Licenses
    </button>
    <button type="button" class="btn btn-sm btn-add ms-2 text-white" [routerLink]="['/automations/add']">
      <i class="fas fa-plus"></i> Add Automation
    </button>
  </div>
</div>
<hr />

<!-- CMDB Table -->
<cmdb-table [items]="automations" [columns]="columns" [totalItems]="totalAutomations" [pageSize]="limit" [page]="page"
  [loading]="loading" [paginationEnabled]="false" [pageSizeEnabled]="false" [searchEnabled]="false" [infoEnabled]="false"
  (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)">
</cmdb-table>

<app-automation-progress-list
  *ngIf="openCeliumConfigOk"
  [automations]="automations"
  [refreshToken]="runningRefreshToken"
  (runningSchedulerIdsChange)="onRunningSchedulersChange($event)">
</app-automation-progress-list>

<!-- Direction Template -->
<ng-template #directionTemplate let-item="item">
  <span class="badge" [ngClass]="{
    'bg-primary': item.direction === 'incoming',
    'bg-success': item.direction === 'outgoing',
    'bg-warning': item.direction === 'internal'
  }" style="color: white;">
    {{ item.direction}}
  </span>
</ng-template>

<!-- Status Template -->
<ng-template #statusTemplate let-item="item">
  <span class="badge" [ngClass]="{
    'bg-success': item.status === true,
    'bg-secondary': item.status === false
  }" style="color: white;">
    {{ item.status === true ? 'Active' : 'Inactive' }}
  </span>
</ng-template>

<!-- Last Success Template -->
<ng-template #lastSuccessTemplate let-item="item">
  <div class="last-execution-cell">
    <div class="text-center">
      <div>{{ getLastSuccessDisplay(item).date }}</div>
      <div class="text-muted small">{{ getLastSuccessDisplay(item).taId }}</div>
    </div>
    <app-automation-logs-menu
      *ngIf="item.debugMode && hasLastSuccess(item)"
      [schedulerId]="item.schedulerId"
      status="s"
      (logsModalOpenChange)="onLogsModalOpenChange($event)">
    </app-automation-logs-menu>
  </div>
</ng-template>

<!-- Last Fail Template -->
<ng-template #lastFailTemplate let-item="item">
  <div class="last-execution-cell">
    <div class="text-center">
      <div>{{ getLastFailDisplay(item).date }}</div>
      <div class="text-muted small">{{ getLastFailDisplay(item).taId }}</div>
    </div>
    <app-automation-logs-menu
      *ngIf="item.debugMode && hasLastFail(item)"
      [schedulerId]="item.schedulerId"
      status="f"
      (logsModalOpenChange)="onLogsModalOpenChange($event)">
    </app-automation-logs-menu>
  </div>
</ng-template>

<!-- Last Duration Template -->
<ng-template #lastDurationTemplate let-item="item">
  <div class="text-center">
    {{ getLastDuration(item) }}
  </div>
</ng-template>

<!-- Logs Template -->
<ng-template #logsTemplate let-item="item">
  <div class="logs-toggle-cell">
    <label class="logs-toggle" [class.is-loading]="logToggleLoading[item.schedulerId]">
      <input
        type="checkbox"
        [checked]="item.debugMode"
        [disabled]="logToggleLoading[item.schedulerId]"
        (change)="toggleDebugMode(item, $event)" />
      <span class="slider"></span>
    </label>
  </div>
</ng-template>

<!-- Actions Template -->
<ng-template #actionsTemplate let-item="item">
  <div class="action-buttons">
    <i class="fas fa-play icon-margin btn-run" 
    [title]="isSchedulerRunning(item.schedulerId) ? 'Execution in progress' : 'Execute Scheduler'"
    [class.is-disabled]="isSchedulerRunning(item.schedulerId)"
    (click)="executeScheduler(item.schedulerId)">
 </i>
    <i class="fas fa-clock icon-margin btn-cron"  (click)="setCron(item)" title="Set Cron Job"></i>
    <i class="far fa-edit icon-margin btn-edit" style="margin-left: 5px;" (click)="editAutomation(item)" title="Edit Automation"></i>
    <i class="far fa-trash-alt btn-delete" style="margin-left: 5px;" (click)="delete(item)" title="Delete Automation"></i>
  </div>
</ng-template>


<app-loading-popup 
  [isVisible]="isLoading$ | async"
  message="We're Processing the Data..."
></app-loading-popup>
