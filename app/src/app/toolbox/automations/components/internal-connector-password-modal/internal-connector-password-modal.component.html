<dg-modal
  icon="fas fa-key"
  eyebrow="Automation"
  title="Internal Connector Authentication"
  (dismiss)="onCancel()">

  <p>Please enter the password for the internal DataGerry connector to proceed with automation setup.</p>

  <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="password">Password</label>
      <div class="input-group">
        <input #passwordInput type="password" class="form-control" id="password" formControlName="password"
          placeholder="Enter password" [class.is-invalid]="password.invalid && password.touched">
        <div class="input-group-append">
          <app-button variant="outline" tone="neutral" ariaLabel="Toggle password visibility"
            [icon]="passwordInput.type === 'password' ? 'fas fa-eye' : 'fas fa-eye-slash'"
            (clicked)="togglePasswordVisibility()">
          </app-button>
        </div>
      </div>
      @if (password.invalid && password.touched) {
      <div class="invalid-feedback">
        Password is required
      </div>
      }
    </div>

    @if (errorMessage) {
    <div class="alert alert-danger">
      {{ errorMessage }}
    </div>
    }
  </form>

  <div dgModalFooter class="dg-modal-actions">
    <app-button variant="outline" tone="neutral" label="Cancel" type="button" [disabled]="isLoading"
      (clicked)="onCancel()">
    </app-button>

    <app-button variant="solid" tone="brand" label="Authenticate" loadingText="Authenticating..."
      [loading]="isLoading" [disabled]="passwordForm.invalid" (clicked)="onSubmit()">
    </app-button>
  </div>
</dg-modal>
