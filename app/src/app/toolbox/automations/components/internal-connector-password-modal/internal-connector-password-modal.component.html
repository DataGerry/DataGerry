<dg-modal
  icon="fas fa-key"
  eyebrow="Automation"
  title="Internal Connector Authentication"
  (dismiss)="onCancel()">

  <p>Please enter the password for the internal DataGerry connector to proceed with automation setup.</p>

  <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="password">Password</label>
      <div class="input-group">
        <input #passwordInput type="password" class="form-control" id="password" formControlName="password"
          placeholder="Enter password" [class.is-invalid]="password.invalid && password.touched">
        <div class="input-group-append">
          <button class="btn btn-outline-secondary" type="button" (click)="togglePasswordVisibility()">
            <i class="fas"
              [ngClass]="passwordInput?.nativeElement?.type === 'password' ? 'fa-eye' : 'fa-eye-slash'"></i>
          </button>
        </div>
      </div>
      @if (password.invalid && password.touched) {
      <div class="invalid-feedback">
        Password is required
      </div>
      }
    </div>

    @if (errorMessage) {
    <div class="alert alert-danger">
      {{ errorMessage }}
    </div>
    }
  </form>

  <div dgModalFooter class="dg-modal-actions">
    <app-button [bootstrapClass]="'btn-outline-secondary'" label="Cancel" type="button" [disabled]="isLoading"
      (clicked)="onCancel()">
    </app-button>

    <button type="button" class="btn btn-primary" (click)="onSubmit()" [disabled]="passwordForm.invalid || isLoading">
      @if (isLoading) {
      <span class="spinner-border spinner-border-sm mr-2"></span>
      }
      {{ isLoading ? 'Authenticating...' : 'Authenticate' }}
    </button>
  </div>
</dg-modal>
