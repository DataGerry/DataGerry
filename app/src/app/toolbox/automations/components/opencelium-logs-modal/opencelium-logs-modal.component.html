<dg-modal
  icon="fas fa-file-lines"
  eyebrow="Automation"
  title="Logs"
  [scrollBody]="false"
  (dismiss)="activeModal.dismiss()">

  <button dgModalHeaderAction type="button" class="btn-action"
    [attr.aria-label]="isFullscreen ? 'Restore' : 'Maximize'" [attr.title]="isFullscreen ? 'Restore' : 'Maximize'"
    (click)="toggleFullscreen()">
    <i class="fas" [ngClass]="isFullscreen ? 'fa-compress' : 'fa-expand'"></i>
  </button>

  <div class="oc-logs-body">
    @if (executionId) {
    <app-automation-run-log [executionId]="executionId" [connectionId]="connectionId" [runStatus]="runStatus"
      [runDate]="runDate" (loaded)="onLogViewLoaded()">
    </app-automation-run-log>
    }
  </div>
</dg-modal>

<app-loading-popup [isVisible]="isLoading$ | async" message="We're Processing the Data..."></app-loading-popup>
