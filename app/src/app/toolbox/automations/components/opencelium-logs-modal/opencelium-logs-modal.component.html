<dg-modal
  icon="fas fa-file-lines"
  eyebrow="Automation"
  title="Logs"
  [scrollBody]="false"
  (dismiss)="activeModal.dismiss()">

  <app-button dgModalHeaderAction variant="ghost" tone="neutral" size="sm"
    [icon]="isFullscreen ? 'fas fa-compress' : 'fas fa-expand'"
    [ariaLabel]="isFullscreen ? 'Restore' : 'Maximize'" [title]="isFullscreen ? 'Restore' : 'Maximize'"
    (clicked)="toggleFullscreen()">
  </app-button>

  <div class="oc-logs-body">
    @if (executionId) {
    <opencelium-log-viewer [baseUrl]="baseUrl" [token]="token" [executionId]="executionId"
      (logViewLoad)="onLogViewLoaded()">
    </opencelium-log-viewer>
    }
  </div>
</dg-modal>

<app-loading-popup [isVisible]="isLoading$ | async" message="We're Processing the Data..."></app-loading-popup>
