<div class="connectors-testing-container">
  <h2>OpenCelium Connectors Testing Interface</h2>

  <!-- Test Controls Section -->
  <div class="test-controls">
    <div class="card mb-4">
      <div class="card-header">
        <h5 class="mb-0"> Tests</h5>
      </div>
      <div class="card-body">
        <div class="row">
          <div class="col-md-6">
            <button class="btn btn-primary me-2 mb-2" (click)="testGetAllConnectors()" [disabled]="loading">
              Test GET All Connectors
            </button>
            <button class="btn btn-primary me-2 mb-2" (click)="testGetAllInvokers()" [disabled]="loading">
              Test GET All Invokers
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Test Forms Section -->
    <div class="card mb-4">
      <div class="card-header">
        <h5 class="mb-0">(JSON Input)</h5>
      </div>
      <div class="card-body">
        <!-- Test Credentials Form -->
        <div class="mb-4">
          <h6>Test Connector Credentials</h6>
          <div class="row">
            <div class="col-md-12">
              <div class="mb-3">
                <label class="form-label">Test Data JSON</label>
                <textarea class="form-control json-textarea" rows="6" [(ngModel)]="testJson" placeholder='Enter JSON for testing credentials'></textarea>
              </div>
              <button class="btn btn-warning" (click)="testConnectorCredentials()" [disabled]="loading">
                Test Credentials
              </button>
            </div>
          </div>
        </div>

        <!-- Create/Update Connector Form -->
        <div class="mb-4">
          <h6>Create/Update Connector</h6>
          <div class="row">
            <div class="col-md-4">
              <div class="mb-3">
                <label class="form-label">Connector ID (for update/delete)</label>
                <input type="number" class="form-control" [(ngModel)]="connectorId" placeholder="Enter connector ID">
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-12">
              <div class="mb-3">
                <label class="form-label">Connector Data JSON</label>
                <textarea class="form-control json-textarea" rows="10" [(ngModel)]="connectorJson" placeholder='Enter complete connector JSON'></textarea>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-md-12">
              <button class="btn btn-success me-2" (click)="testCreateConnector()" [disabled]="loading">
                Create Connector
              </button>
              <button class="btn btn-info me-2" (click)="testUpdateConnector()" [disabled]="loading || !connectorId">
                Update Connector
              </button>
              <button class="btn btn-danger" (click)="testDeleteConnector()" [disabled]="loading || !connectorId">
                Delete Connector
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
