<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <dg-modal
    icon="fas fa-layer-group"
    eyebrow="ISMS"
    [title]="isViewMode
      ? 'View Impact Category: ' + form.get('name')?.value
      : isEditMode
        ? (isCopyMode ? 'Copy Impact Category' : 'Edit Impact Category')
        : 'Add Impact Category'"
    (dismiss)="onCancel()">

    <!-- Show Category Name field ONLY if not in View Mode -->
    @if (!isViewMode) {
    <div class="mb-3">
      <label class="form-label">
        Impact Category Name <span class="text-danger">*</span>
      </label>
      <input type="text" class="form-control" formControlName="name" placeholder="Enter category name..." />
      <!-- Category name is still required -->
      @if (
      form.get('name')?.invalid &&
      (form.get('name')?.touched || form.get('name')?.dirty)
      ) {
      <div class="invalid-feedback d-block">
        Category name is required.
      </div>
      }
    </div>
    }

    <!-- Impact Descriptions (Not Required Anymore) -->
    <div class="mb-3">
      <label class="form-label section-heading">Impact level description</label>

      <div formArrayName="impact_descriptions" class="impact-descriptions-wrapper">
        @for (row of impactDescriptions.controls; track row; let i = $index) {
        <div [formGroupName]="i" class="impact-descriptions-item">
          <!-- Impact Name (read-only from data) -->
          <div class="impact-label">
            {{ row.value.impact_name }}
          </div>

          <!-- Hidden Impact ID -->
          <input type="hidden" formControlName="impact_id" />

          <!-- Description (No longer required) -->
          <div class="mt-2">
            <label for="desc_{{ i }}" class="form-label">
              <!-- Description -->
            </label>
            <textarea id="desc_{{ i }}" class="form-control" formControlName="value" rows="2"
              placeholder="Enter description..." [readonly]="isViewMode"></textarea>
            <!-- No error messages since not required -->
          </div>
        </div>
        }
      </div>
    </div>

    <app-button
      dgModalFooter
      [bootstrapClass]="'btn-secondary'"
      [label]="isViewMode ? 'Close' : 'Cancel'"
      type="button"
      (clicked)="onCancel()">
    </app-button>

    @if (!isViewMode) {
    <button dgModalFooter type="submit" class="btn btn-success" [disabled]="isSubmitting || form.invalid">
      @if (!isSubmitting) {
      <span>
        <!-- If editing -->
        @if (isEditMode) {
        <span>
          @if (isCopyMode) {
          <span>Copy</span>
          }
          @if (!isCopyMode) {
          <span>Save</span>
          }
        </span>
        }
        <!-- If adding -->
        @if (!isEditMode) {
        <span>Create</span>
        }
      </span>
      }
      <!-- Spinner while submitting -->
      @if (isSubmitting) {
      <span class="spinner-border spinner-border-sm"></span>
      }
    </button>
    }
  </dg-modal>
</form>
