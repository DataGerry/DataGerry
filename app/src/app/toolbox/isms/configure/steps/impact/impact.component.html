<div *permissionLink="'base.isms.impact.view'">
    <div class="d-flex justify-content-between align-items-center mb-2">
        <h1>Impacts</h1>
        <app-button variant="solid" tone="brand" size="sm" label="Add" icon="fas fa-plus"
            (clicked)="addImpact()" *permissionLink="['base.isms.impact.add']" [disabled]="this.totalImpacts >= 10">
        </app-button>
    </div>

    <hr />

    <!--  Warning Alert -->
    @if (this.impacts.length < 3) { <app-warning-alert iconClass="fas fa-info-circle warning-icon"
        title="Insufficient Impacts:" message="You need to define at least 3 Impacts to proceed.">
        </app-warning-alert>
        }

        <!-- Table (cmdb-table) -->
        <cmdb-table [items]="impacts" [columns]="columns" [totalItems]="totalImpacts" [pageSize]="limit" [page]="page"
            [loading]="loading" [loading]="loading" [paginationEnabled]="false" [pageSizeEnabled]="false"
            [searchEnabled]="false" [infoEnabled]="false" (pageChange)="onPageChange($event)"
            (pageSizeChange)="onPageSizeChange($event)">
        </cmdb-table>

</div>
<!-- Actions Template -->
<ng-template #actionsTemplate let-item="item">
    <span *permissionLink="'base.isms.impact.edit'">
        <app-button variant="link" tone="brand" size="xs" icon="far fa-edit icon-edit" ariaLabel="Edit Impact"
          title="Edit Impact" (clicked)="editImpact(item)"></app-button>
    </span>
    <span *permissionLink="'base.isms.impact.delete'">
        <app-button variant="link" tone="danger" size="xs" icon="far fa-trash-alt icon-delete"
          ariaLabel="Delete Impact" title="Delete Impact" (clicked)="deleteImpact(item)"></app-button>
    </span>
</ng-template>

<app-loading-popup [isVisible]="isLoading$ | async" message="We're Processing the Data..."></app-loading-popup>
