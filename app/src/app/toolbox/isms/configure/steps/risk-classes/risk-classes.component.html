<div *permissionLink="'base.isms.riskClass.view'">
  <div class="d-flex justify-content-between align-items-center mb-2 mt-2 mb-2">
    <h1>Risk Classes</h1>
    <app-button variant="solid" tone="brand" size="sm" label="Add" icon="fas fa-plus"
      (clicked)="addRiskClass()" [disabled]="this.totalRiskClasses >= 10"
      *permissionLink="'base.isms.riskClass.add'">
    </app-button>
  </div>

  <hr />
  <!--  Warning Alert -->
  @if (this.riskClasses.length < 3) { <app-warning-alert iconClass="fas fa-info-circle warning-icon"
    title="Insufficient Risk Classes:" message="You need to define at least 3 risk classes to proceed.">
    </app-warning-alert>
    }

    @if (this.riskClasses.length >= 3) {
    <app-warning-alert iconClass="fas fa-sort-amount-down warning-icon" title="Structural Advisory:"
      message="Please ensure your risk classes are sorted from high to low risk height.">
    </app-warning-alert>
    }

    <!-- (cmdb-table) -->
    <cmdb-table [items]="riskClasses" [columns]="columns" [totalItems]="totalRiskClasses" [pageSize]="limit"
      [page]="page" [loading]="loading" [paginationEnabled]="false" [pageSizeEnabled]="false" [searchEnabled]="false"
      [draggableEnabled]="true" [pageSizeEnabled]="false" [infoEnabled]="false" (pageChange)="onPageChange($event)"
      (pageSizeChange)="onPageSizeChange($event)" (orderChange)="onOrderChange($event)">
    </cmdb-table>
</div>

<!-- Color Template -->
<ng-template #colorTemplate let-item="item">
  <div class="color-cell" [style.backgroundColor]="item.color" [style.color]="item.textColor">
    {{ item.color }}
  </div>
</ng-template>


<!-- Actions Template -->
<ng-template #actionsTemplate let-item="item">
  <span *permissionLink="'base.isms.riskClass.edit'">
    <app-button variant="link" tone="brand" size="xs" icon="far fa-edit icon-edit" ariaLabel="Edit Risk Class"
      title="Edit Risk Class" (clicked)="editRiskClass(item)"></app-button>
  </span>
  <span *permissionLink="'base.isms.riskClass.delete'">
    <app-button variant="link" tone="danger" size="xs" icon="far fa-trash-alt icon-delete"
      ariaLabel="Delete Risk Class" title="Delete Risk Class" (clicked)="onDeleteRiskClass(item)"></app-button>
  </span>
</ng-template>


<app-loading-popup [isVisible]="isLoading$ | async" message="We're Processing the Data..."></app-loading-popup>
