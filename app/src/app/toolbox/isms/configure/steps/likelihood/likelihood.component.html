<div *permissionLink="'base.isms.likelihood.view'">

    <div class="d-flex justify-content-between align-items-center mb-2">
        <h1>Likelihoods</h1>
        <app-button variant="solid" tone="brand" size="sm" label="Add" icon="fas fa-plus"
            (clicked)="addLikelihood()" [disabled]="this.totalLikelihoods >= 10"
            *permissionLink="'base.isms.likelihood.add'">
        </app-button>
    </div>

    <hr />

    <!--  Warning Alert -->
    @if (this.likelihoods.length < 3) { <app-warning-alert iconClass="fas fa-info-circle warning-icon"
        title="Insufficient Likelihoods:" message="You need to define at least 3 Likelihoods to proceed.">
        </app-warning-alert>
        }

        <!-- Table (cmdb-table) -->
        <cmdb-table [items]="likelihoods" [columns]="columns" [totalItems]="totalLikelihoods" [pageSize]="limit"
            [page]="page" [loading]="loading" [paginationEnabled]="false" [pageSizeEnabled]="false"
            [searchEnabled]="false" [infoEnabled]="false" (pageChange)="onPageChange($event)"
            (pageSizeChange)="onPageSizeChange($event)">
        </cmdb-table>

</div>

<!-- Actions Template -->
<ng-template #actionsTemplate let-item="item">


    <app-button *permissionLink="'base.isms.likelihood.edit'" variant="link" tone="brand" size="xs"
      icon="far fa-edit icon-edit" ariaLabel="Edit Likelihood" title="Edit Likelihood"
      (clicked)="editLikelihood(item)"></app-button>


    <app-button *permissionLink="'base.isms.likelihood.delete'" variant="link" tone="danger" size="xs"
      icon="far fa-trash-alt icon-delete" ariaLabel="Delete Likelihood" title="Delete Likelihood"
      (clicked)="deleteLikelihood(item)"></app-button>
</ng-template>

<app-loading-popup [isVisible]="isLoading$ | async" message="We're Processing the Data..."></app-loading-popup>
