<form [formGroup]="form" (ngSubmit)="onSubmit()">
  <dg-modal
    icon="fas fa-shield-halved"
    eyebrow="ISMS"
    [title]="isViewMode
      ? 'View Protection Goal: ' + form.get('name')?.value
      : isEditMode
        ? (isCopyMode ? 'Copy Protection Goal' : 'Edit Protection Goal')
        : 'Add Protection Goal'"
    (dismiss)="onCancel()">

    <!-- Show Name field ONLY if not in View Mode -->
    @if (!isViewMode) {
    <div class="mb-3">
      <label for="pgName" class="form-label">
        Protection Goal Name <span class="text-danger">*</span>
      </label>
      <input id="pgName" type="text" class="form-control" formControlName="name"
        placeholder="Enter protection goal name..." (input)="checkDuplicateName()" />
      <!-- Error message if name is required -->
      @if (form.get('name')?.touched && form.get('name')?.invalid) {
      <div class="invalid-feedback d-block">
        Name is required.
      </div>
      }
      <!-- Error message if name already exists -->
      @if (isDuplicateName) {
      <div class="invalid-feedback d-block">
        Name already exists.
      </div>
      }
    </div>
    }

    <app-button
      dgModalFooter
      [bootstrapClass]="'btn-secondary'"
      [label]="isViewMode ? 'Close' : 'Cancel'"
      type="button"
      (clicked)="onCancel()">
    </app-button>

    <!-- Show Save/Create/Copy button only if not in view mode -->
    @if (!isViewMode) {
    <button dgModalFooter type="submit" class="btn btn-success" [disabled]="isSubmitting || form.invalid">
      @if (!isSubmitting) {
      <span>
        <!-- If editing -->
        @if (isEditMode) {
        <span>
          @if (isCopyMode) {
          <span>Copy Protection Goal</span>
          }
          @if (!isCopyMode) {
          <span>Save Changes</span>
          }
        </span>
        }
        <!-- If adding -->
        @if (!isEditMode) {
        <span>Add Protection Goal</span>
        }
      </span>
      }
      <!-- Spinner while submitting -->
      @if (isSubmitting) {
      <span class="spinner-border spinner-border-sm"></span>
      }
    </button>
    }
  </dg-modal>
</form>
