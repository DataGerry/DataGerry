<div class="wizard-container">
  <!-- Wizard Navigation with dynamic classes -->
  <aw-wizard #wizard [awNavigationMode] navigateBackward="allow" navigateForward="allow" [defaultStepIndex]="0">
    <aw-wizard-step [stepTitle]="'Risk Classes'" [canExit]="true"></aw-wizard-step>
    <aw-wizard-step [stepTitle]="'Likelihood'" [canExit]="true"></aw-wizard-step>
    <aw-wizard-step [stepTitle]="'Impact'" [canExit]="true"></aw-wizard-step>
    <aw-wizard-step [stepTitle]="'Impact Categories'" [canEnter]="validationStatus.impacts"
      [canExit]="true"></aw-wizard-step>
    <aw-wizard-step [stepTitle]="'Protection Goals'" [canExit]="true"></aw-wizard-step>
    <aw-wizard-step [stepTitle]="'Risk Calculation'" [canExit]="true"></aw-wizard-step>
  </aw-wizard>

  <!-- Step Content -->
  <div class="step-content">
    @switch (wizard.currentStepIndex) {
    @case (0) {
    <app-isms-risk-classes [config]="ismsConfig"
      (riskClassesCountChange)="onRiskClassesCountChange($event)"></app-isms-risk-classes>
    }
    @case (1) {
    <app-isms-likelihood [config]="ismsConfig"
      (likelihoodCountChange)="onLikelihoodCountChange($event)"></app-isms-likelihood>
    }
    @case (2) {
    <app-isms-impact [config]="ismsConfig" (impactCountChange)="onImpactCountChange($event)"></app-isms-impact>
    }
    @case (3) {
    <app-isms-impact-categories [config]="ismsConfig"
      (impactCategoriesCountChange)="onImpactCategoriesCountChange($event)"></app-isms-impact-categories>
    }
    @case (4) {
    <app-isms-protection-goals [config]="ismsConfig"></app-isms-protection-goals>
    }
    @case (5) {
    <app-isms-risk-calculation [config]="ismsConfig" (configChange)="ismsConfig = $event"></app-isms-risk-calculation>
    }
    }
  </div>

  <!-- Navigation Buttons with dynamic classes -->
  <div class="navigation-buttons d-flex mt-3" [ngClass]="{
       'justify-content-between': wizard.currentStepIndex > 0 && wizard.currentStepIndex < totalSteps,
       'justify-content-end': wizard.currentStepIndex === 0 || wizard.currentStepIndex === totalSteps - 1
     }">

    @if (wizard.currentStepIndex > 0) {
    <button class="btn btn-secondary" (click)="previousStep()">Previous Step</button>
    }

    @if (wizard.currentStepIndex === totalSteps - 1) {

    <button class="btn btn-success" (click)="onSaveConfigurations()" *permissionLink="'base.isms.riskMatrix.edit'"
      [disabled]=" !riskCalculationComponent?.hasChanges || !riskCalculationComponent?.isMatrixComplete()">
      Save Configuration
    </button>

    }

    @if (wizard.currentStepIndex < totalSteps - 1) { <button class="btn btn-primary" [disabled]="!isStepValid()"
      (click)="nextStep()">
      Next Step
      </button>

      }
  </div>
</div>
