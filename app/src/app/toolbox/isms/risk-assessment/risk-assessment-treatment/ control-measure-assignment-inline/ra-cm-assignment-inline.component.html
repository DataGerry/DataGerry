<!-- ─── Add button ─────────────────────────────────────── -->
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>Assigned Controls</h3>
  @if (createMode) {
  <app-button variant="solid" tone="brand" size="sm" label="Add" icon="fas fa-plus" (clicked)="openModal()"></app-button>
  }
</div>

<!-- ─── Table ──────────────────────────────────────────── -->
<cmdb-table [items]="tableRows" [columns]="columns" [totalItems]="rowsLength" [page]="page" [pageSize]="pageSize"
  [selectEnabled]="false" [searchEnabled]="false" [pageSizeEnabled]="false" [paginationEnabled]="rowsLength > pageSize"
  [infoEnabled]="rowsLength > pageSize" (pageChange)="onPageChange($event)" (sortChange)="onSort($event)">
</cmdb-table>


<!-- ─── Row actions template ───────────────────────────── -->
<ng-template #cmActionsTpl let-row="item">
  <app-button variant="link" tone="brand" size="xs" icon="far fa-eye icon-view" ariaLabel="View" title="View"
    (clicked)="onViewRow(row)"></app-button>
  @if (createMode) {
  <app-button variant="link" tone="brand" size="xs" icon="far fa-edit icon-edit" ariaLabel="Edit" title="Edit"
    (clicked)="onEditRow(row)"></app-button>
  }
  @if (createMode) {
  <app-button variant="link" tone="danger" size="xs" icon="far fa-trash-alt icon-delete" ariaLabel="Delete"
    title="Delete" (clicked)="deleteRow(row)"></app-button>
  }
</ng-template>

<!-- ─── Modal ──────────────────────────────────────────── -->
<ng-template #modalTpl>
  <dg-modal
    icon="fas fa-clipboard-check"
    eyebrow="Assigned controls"
    [title]="(modalMode==='add' ? 'Add' : modalMode==='edit' ? 'Edit' : 'View') + ' control'"
    [scrollBody]="false"
    (dismiss)="closeModal()">

    <form [formGroup]="modalForm" class="w-100">
      <div class="row g-3">

        <div class="col-md-6">
          <label class="mb-1">Control <span class="required">*</span></label>

          <app-form-select class="w-100" [items]="availableControlMeasures" bindLabel="displayTitle"
            bindValue="public_id" formControlName="control_measure_id">
          </app-form-select>
        </div>

        <div class="col-md-6">
          <label class="mb-1">Planned Implementation Date</label>
          <app-form-date formControlName="planned_implementation_date"></app-form-date>
        </div>

        <div class="col-md-6">
          <label class="mb-1">Status <span class="required">*</span></label>
          <app-form-select class="w-100" [items]="implementationStates" bindLabel="value" bindValue="public_id"
            formControlName="implementation_status">
          </app-form-select>
        </div>

        <div class="col-md-6">
          <label class="mb-1">Finished Implementation Date</label>
          <app-form-date formControlName="finished_implementation_date"></app-form-date>
        </div>

        <div class="col-md-6">
          <label class="mb-1">Priority</label>
          <app-form-select class="w-100" [items]="priorityOptions" bindLabel="label" bindValue="value"
            formControlName="priority">
          </app-form-select>
        </div>

        <div class="col-md-6">
          <label class="mb-1">Responsible</label>
          <app-form-select class="w-100" [items]="responsibleOptions" bindLabel="display_name" bindValue="public_id"
            groupBy="group" formControlName="responsible_for_implementation_id">
          </app-form-select>
        </div>

      </div>
    </form>

    <!-- footer: Close always, save action only outside view mode -->
    <div dgModalFooter class="dg-modal-actions">
      <app-button variant="outline" tone="neutral" label="Close" type="button" (clicked)="closeModal()">
      </app-button>

      @if (modalMode!=='view') {
      <app-button variant="solid" tone="brand" [disabled]="modalForm.invalid"
        [label]="modalMode==='edit' ? 'Save Changes' : 'Add control'" type="button" (clicked)="saveAssignment()">
      </app-button>
      }
    </div>
  </dg-modal>
</ng-template>
