<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Vulnerabilities</h2>
  <div class="d-flex align-items-center gap-2">
    <!-- Delete selected button -->
    <app-button variant="solid" tone="danger" size="sm" icon="far fa-trash-alt" *permissionLink="'base.isms.vulnerability.delete'"
      [label]="selectedVulnerabilities.length ? 'Delete Selected (' + selectedVulnerabilities.length + ')' : 'Delete Selected'"
      [disabled]="!selectedVulnerabilities.length" (clicked)="onDeleteSelected()" title="Delete selected vulnerabilities">
    </app-button>
    <!-- Add button -->
    <app-button variant="solid" tone="brand" size="sm" label="Add" icon="fas fa-plus" (clicked)="onAddNew()" *permissionLink="'base.isms.vulnerability.add'">
    </app-button>
  </div>
</div>
<hr />

<cmdb-table [items]="threats" [columns]="columns" [page]="page" [sort]="sort" [id]="'threats-table'"
  [emptyMessage]="'No Vulnerabilities found.'" [totalItems]="totalThreats" [selectEnabled]="true"
  [selectedItems]="selectedVulnerabilities" [loading]="loading"
  [pageSize]="limit" [toggleable]="true" [initialVisibleColumns]="initialVisibleColumns"
  (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)" (sortChange)="onSortChange($event)"
  (searchChange)="onSearchChange($event)" (selectedChange)="onSelectedChange($event)">
</cmdb-table>

<!-- Action Template -->
<ng-template #actionTemplate let-data="data" let-item="item">
    <!-- View button -->
    <a (click)="onView(item)" title="View Vulnerability" *permissionLink="'base.isms.vulnerability.view'">
      <i class="far fa-eye icon-margin icon-view spacing-right"></i>
    </a>
  <!-- Edit button -->
  <a (click)="onEdit(item)" title="Edit Vulnerability" *permissionLink="'base.isms.vulnerability.edit'">
    <i class="far fa-edit icon-margin icon-edit spacing-right"></i>
  </a>

  <!-- Delete button -->
  <a (click)="onDelete(item)" title="Delete Vulnerability" *permissionLink="'base.isms.vulnerability.delete'">
    <i class="far fa-trash-alt icon-delete"></i>
  </a>
</ng-template>

<!-- Source Template (to display the source names) -->
<ng-template #sourceTemplate let-data="data" let-item="item">
  <span>{{ getSourceNames(data) }}</span>
</ng-template>
