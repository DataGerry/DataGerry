<section class="soa-page flex flex-col gap-4">
  <div style="display: flex; flex-direction: row; justify-content: space-between; margin-bottom: 10px; align-items: center;">
    <h1 class="text-2xl font-semibold m-0">
      Statement of Applicability&nbsp;(SOA)
    </h1>

    <div class="flex-shrink-0">
      <ng-container *ngTemplateOutlet="exportTemplate"></ng-container>
    </div>
  </div>

  <cmdb-table [columns]="columns" [items]="controls" [loading]="loading" [page]="page" [pageSize]="limit"
    [totalItems]="totalItems" [searchEnabled]="false" (pageChange)="onPageChange($event)"
    (pageSizeChange)="onPageSizeChange($event)">
  </cmdb-table>
</section>

<ng-template #exportTemplate>
  <div class="dropdown" *permissionLink="'base.export.type.*'">
    <button
      type="button"
      class="dg-button dg-button--outline dg-button--neutral dg-button--sm"
      id="exportButton"
      data-bs-toggle="dropdown"
      aria-haspopup="menu"
      aria-expanded="false">
      <i class="fas fa-file-export" aria-hidden="true"></i>
      <span class="dg-button__label">Export</span>
    </button>
    <ul class="dropdown-menu dropdown-menu-end dropdown-menu-lg-left" aria-labelledby="exportButton">
      <li>
        <button type="button" class="dropdown-item" (click)="exportCsv()">
          <i class="fas fa-file-csv me-1"></i> Export CSV
        </button>
      </li>
      <li>
        <button type="button" class="dropdown-item" (click)="exportXlsx()">
          <i class="fas fa-file-excel me-1"></i> Export XLSX
        </button>
      </li>
      <li>
        <button type="button" class="dropdown-item" (click)="exportPdf()">
          <i class="fas fa-file-pdf me-1"></i> Export PDF
        </button>
      </li>
    </ul>
  </div>
</ng-template>

<ng-template #applicableTpl let-data="data">
  <fa-icon
    [icon]="data === true ? 'check' : 'times'"
    [ngClass]="data === true ? 'text-success' : 'text-danger'">
  </fa-icon>
</ng-template>
