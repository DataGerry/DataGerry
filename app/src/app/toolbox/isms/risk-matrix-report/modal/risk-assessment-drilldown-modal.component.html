<dg-modal
  icon="fas fa-clipboard-list"
  eyebrow="Risk assessment"
  title="Risk Assessment Details"
  [scrollBody]="false"
  (dismiss)="activeModal.dismiss()">

  <!-- Risk Assessment Table -->
  <div class="table-container">
    <app-risk-assessment-list [assessmentIds]="assessmentIds" [fromReport]="true"></app-risk-assessment-list>
  </div>

  <app-button dgModalFooter [bootstrapClass]="'btn-secondary'" label="Close" type="button"
    (clicked)="activeModal.dismiss()">
  </app-button>
</dg-modal>
