<div class="d-flex justify-content-between align-items-center mb-3">
  <button *permissionLink="['base.isms.controlMeasureAssignment.add']" class="btn btn-sm btn-success"
    (click)="onAddNew()">
    <i class="fas fa-plus"></i> Add
  </button>
</div>
<hr />

<cmdb-table *permissionLink="['base.isms.controlMeasureAssignment.view']" [items]="assignments" [columns]="columns"
  [page]="page" [sort]="sort" [id]="'control-measure-assignments-table'" [emptyMessage]="'No assignments found.'"
  [totalItems]="totalAssignments" [selectEnabled]="false" [loading]="loading" [pageSize]="limit" [toggleable]="false"
  [initialVisibleColumns]="initialVisibleColumns" [searchEnabled]="false" [infoEnabled]="false"
  [paginationEnabled]="false" [pageSizeEnabled]="false">
</cmdb-table>



<ng-template #actionTemplate let-item="item">
  <span *permissionLink="['base.isms.controlMeasureAssignment.edit']">
    <i class="far fa-eye spacing-right icon-view" (click)="onView(item)" title="View"></i>
  </span>
  <span *permissionLink="['base.isms.controlMeasureAssignment.edit']">
    <i class="far fa-edit icon-edit spacing-right" (click)="onEdit(item)" title="Edit"></i>
  </span>
  <span *permissionLink="['base.isms.controlMeasureAssignment.delete']">
    <i class="far fa-trash-alt icon-delete" (click)="onDelete(item)" title="Delete"></i>
  </span>
</ng-template>
