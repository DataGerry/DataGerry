<div class="d-flex justify-content-between align-items-center mb-3">
  <app-button *permissionLink="['base.isms.controlMeasureAssignment.add']" variant="solid" tone="brand" size="sm"
    label="Add" icon="fas fa-plus" (clicked)="onAddNew()">
  </app-button>
</div>
<hr />

<cmdb-table *permissionLink="['base.isms.controlMeasureAssignment.view']" [items]="assignments" [columns]="columns"
  [page]="page" [sort]="sort" [id]="'control-measure-assignments-table'" [emptyMessage]="'No assignments found.'"
  [totalItems]="totalAssignments" [selectEnabled]="false" [loading]="loading" [pageSize]="limit" [toggleable]="false"
  [initialVisibleColumns]="initialVisibleColumns" [searchEnabled]="false" [infoEnabled]="false"
  [paginationEnabled]="false" [pageSizeEnabled]="false">
</cmdb-table>



<ng-template #actionTemplate let-item="item">
  <span *permissionLink="['base.isms.controlMeasureAssignment.edit']">
    <app-button variant="link" tone="brand" size="xs" icon="far fa-eye icon-view" ariaLabel="View" title="View"
      (clicked)="onView(item)"></app-button>
  </span>
  <span *permissionLink="['base.isms.controlMeasureAssignment.edit']">
    <app-button variant="link" tone="brand" size="xs" icon="far fa-edit icon-edit" ariaLabel="Edit" title="Edit"
      (clicked)="onEdit(item)"></app-button>
  </span>
  <span *permissionLink="['base.isms.controlMeasureAssignment.delete']">
    <app-button variant="link" tone="danger" size="xs" icon="far fa-trash-alt icon-delete" ariaLabel="Delete"
      title="Delete" (clicked)="onDelete(item)"></app-button>
  </span>
</ng-template>
