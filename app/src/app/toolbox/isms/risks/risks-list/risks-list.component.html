<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Risks</h2>
  <div class="d-flex align-items-center gap-2">
    <!-- Delete selected button -->
    <app-button variant="solid" tone="danger" size="sm" icon="far fa-trash-alt" *permissionLink="['base.isms.risk.delete']"
      label="Delete Selected" [badge]="selectedRisks.length"
      [disabled]="!selectedRisks.length" (clicked)="onDeleteSelected()" title="Delete selected risks">
    </app-button>
    <!-- Add button -->
    <app-button variant="solid" tone="brand" size="sm" label="Add" icon="fas fa-plus" *permissionLink="['base.isms.risk.add']" (clicked)="onAddNew()">
    </app-button>
  </div>
</div>
<hr />

<cmdb-table  *permissionLink="['base.isms.risk.view']" [items]="risks" [columns]="columns" [page]="page" [sort]="sort" [id]="'risks-table'"
  [emptyMessage]="'No risks found.'" [totalItems]="totalRisks" [selectEnabled]="true"
  [selectedItems]="selectedRisks" [loading]="loading"
  [pageSize]="limit" [toggleable]="true" [initialVisibleColumns]="initialVisibleColumns"
  (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)" (sortChange)="onSortChange($event)"
  (searchChange)="onSearchChange($event)" (selectedChange)="onSelectedChange($event)">
</cmdb-table>

<!-- Risk Type Template -->
<ng-template #riskTypeTemplate let-data="data" let-item="item">
  <span>
    {{ item.risk_type }}
  </span>
</ng-template>

<!-- Actions Template -->
<ng-template #actionTemplate let-data="data" let-item="item">
  <app-button *permissionLink="['base.isms.risk.view']" variant="link" tone="brand" size="xs"
    icon="far fa-eye icon-view" ariaLabel="View Risk" title="View Risk" (clicked)="onView(item)"></app-button>
  <app-button *permissionLink="['base.isms.risk.edit']" variant="link" tone="brand" size="xs"
    icon="far fa-edit icon-edit" ariaLabel="Edit Risk" title="Edit Risk" (clicked)="onEdit(item)"></app-button>
  <app-button *permissionLink="['base.isms.risk.delete']" variant="link" tone="danger" size="xs"
    icon="far fa-trash-alt icon-delete" ariaLabel="Delete Risk" title="Delete Risk" (clicked)="onDelete(item)"></app-button>
</ng-template>


<!-- Category Template -->
<ng-template #categoryTemplate let-data="data" let-item="item">
  <span>{{ getCategoryName(data) }}</span>
</ng-template>
