<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Threats</h2>
  <div class="d-flex align-items-center gap-2">
    <!-- Delete selected button -->
    <app-button variant="solid" tone="danger" size="sm" icon="far fa-trash-alt" *permissionLink="['base.isms.threat.delete']"
      [label]="selectedThreats.length ? 'Delete Selected (' + selectedThreats.length + ')' : 'Delete Selected'"
      [disabled]="!selectedThreats.length" (clicked)="onDeleteSelected()" title="Delete selected threats">
    </app-button>
    <!-- Add button -->
    <app-button variant="solid" tone="brand" size="sm" label="Add" icon="fas fa-plus" *permissionLink="['base.isms.threat.add']" (clicked)="onAddNew()">
    </app-button>
  </div>
</div>
<hr />

<cmdb-table [items]="threats" [columns]="columns" [page]="page" [sort]="sort" [id]="'threats-table'"
  [emptyMessage]="'No threats found.'" [totalItems]="totalThreats" [selectEnabled]="true"
  [selectedItems]="selectedThreats" [loading]="loading"
  [pageSize]="limit" [toggleable]="true" [initialVisibleColumns]="initialVisibleColumns"
  (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)" (sortChange)="onSortChange($event)"
  (searchChange)="onSearchChange($event)" (selectedChange)="onSelectedChange($event)">
</cmdb-table>

<!-- Action Template -->
<ng-template #actionTemplate let-data="data" let-item="item">

  <i *permissionLink="['base.isms.threat.view']" class="far fa-eye icon-margin icon-view spacing-right"
    (click)="onView(item)" title="View Threat"></i>
  <i *permissionLink="['base.isms.threat.edit']" class="far fa-edit icon-margin icon-edit spacing-right"
    (click)="onEdit(item)" title="Edit Threat"></i>
  <i *permissionLink="['base.isms.threat.delete']" class="far fa-trash-alt icon-delete" (click)="onDelete(item)"
    title="Delete Threat"></i>
</ng-template>

<ng-template #sourceTemplate let-data="data" let-item="item">
  <span>{{ getSourceNames(data) }}</span>
</ng-template>
