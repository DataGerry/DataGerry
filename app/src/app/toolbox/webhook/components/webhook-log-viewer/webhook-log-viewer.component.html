<div class="d-flex justify-content-between align-items-center">
  <h1>Webhook Log Viewer</h1>
</div>

  <app-button class="mt-3" variant="outline" tone="neutral" size="sm" label="Go Back" icon="fas fa-arrow-left"
    (clicked)="goBack()">
  </app-button>
<hr />
<p class="text-muted">
  <i class="fas fa-info-circle me-1" aria-hidden="true"></i>
  Changes to objects the webhook owner may not read are skipped and not logged.
</p>
 <cmdb-table
  [items]="logs"
  [columns]="columns"
  [totalItems]="totalLogs"
  [loading]="loading"
  [pageSize]="limit"
  [page]="page"
  [sort]="sort"
  [sortable]="true"
  [searchEnabled]="true"
  (pageChange)="onPageChange($event)"
  (pageSizeChange)="onPageSizeChange($event)"
  (sortChange)="onSortChange($event)"
  (searchChange)="onSearchChange($event)"
>
</cmdb-table>
 <!-- Actions Template -->
<ng-template #actionsTemplate let-item="item">

  <span *permissionLink="['base.framework.webhook.delete']">
    <i class="far fa-trash-alt icon-delete" 
    (click)="onDeleteLog(item)"
    title="Delete Log"
    ></i>
  </span>
</ng-template>


<app-loading-popup 
  [isVisible]="isLoading$ | async"
  message="We're Processing the Data..."
></app-loading-popup>
