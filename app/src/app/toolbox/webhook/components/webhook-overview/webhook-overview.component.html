<div class="d-flex justify-content-between align-items-center">
  <h1>Webhooks</h1>
  <div class="dg-button-row">
  <a
    class="dg-button dg-button--outline dg-button--neutral dg-button--sm"
    [routerLink]="['/webhooks/logs']"
    *permissionLink="['base.framework.webhook.view']">
    <i class="fas fa-history" aria-hidden="true"></i>
    <span class="dg-button__label">Webhook Logs</span>
  </a>
  <a
    class="dg-button dg-button--solid dg-button--brand dg-button--sm"
    [routerLink]="['/webhooks/create']"
    *permissionLink="['base.framework.webhook.add']">
    <i class="fas fa-plus" aria-hidden="true"></i>
    <span class="dg-button__label">Add</span>
  </a>
</div>
</div>
<hr />

<cmdb-table
  [items]="webhooks"
  [columns]="columns"
  [totalItems]="totalWebhooks"
  [pageSize]="limit"
  [page]="page"
  [loading]="loading"
  (pageChange)="onPageChange($event)"
  (pageSizeChange)="onPageSizeChange($event)"
  (searchChange)="onSearchChange($event)"
>
</cmdb-table>

<!-- Actions Template -->
<ng-template #actionsTemplate let-item="item">

  <span *permissionLink="['base.framework.webhook.edit']">
    <app-button variant="link" tone="brand" size="xs" icon="far fa-edit icon-edit" ariaLabel="Edit Webhook"
      title="Edit Webhook" (clicked)="editWebhook(item.public_id)"></app-button>
  </span>

<span *permissionLink="['base.framework.webhook.delete']">
  <app-button variant="link" tone="danger" size="xs" icon="far fa-trash-alt icon-delete" ariaLabel="Delete Webhook"
    title="Delete Webhook" (clicked)="onDeleteWebhook(item)"></app-button>
</span>
</ng-template>

<!-- Owner Template -->
<ng-template #ownerTemplate let-item="item">
  @switch (item.owner?.status) {
    @case ('none') {
      <span class="badge text-bg-warning" title="Receives no changes until someone saves it">No owner</span>
    }
    @case ('inactive') {
      <span>{{ item.owner.label }}</span>
      <span class="badge text-bg-secondary ms-1" title="An inactive owner's webhook receives no changes">Inactive</span>
    }
    @case ('deleted') {
      <span class="badge text-bg-danger" title="Receives no changes until someone saves it">{{ item.owner.label }}</span>
    }
    @default {
      <span>{{ item.owner?.label }}</span>
    }
  }
</ng-template>

<!-- status Template -->
<ng-template #statusTemplate let-item="item">
  <span [ngClass]="{'text-success': item.active, 'text-danger': !item.active}">
    {{ item.active ? 'Active' : 'Not Active' }}
  </span>
 </ng-template>

 <app-loading-popup 
  [isVisible]="isLoading$ | async"
  message="We're Processing the Data..."
></app-loading-popup>
