<div class="d-flex justify-content-between align-items-center">
  <h1>Report Categories Overview </h1>
</div>
<hr />


<div class="d-flex justify-content-between align-items-center" style="height: 50px;">
  <app-button variant="outline" tone="neutral" size="sm" label="Go Back" icon="fas fa-arrow-left"
    (clicked)="goBack()">
  </app-button>

  <app-button variant="solid" tone="brand" size="sm" label="Add Category" icon="fas fa-plus"
    *permissionLink="'base.framework.report.add'" (clicked)="openAddCategoryModal()">
  </app-button>
</div>

<cmdb-table [items]="categories" [columns]="columns" [totalItems]="totalCategories" [loading]="loading" [pageSize]="10"
  (pageChange)="onPageChange($event)" (sortChange)="onSortChange($event)"
  (searchChange)="onSearchChange($event)"></cmdb-table>

<ng-template #actionsTemplate let-item="item">
  @if (!item.predefined) {
  <i class="far fa-edit icon-margin icon-edit" *permissionLink="'base.framework.report.edit'" title="Edit Category"
    (click)="openEditCategoryModal(item)"></i>
  }
  @if (!item.predefined) {
  <i class="far fa-trash-alt icon-delete" *permissionLink="'base.framework.report.delete'" title="Delete Category"
    (click)="openDeleteCategoryModal(item)"></i>
  }
</ng-template>

<app-loading-popup [isVisible]="isLoading$ | async" message="We're Processing the Data..."></app-loading-popup>
