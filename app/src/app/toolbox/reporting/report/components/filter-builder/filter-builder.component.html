@if (fields && fields.length > 0 && showQueryBuilder) {
<div>
    <h5>
        <span class="bold-text">Fields Filter</span> <span class="required">*</span>:
    </h5>
    <query-builder [(ngModel)]="query" [config]="config" [classNames]="classNames"
        (ngModelChange)="onQueryChange($event)">
        <ng-container *queryInput="let rule">
            @if (!shouldHideValueField(rule.operator)) {
            <input [(ngModel)]="rule.value" class="form-control"
                [type]="config.fields[rule.field]?.type === 'number' ? 'number' : 'text'" />
            }
        </ng-container>

    </query-builder>
</div>
}
