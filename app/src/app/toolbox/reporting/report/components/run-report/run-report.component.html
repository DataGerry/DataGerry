@if (showHeader) {
<div class="d-flex justify-content-between align-items-center">
  <h1>Report Results</h1>
</div>
}
@if (showHeader) {
<hr />
}
@if (showActions) {
<div class="d-flex justify-content-between align-items-center button-margin">
  @if (showGoBack) {
  <app-button variant="outline" tone="neutral" size="sm" label="Go Back" icon="fas fa-arrow-left"
    (clicked)="goBack()">
  </app-button>
  }
  @if (showExport) {
  <app-button variant="outline" tone="neutral" label="Export as CSV" [disabled]="!disableExportButton()"
    (clicked)="exportingFiles()">
  </app-button>
  }
</div>
}
<cmdb-table [items]="displayedItems" [totalItems]="total" [columns]="columns" [sort]="sort" [loading]="loading"
  [page]="page" [pageSize]="limit" [sortable]="enableSorting" [searchEnabled]="enableSearch"
  [paginationEnabled]="enablePagination" [pageSizeEnabled]="enablePageSize" [infoEnabled]="enableInfo"
  (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)" (sortChange)="onSortChange($event)"
  (searchChange)="onSearchChange($event)">
</cmdb-table>

<app-loading-popup [isVisible]="isLoading$ | async" message="We're Processing the Data..."></app-loading-popup>
