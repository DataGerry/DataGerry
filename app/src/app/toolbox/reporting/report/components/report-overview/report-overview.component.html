<div class="d-flex justify-content-between align-items-center">
    <h1>Reports Overview</h1>
    <div class="dg-button-row">
    @if (canManageCategories) {
    <a
      class="dg-button dg-button--outline dg-button--neutral dg-button--sm"
      [routerLink]="['/reports/categories']">
      <i class="fas fa-edit" aria-hidden="true"></i>
      <span class="dg-button__label">Edit Report Categories</span>
    </a>
    }
    <a
      class="dg-button dg-button--solid dg-button--brand dg-button--sm"
      *permissionLink="'base.framework.report.add'"
      [routerLink]="['/reports/create']">
      <i class="fas fa-plus" aria-hidden="true"></i>
      <span class="dg-button__label">Add</span>
    </a>
</div>
  </div>
  <hr/>  

  <cmdb-table [items]="reports" [columns]="columns" [totalItems]="totalReports"   [reportRowValidationClass]="reportRowValidationClass"
    [loading]="loading" [pageSize]="limit" [page]="page" [sort]="sort" [sortable]="true" [searchEnabled]="true"
    (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)" (sortChange)="onSortChange($event)"
    (searchChange)="onSearchChange($event)">
  </cmdb-table>


  <ng-template #actionsTemplate let-item="item">
    <div class="action-buttons">
      <i class="fas fa-play icon-margin icon-run" 
      [class.text-muted]="hasMissingRequiredFields(item)"
      [class.pe-none]="hasMissingRequiredFields(item)"
      [title]="hasMissingRequiredFields(item) ? 'No fields selected' : 'Run Report'"
      (click)="!hasMissingRequiredFields(item) && runReport(item)">
   </i>
      <i class="far fa-edit icon-margin icon-edit" *permissionLink="'base.framework.report.edit'"
        (click)="editReport(item.public_id)" title="Edit Report"></i>
      <i class="far fa-trash-alt icon-delete" *permissionLink="'base.framework.report.delete'"
        (click)="openDeleteReportModal(item)" title="Delete Report"></i>
    </div>
  </ng-template>

<app-loading-popup 
  [isVisible]="isLoading$ | async"
  message="We're Processing the Data..."
></app-loading-popup>
