<dg-modal
    icon="fas fa-trash-can"
    eyebrow="Objects"
    title="Delete selected objects"
    subtitle="This action cannot be undone"
    (dismiss)="activeModal.dismiss('close')">

    <p class="delete-lead">Are you sure you want to delete all selected objects?</p>

    <app-button dgModalFooter label="Cancel" type="button" bootstrapClass="btn-secondary"
        (clicked)="activeModal.close('close')"></app-button>
    <app-button dgModalFooter label="Delete objects" type="button" bootstrapClass="btn-danger"
        icon="fas fa-trash-can" (clicked)="activeModal.close('delete')"></app-button>
</dg-modal>
