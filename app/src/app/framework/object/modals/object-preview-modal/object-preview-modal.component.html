<dg-modal
    icon="fas fa-eye"
    [eyebrow]="renderResult?.type_information?.type_label"
    title="Preview"
    (dismiss)="activeModal.dismiss()">

    <div class="renderForm">
        <cmdb-render [renderResult]="renderResult" [mode]="mode" [renderForm]="formGroupDummy"></cmdb-render>
    </div>

    <app-button dgModalFooter label="Cancel" type="button" bootstrapClass="btn-secondary"
        (clicked)="activeModal.close()"></app-button>
</dg-modal>
