<dg-modal
    icon="fas fa-trash-can"
    eyebrow="Object"
    [title]="'Delete Object: ' + publicID"
    (dismiss)="activeModal.close(0)">

    <p class="delete-lead">Are you sure you want to delete this object?</p>

    <div class="delete-callout" role="alert">
        <i class="fas fa-triangle-exclamation delete-callout__icon" aria-hidden="true"></i>
        <span class="delete-callout__text">
            This action permanently removes every object relation where this object is referenced.
        </span>
    </div>

    <app-button dgModalFooter label="Cancel" type="button" bootstrapClass="btn-secondary"
        (clicked)="activeModal.close(0)"></app-button>
    <app-button dgModalFooter label="Delete object" type="button" bootstrapClass="btn-danger"
        icon="fas fa-trash-can" (clicked)="activeModal.close(publicID)"></app-button>
</dg-modal>
