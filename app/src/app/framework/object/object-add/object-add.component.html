<div class="container-fluid p-0 m-0">
    <div class="row">
        <div class="col-sm-10">
            <h1>
                Add new object: <strong>{{typeInstance?.label}}</strong>
            </h1>
        </div>
        @if (typeInstance) {
<div class="col-sm-2 text-end">
            <div class="dg-button-row dg-button-row--end p-1">
                <app-button
                    label="Cancel"
                    variant="outline"
                    tone="neutral"
                    routerLink="/framework/object/type/{{typeInstance?.public_id}}"
                ></app-button>

                <app-button
                    label="Save"
                    variant="solid"
                    tone="brand"
                    type="submit"
                    [disabled]="!renderForm.valid && !isSaving"
                    (clicked)="saveObject()"
                ></app-button>
            </div>
        </div>
}
    </div>
</div>

<hr/>

@if (!typeInstance) {

    <form [formGroup]="typeIDForm" novalidate>
        <div class="form-group row">
            <label class="col-sm-2 col-form-label">
                Select type:
            </label>
            <div class="col-sm-10">
                <div class="input-group mb-3">
                    <ng-select
                        [items]="typeList"
                        formControlName="typeID"
                        bindLabel="label"
                        bindValue="public_id"
                        required
                    >
                        <ng-template ng-optgroup-tmp let-item="item">
                            <span style="vertical-align: middle;">{{item.name}}</span>
                            <span class="ms-1 badge bg-secondary">{{item.total}}</span>
                        </ng-template>
                    </ng-select>
                        <app-button
                            label="Add"
                            variant="solid"
                            tone="brand"
                            icon="fas fa-plus"
                            type="submit"
                            [disabled]="!typeIDForm.valid"
                            (clicked)="useTypeID()"
                        ></app-button>
                </div>
            </div>
        </div>
    </form>

} @else {

    <form
        [formGroup]="renderForm"
        class="renderForm needs-validation"
        novalidate
        autocomplete="off"
        (ngSubmit)="saveObject()"
    >
        <cmdb-render
            [mode]="mode"
            [renderForm]="renderForm"
            [typeInstance]="typeInstance"
            [sectionSlot]="portsSlot"
            [sectionSlotIndex]="portsSectionIndex"
        />

        <!-- In add mode there is no object yet, so the section lists nothing and offers no action. -->
        <ng-template #portsSlot>
            <cmdb-ports-overview *permissionLink="[portViewRight]" />
        </ng-template>

        <div id="object-form-action" class="shadow p-3 mb-5 bg-white rounded text-center">
            <div class="row d-flex justify-content-center align-items-center">
                <p class="pt-3 mx-4">
                    Do you want to save the new object of <strong>{{typeInstance?.label}}</strong> you made before quitting?
                </p>
                <div class="dg-button-row">
                    <app-button
                        label="Cancel"
                        variant="outline"
                        tone="neutral"
                        routerLink="/framework/object/type/{{typeInstance?.public_id}}"
                    ></app-button>

                    <app-button
                        label="Save"
                        variant="solid"
                        tone="brand"
                        type="submit"
                        [disabled]="!renderForm.valid"
                    ></app-button>
                </div>
            </div>
        </div>
    </form>

}



<app-loading-popup 
  [isVisible]="isLoading$ | async"
  message="We're Processing the Data..."
></app-loading-popup>
