<div class="container-fluid p-0 m-0">
    <div class="row">
        <div class="col-sm-10">
            <h1>Copy of {{typeInstance?.label}} #{{renderResult?.object_information.object_id}}</h1>
        </div>
        <div class="col-sm-2 text-end">
            <div class="dg-button-row dg-button-row--end p-1">
                <app-button
                    label="Cancel"
                    variant="outline"
                    tone="neutral"
                    routerLink="/framework/object/view/{{renderResult?.object_information.object_id}}"
                ></app-button>

                <app-button
                    label="Save"
                    variant="solid"
                    tone="brand"
                    type="submit"
                    [disabled]="!renderForm.valid"
                    (clicked)="copyObject()"
                ></app-button>
            </div>
        </div>
    </div>
</div>

<hr/>

<div id="object-edit" class="card">
    <div class="card-body">
        <form
            [formGroup]="renderForm"
            class="renderForm needs-validation"
            novalidate
            autocomplete="off"
            (ngSubmit)="copyObject()"
        >
            <cmdb-render
                [typeInstance]="typeInstance"
                [renderResult]="renderResult"
                [mode]="mode"
                [renderForm]="renderForm"
                [sectionSlot]="portsSlot"
                [sectionSlotIndex]="portsSectionIndex"
            />

            <ng-template #portsSlot>
                @if (portsCloneable$ | async) {
                    <fieldset *permissionLink="[portAddRight]">
                        <legend>Ports</legend>
                        <app-checkbox
                            [id]="'object-copy-clone-ports'"
                            label="Also copy the ports of this object"
                            [checked]="clonePorts"
                            (checkedChange)="clonePorts = $event"
                        />
                        <small class="form-text text-muted">Cables and interface links are not copied.</small>
                    </fieldset>
                }
            </ng-template>

            <div id="object-form-action" class="shadow p-3 mb-5 bg-white rounded text-center">
                <div class="row d-flex justify-content-center align-items-center">
                    <p class="pt-3 mx-4">Do you want to save the copy of
                        <strong>{{typeInstance?.label}} #{{renderResult?.object_information.object_id}}</strong>
                        you made before quitting?
                    </p>

                    <div class="dg-button-row">
                        <app-button
                            label="Cancel"
                            variant="outline"
                            tone="neutral"
                            routerLink="/framework/object/view/{{renderResult?.object_information.object_id}}"
                        ></app-button>

                        <app-button
                            label="Save"
                            variant="solid"
                            tone="brand"
                            type="submit"
                            [disabled]="!renderForm.valid"
                        ></app-button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>


<app-loading-popup 
  [isVisible]="isLoading$ | async"
  message="Saving the Object..."
></app-loading-popup>
