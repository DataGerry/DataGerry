<div id="object-view-render" class="card">
    <div class="card-body renderForm !important">
        <cmdb-render
            [mode]="mode"
            [renderForm]="renderForm"
            [renderResult]="renderResult"
            [sectionSlot]="portsSlot"
            [sectionSlotIndex]="portsSectionIndex"
        />

        <!-- Ports are no section of the type, so the type stores the slot they take among them. -->
        <ng-template #portsSlot>
            <cmdb-ports-overview
                *permissionLink="[portViewRight]"
                [objectId]="objectId"
                [objectLabel]="objectLabel"
                [manageable]="true"
            />
        </ng-template>
    </div>
</div>
