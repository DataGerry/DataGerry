<div class="d-flex justify-content-between align-items-center mb-2 w-100">
    <app-button label="Go Back" icon="fas fa-arrow-left" variant="solid" tone="brand" size="sm"
        (clicked)="goBack()"></app-button>
    <div class="dropdown">
        <button
          type="button"
          class="dg-button dg-button--outline dg-button--neutral dg-button--sm"
          data-bs-toggle="dropdown"
          aria-haspopup="menu"
          aria-expanded="false">
          <i class="fas fa-list" aria-hidden="true"></i>
          <span class="dg-button__label">Show Tabs</span>
        </button>
        <div class="dropdown-menu dropdown-menu-end">
            @for (item of referencedTypes; track item) {
            <button type="button" class="dropdown-item" (click)="onSelect(item)">
                <span class="form-check">
                    <input class="form-check-input" type="checkbox" [checked]="!item.hidden"
                        title="toggle-{{item?.typeName}}">
                    <label class="form-check-label">
                        {{item?.typeLabel}}
                    </label>
                </span>
            </button>
            }
            <div class="dropdown-divider"></div>
            <button type="button" class="dropdown-item text-center" (click)="onReset()">
                <i class="fas fa-redo"></i> Reset
            </button>
        </div>
    </div>
</div>


<div class="container limit-width">
    <nav class="scrollable">
        <div class="nav nav-tabs" id="nav-tab" role="tablist">
            <a class="nav-item nav-link active" data-bs-toggle="tab" href="#object-references" role="tab">
                All References
                <span class="badge rounded-pill bg-primary">{{totalReferences}}</span>
            </a>
            @for (item of referencedTypes; track item) {

            @if (!item.hidden) {
            <a class="nav-item nav-link" data-bs-toggle="tab" href="#{{item.typeName}}" role="tab"
                (click)="onClick(item.typeID)">
                {{item?.typeLabel}}
                <span class="badge rounded-pill bg-primary">{{item?.occurences}}</span>
            </a>
            }

            }
        </div>
    </nav>
</div>

<div class="tab-content">
    <div class="tab-pane fade show active" id="object-references">
        <cmdb-object-references-table [publicID]="publicID"></cmdb-object-references-table>
    </div>
    @for (item of referencedTypes; track item) {
    <div class="tab-pane fade" id="{{item.typeName}}">
        <cmdb-object-references-by-type [initSubject]="clickSubject" [publicID]="publicID" [typeID]="item.typeID"
            [id]="'object-referer-table-by-type-' + item.typeName" />
    </div>
    }
</div>
