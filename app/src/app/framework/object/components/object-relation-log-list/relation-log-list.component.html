<!-- CMDB Table with pagination, search, sorting -->
<cmdb-table
  [items]="logs"
  [columns]="columns"
  [totalItems]="totalLogs"
  [loading]="loading"
  [pageSize]="limit"
  [page]="page"
  [sort]="sort"
  [sortable]="true"
  [searchEnabled]="true"          
  
  (pageChange)="onPageChange($event)"
  (pageSizeChange)="onPageSizeChange($event)"
  (sortChange)="onSortChange($event)"
  (searchChange)="onSearchChange($event)" 
  
>
</cmdb-table>

<!-- Columns Templates -->
<ng-template #publicIdTemplate let-data="data">
  {{ data }}
</ng-template>

<ng-template #logTimeTemplate let-data="data">
  {{ data | dateFormatter }}
</ng-template>

<ng-template #actionTemplate let-data="data">
  {{ data }}
</ng-template>

<ng-template #authorTemplate let-data="data">
  {{ data }}
</ng-template>

<!-- The combined 'Actions' column template: view + delete -->
<ng-template #actionsTemplate let-item="item">
  <span>
    <app-button variant="link" tone="brand" size="xs" icon="far fa-eye icon-view" ariaLabel="View Relation Log"
      title="View Relation Log" (clicked)="onViewClick(item)"></app-button>
  </span>
  <span>
    <app-button variant="link" tone="danger" size="xs" icon="far fa-trash-alt icon-delete"
      ariaLabel="Delete Relation Log" title="Delete Relation Log" (clicked)="onDeleteLog(item)"></app-button>
  </span>
</ng-template>

<!-- Show the loading popup -->
<app-loading-popup 
  [isVisible]="isLoading$ | async"
  message="We're Processing the Data..."
></app-loading-popup>
