<div class="container-fluid">
  <div class="row">
    <div class="col-auto me-auto ps-0">
      @if (type?.active) {

        <div class="dg-button-row">
          <app-button
                  *permissionLink="['base.framework.object.add'];acl:type.acl;requirements:'CREATE'"
                  label="Add"
                  icon="fas fa-plus"
                  size="sm"
                  [variant]="isObjectLimitReached() ? 'outline' : 'solid'"
                  [tone]="isObjectLimitReached() ? 'neutral' : 'brand'"
                  [class.disabled-look]="isObjectLimitReached()"
                  [ngbTooltip]="getButtonTooltip()"
                  (clicked)="onAdd()"></app-button>
          <app-button
                  *permissionLink="['base.framework.object.edit'];acl:type.acl;requirements:'UPDATE'"
                  label="Bulk Change" [badge]="selectedObjects.length"
                  icon="fas fa-tasks"
                  size="sm"
                  [disabled]="selectedObjects.length<=0"
                  [ngbTooltip]="getBulkChangeTooltip()"
                  (clicked)="onBulkChange()"></app-button>
          <app-button
                  *permissionLink="['base.framework.object.delete'];acl:type.acl;requirements:'DELETE'"
                  label="Delete Selected" [badge]="selectedObjects.length"
                  icon="far fa-trash-alt"
                  variant="solid"
                  tone="danger"
                  size="sm"
                  [disabled]="selectedObjects.length<=0"
                  [ngbTooltip]="getDeleteSelectedTooltip()"
                  (clicked)="onDeleteSelected()"></app-button>
        </div>
      
}
    </div>
    <div class="col-auto pe-0">
      <div class="dropdown" *permissionLink="'base.export.object.*'">
        <button
          type="button"
          class="dg-button dg-button--outline dg-button--neutral dg-button--sm"
          id="exportButton"
          data-bs-toggle="dropdown"
          aria-haspopup="menu"
          aria-expanded="false">
          <i class="fas fa-file-export" aria-hidden="true"></i>
          <span class="dg-button__label">Export</span>
        </button>
        <ul class="dropdown-menu dropdown-menu-end dropdown-menu-lg-left">
          @for (item of formatList; track item) {
<li id="export-{{item.extension}}"
              [className]="item.active && totalResults > 0 ? 'dropdown-item' : 'dropdown-item disabled'">
            <div class="d-flex w-100 justify-content-between">
              <span><fa-icon icon="{{item.icon}}"></fa-icon> {{item.label}}</span>
              @if (selectedObjectsIDs.length == 0) {

                <small >Export (all)</small>
              
} @else {

                <small>Export ({{selectedObjectsIDs.length}})</small>
              
}
              
            </div>
            <small class="d-flex w-100 justify-content-between">
              <a class="me-2" href="javascript: void(0);" (click)="exporter(item);"
                 [ngbTooltip]="item.helperText + ' - Export objects for import'">(Raw Export)</a>
              <a href="javascript: void(0);" (click)="exporter(item, 'render')"
                 [ngbTooltip]="item.helperText + ' - Export customer lines'">(Customer Export)</a>
            </small>
          </li>
}
        </ul>
      </div>
    </div>
  </div>
</div>
