<table id="summaries-table" class="table table-sm table-hover">
    <tbody>
        @for (sum of summaries; track sum) {
        <tr>
            <th scope="row">{{ sum.label }}</th>
            <td>
                <cmdb-render-element [mode]="mode" [data]="sum"></cmdb-render-element>
            </td>
            <td class="clearfix">
                @if (sum.value) {
                <app-button icon="far fa-clipboard" size="sm" ariaLabel="Copy to clipboard" (clicked)="
                        sum.value.$date
                            ? clipBoardFormattedSummary(sum.value)
                            : clipBoardSummary( sum, sum.value)
                    "></app-button>
                }
            </td>
        </tr>
        }
    </tbody>
</table>
