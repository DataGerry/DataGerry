<div class="total-title d-flex justify-content-start">
  <div class="icon"><i class="fa fa-cogs"></i></div>
  <div class="name">
    <strong class="text-uppercase">{{renderResult?.type_information?.type_label}}</strong>
    <div class="dg-button-row align-items-start">
      <app-button
          icon="fas fa-list"
          variant="ghost"
          tone="neutral"
          size="sm"
          title="object list"
          ariaLabel="Open object list"
          routerLink="/framework/object/type/{{renderResult?.type_information?.type_id}}">
      </app-button>

      @if (renderResult?.type_information?.active) {
        <app-button *permissionLink="'base.framework.object.edit';requirements:'UPDATE';acl:acl"
            icon="fas fa-edit"
            variant="ghost"
            tone="neutral"
            size="sm"
            title="edit"
            ariaLabel="Edit object"
            routerLink="/framework/object/edit/{{renderResult?.object_information?.object_id}}">
        </app-button>

        <app-button *permissionLink="['base.framework.object.view', 'base.framework.object.add'];requirements:['CREATE', 'READ'];acl:acl"
            icon="fas fa-clone"
            variant="ghost"
            tone="neutral"
            size="sm"
            title="copy"
            ariaLabel="Copy object"
            routerLink="/framework/object/copy/{{renderResult?.object_information?.object_id}}">
        </app-button>

        <app-button *permissionLink="'base.framework.object.delete';requirements:'DELETE';acl:acl"
            icon="fas fa-trash-alt"
            variant="ghost"
            tone="danger"
            size="sm"
            title="delete"
            ariaLabel="Delete object"
            (clicked)="handleDelete(renderResult?.object_information?.object_id)">
        </app-button>

        <app-button *permissionLink="'base.framework.object.add';requirements:'CREATE';acl:acl"
            icon="fas fa-file"
            variant="ghost"
            tone="neutral"
            size="sm"
            title="add new object"
            ariaLabel="Add new object"
            routerLink="/framework/object/add/{{renderResult?.type_information?.type_id}}">
        </app-button>
      }
    </div>
  </div>
</div>

<app-loading-popup 
  [isVisible]="isLoading$ | async"
  message="Hang tight, we're getting things ready..."
></app-loading-popup>
