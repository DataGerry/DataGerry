<table class="table table-sm table-hover">
  <tbody>
    @for (metaData of meteObject?.headerLine; track metaData) {
    <tr>
      @for (meta of metaData | keyvalue; track meta) {
      <th scope="row">{{meta?.key}}</th>
      @if (!isObject(meta?.value)) {
      <td>{{meta?.value}}</td>
      } @else {
      <td>{{meta?.value | date:"dd/MM/yyyy - HH:mm:ss"}}</td>
      }
      }
    </tr>
    }
  </tbody>
</table>
