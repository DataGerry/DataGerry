<div class="dropdown">
  <button mat-icon-button [matMenuTriggerFor]="menu" class="custom-button">
    <div class="dropdown-toggle total-title d-flex justify-object-view-items" aria-haspopup="true"
      aria-expanded="false">
      <div class="icon"><i class="fa fa-file-pdf"></i></div>
      <div class="name"><strong class="text-uppercase">Documents</strong> <span>Total {{docs?.length}}</span></div>
    </div>
  </button>
</div>
<mat-menu #menu="matMenu">
  @if (docs?.length > 0) {
  @for (doc of docs; track doc) {
  <button mat-menu-item (click)="downloadDocument(doc.public_id, renderResult.object_information?.object_id, doc.name)">
    {{ doc.label }}
  </button>
  }
  } @else {
  <button mat-menu-item disabled>No documents available</button>
  }
</mat-menu>
