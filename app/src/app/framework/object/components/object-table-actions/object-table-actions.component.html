@if (publicID) {
<div class="object-actions">
    <a *permissionLink="'base.framework.object.view';requirements:'READ';acl:acl"
        [routerLink]="['/', 'framework', 'object', 'view', publicID]"
        title="View object"
        aria-label="View object">

        <i class="far fa-eye icon-view" aria-hidden="true"></i>

    </a>
    @if (result.type_information?.active) {

        <a *permissionLink="'base.framework.object.edit';requirements:'UPDATE';acl:acl"
            [routerLink]="['/', 'framework', 'object', 'edit', publicID]"
            title="Edit object"
            aria-label="Edit object">

            <i class="far fa-edit icon-edit" aria-hidden="true"></i>

        </a>

}
    <div ngbDropdown container="body" placement="bottom-end">
        <button
            type="button"
            class="dg-button dg-button--ghost dg-button--neutral dg-button--xs dg-button--icon-only object-actions__more"
            ngbDropdownToggle
            title="More actions"
            attr.aria-label="More actions for object {{ publicID }}">
            <i class="fas fa-ellipsis" aria-hidden="true"></i>
        </button>

        <div ngbDropdownMenu class="object-actions__menu" attr.aria-label="Actions for object {{ publicID }}">
            @if (result.type_information?.active) {
                <a *permissionLink="['base.framework.object.view', 'base.framework.object.add'];requirements:['CREATE', 'READ'];acl:acl"
                    ngbDropdownItem
                    class="object-actions__item"
                    [routerLink]="['/', 'framework', 'object', 'copy', publicID]">
                    <i class="far fa-clone object-actions__icon" aria-hidden="true"></i>
                    <span>Copy</span>
                </a>
            }
            @if (result.type_information?.active && deletable) {
                <button *permissionLink="'base.framework.object.delete';requirements:'DELETE';acl:acl"
                    type="button"
                    ngbDropdownItem
                    class="object-actions__item object-actions__item--danger"
                    (click)="handleDelete(publicID)">
                    <i class="far fa-trash-can object-actions__icon" aria-hidden="true"></i>
                    <span>Delete</span>
                </button>
            }
        </div>
    </div>
</div>
}
