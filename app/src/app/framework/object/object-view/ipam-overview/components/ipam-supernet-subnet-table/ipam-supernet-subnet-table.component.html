<cmdb-table
  class="ipam-supernet-subnet-table"
  [id]="'ipam-supernet-subnet-table'"
  [items]="displayRows"
  [columns]="columns"
  [initialVisibleColumns]="initialVisibleColumns"
  [totalItems]="totalItems"
  [page]="page"
  [pageSize]="pageSize"
  [sort]="sort"
  [loading]="loading"
  [selectEnabled]="true"
  [selectedItems]="selectedRows"
  [customButtons]="bulkButtonTemplates"
  [searchEnabled]="false"
  [paginationEnabled]="true"
  [pageSizeEnabled]="true"
  [toggleable]="false"
  [emptyMessage]="'No subnets to display.'"
  (pageChange)="onPageChange($event)"
  (pageSizeChange)="onPageSizeChange($event)"
  (sortChange)="onSortChange($event)"
  (selectedChange)="onSelectedChange($event)">
</cmdb-table>

<ng-template #bulkUnassignButton>
  @if (selectedCount > 0) {
    <button
      type="button"
      class="btn btn-danger btn-sm ipam-bulk-unassign"
      (click)="onUnassignSelected()">
      <i class="fa fa-unlink" aria-hidden="true"></i>
      Unassign Selected
      <span class="badge bg-secondary bg-pill">{{ selectedCount }}</span>
    </button>
  }
</ng-template>

<ng-template #cidrTemplate let-item="item">
  <div class="ipam-tree-cell">
    <i class="ipam-tree-cell__icon fa fa-file-text-o" aria-hidden="true"></i>
    <span class="ipam-tree-cell__cidr">{{ item.subnet?.cidr }}</span>
  </div>
</ng-template>

<ng-template #usedTemplate let-item="item">
  <span>{{ item.subnet?.used_ips | number }}</span>
</ng-template>

<ng-template #freeTemplate let-item="item">
  <span>{{ item.subnet?.free_ips | number }}</span>
</ng-template>

<ng-template #utilizationTemplate let-item="item">
  <div class="ipam-utilization-cell">
    <app-progress-bar
      class="ipam-utilization-cell__bar"
      [value]="item.subnet?.usage_percent ?? 0"
      [height]="8"
      ariaLabel="Subnet utilization">
    </app-progress-bar>
    <span class="ipam-utilization-cell__value">
      {{ (item.subnet?.usage_percent ?? 0) | number:'1.0-1' }}%
    </span>
  </div>
</ng-template>

<ng-template #vlansTemplate let-item="item">
  @if (item.subnet?.vlans?.length) {
    <span
      class="ipam-vlan-cell"
      [ngbTooltip]="vlanList(item.subnet.vlans, '\n')"
      tooltipClass="ipam-vlan-tooltip"
      [openDelay]="200"
      container="body"
      placement="top">
      {{ vlanList(item.subnet.vlans) }}
    </span>
  } @else {
    <span class="ipam-muted" aria-hidden="true">&ndash;</span>
  }
</ng-template>

<ng-template #actionsTemplate let-item="item">
  <div class="ipam-row-actions" ngbDropdown container="body" placement="bottom-end">
    <button
      type="button"
      class="ipam-row-actions__trigger"
      aria-label="Row actions"
      ngbDropdownToggle>
      <i class="fa fa-ellipsis-v" aria-hidden="true"></i>
    </button>
    <div ngbDropdownMenu class="ipam-row-actions__menu">
      <button
        type="button"
        ngbDropdownItem
        class="ipam-row-actions__item ipam-row-actions__item--danger"
        (click)="onUnassignRow(item)">
        <i class="fa fa-unlink ipam-row-actions__item-icon" aria-hidden="true"></i>
        <span>Unassign</span>
      </button>
    </div>
  </div>
</ng-template>
