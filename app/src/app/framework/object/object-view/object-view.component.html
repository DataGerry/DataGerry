<div class="container-fluid">
  <div class="row">
    <div class="col-md-12">
      <!-- Navbar -->
      <div class="object-view-navbar">
        <div class="row align-items-center">
          <div class="col-xl-3 col-md-5 col-6 pt-1">
            <cmdb-object-actions [acl]="renderResult.type_information.acl" [renderResult]="renderResult">
            </cmdb-object-actions>
          </div>
          <div class="col-xl-2 col-md-6 col-6 border-start pt-1">
            <cmdb-object-externals [renderResult]="renderResult"></cmdb-object-externals>
          </div>
          <div class="col-xl-2 col-md-6 col-6 border-start pt-1">
            <cmdb-object-attachments></cmdb-object-attachments>
          </div>
          <div class="docsWidget col-xl-2 col-md-6 col-6 border-start pt-1">
            <cmdb-object-docs *permissionLink="['base.docapi.template.view']" [renderResult]="renderResult">
            </cmdb-object-docs>
          </div>
          <div class="col-xl-2 col-md-6 col-6 border-start pt-1">
            <div class="d-flex justify-content-center">
              <cmdb-object-type-label [typeInformation]="renderResult?.type_information">
              </cmdb-object-type-label>
            </div>
          </div>
          <div class="col-xl-1 col-md-6 col-6 border-start pt-1 last-widget">
            <div class="d-flex justify-content-center" style="width: 87px !important;">
              <div class="btn-group" role="group">
                <button type="button" class="btn btn-sm" [class.btn-primary]="!isGraphView"
                  [class.btn-outline-primary]="isGraphView" (click)="toggleView(false)" title="Table View">
                  <i class="fas fa-table"></i>
                </button>
                <button *permissionLink="['base.framework.ciExplorer.view', 'base.framework.ciExplorer.edit']"
                  type="button" class="btn btn-sm" [class.btn-primary]="isGraphView"
                  [class.btn-outline-primary]="!isGraphView" (click)="toggleView(true)" title="Graph View">
                  <i class="fas fa-project-diagram"></i>
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Header -->
      <div class="mt-4">
        <cmdb-object-header [renderResult]="renderResult"></cmdb-object-header>
      </div>
      <hr>

      <!-- Graph View -->
      <div *ngIf="isGraphView" id="graph-view" class="col-md-12">
        <div class="card">
          <div class="card-body p-0">
            <!-- graph header selector -->
            <div class="premium-header-container d-flex align-items-center justify-content-between py-3 px-4">
              <div class="d-flex align-items-center gap-3 flex-grow-1">
                <span class="premium-label fw-semibold text-dark" *ngIf="!isHeaderSelectorLoading">Select Object: </span>
                <div class="flex-grow-1" style="min-width: 200px; margin-left: 5px;">
                  <app-object-selector
                    *ngIf="typesLoaded"
                    [typeIds]="allTypeIds"
                    [multiple]="false"
                    [useInlineLoader]="true"
                    [closeOnSelect]="true"
                    [selectedIds]="selectedObjectIdForSelector ? [selectedObjectIdForSelector] : []"
                    (selectionChange)="onGraphHeaderObjectChange($event)"
                    (loadingChange)="isHeaderSelectorLoading = $event">
                  </app-object-selector>
                </div>
              </div>

              <button
                class="btn btn-primary d-flex align-items-center gap-2"
                (click)="openSelectedObject()"
                [disabled]="!pendingSelectedId || isHeaderSelectorLoading"
                *ngIf="!isHeaderSelectorLoading">
                <i class="fas fa-external-link-alt"></i>
                Open
              </button>
            </div>
            <app-graph-editor [rootNodeId]="currentObjectID" (rootNodeSelected)="onRootNodeSelected($event)"></app-graph-editor>
          </div>
        </div>
      </div>

      <!-- Main Content: attributes + relation tabs -->
      <div *ngIf="!isGraphView" id="object-view" class="col-md-12">
        <cmdb-object-relations [objectId]="currentObjectID" [typeId]="renderResult?.type_information?.type_id">
          <!-- Projected into the "Attributes" tab -->
          <cmdb-object-view-render [mode]="mode" [renderResult]="renderResult"></cmdb-object-view-render>

          @if (isSupernet) {
            <hr class="ipam-section-divider" />
            <cmdb-ipam-supernet-overview [publicId]="currentObjectID"></cmdb-ipam-supernet-overview>
          } @else if (isSubnet) {
            <hr class="ipam-section-divider" />
            <cmdb-ipam-subnet-overview [publicId]="currentObjectID"></cmdb-ipam-subnet-overview>
          }
        </cmdb-object-relations>
      </div>

      <!-- Footer -->
      <div id="object-view-footer" class="col-12">
        <cmdb-object-footer [renderResult]="renderResult"></cmdb-object-footer>
      </div>
    </div>
  </div>
</div>
