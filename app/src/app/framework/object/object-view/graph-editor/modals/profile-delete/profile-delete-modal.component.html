<dg-modal
    icon="fas fa-trash-can"
    eyebrow="Filter profile"
    [title]="'Delete Profile: ' + (profile?.name ?? '')"
    (dismiss)="activeModal.close(0)">

    <p class="delete-lead">Are you sure you want to delete this profile?</p>

    <app-button
        dgModalFooter
        [bootstrapClass]="'btn-secondary'"
        label="Close"
        type="button"
        (clicked)="activeModal.close(0)">
    </app-button>

    <app-button
        dgModalFooter
        [bootstrapClass]="'btn-danger'"
        label="Delete"
        type="button"
        icon="fas fa-trash-can"
        (clicked)="activeModal.close(profile?.public_id)">
    </app-button>
</dg-modal>
