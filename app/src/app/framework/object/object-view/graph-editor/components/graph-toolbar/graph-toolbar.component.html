<div class="toolbar-left"></div>
<div class="toolbar-right">
  <div class="view-controls">
    <app-button class="graph-toolbar__tool" variant="ghost" icon="fas fa-magnifying-glass-minus"
      ariaLabel="Zoom out" title="Zoom Out (Ctrl+-)" (clicked)="zoomOut.emit()"></app-button>
    <span class="zoom-level">{{ (zoom() * 100).toFixed(0) }}%</span>
    <app-button class="graph-toolbar__tool" variant="ghost" icon="fas fa-magnifying-glass-plus"
      ariaLabel="Zoom in" title="Zoom In (Ctrl++)" (clicked)="zoomIn.emit()"></app-button>
    <app-button class="graph-toolbar__tool" variant="ghost" icon="fas fa-crosshairs"
      ariaLabel="Reset view" title="Reset View (Ctrl+0)" (clicked)="resetZoom.emit()"></app-button>
    <app-button class="graph-toolbar__tool" variant="ghost" icon="fas fa-bullseye"
      ariaLabel="Focus mode" title="Focus Mode" [ariaPressed]="focusMode()"
      (clicked)="toggleFocusMode.emit()"></app-button>
    <app-button class="graph-toolbar__tool" variant="ghost" icon="fas fa-download"
      ariaLabel="Export full graph as PNG" title="Export full graph as PNG"
      (clicked)="exportImage.emit()"></app-button>
  </div>

  <div class="toggle-controls">
    <app-button class="graph-toolbar__tool" variant="ghost" icon="fas fa-sliders"
      ariaLabel="Toggle filters" title="Toggle Filters" [ariaPressed]="filterBarOpen()"
      (clicked)="toggleFilterBar.emit()"></app-button>

    <app-button class="graph-toolbar__tool" variant="ghost" icon="fas fa-list-ul"
      ariaLabel="Toggle legend" title="Toggle Legend" [ariaPressed]="legendOpen()"
      (clicked)="toggleLegend.emit()"></app-button>

    <app-button class="graph-toolbar__tool" variant="ghost" icon="fas fa-map"
      ariaLabel="Toggle minimap" title="Toggle Minimap" [ariaPressed]="minimapOpen()"
      (clicked)="toggleMinimap.emit()"></app-button>

    <app-button class="graph-toolbar__tool" variant="ghost"
      [icon]="fullscreen() ? 'fas fa-compress' : 'fas fa-expand'"
      [ariaLabel]="fullscreen() ? 'Exit fullscreen' : 'Maximize to fullscreen'"
      [title]="fullscreen() ? 'Exit Fullscreen' : 'Maximize to Fullscreen'" [ariaPressed]="fullscreen()"
      (clicked)="toggleFullscreen.emit()"></app-button>
  </div>
</div>
