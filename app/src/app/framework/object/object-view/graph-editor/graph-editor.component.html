<div class="ci-explorer-container" #editorRoot [class.is-fullscreen]="isFullscreen">

  <cmdb-graph-toolbar
    [zoom]="zoom"
    [focusMode]="focusMode"
    [filterBarOpen]="showFilterBar"
    [legendOpen]="showLegend"
    [minimapOpen]="showMinimap"
    [fullscreen]="isFullscreen"
    (zoomIn)="zoomIn()"
    (zoomOut)="zoomOut()"
    (resetZoom)="resetZoom()"
    (toggleFocusMode)="toggleFocusMode()"
    (exportImage)="exportGraphAsImage()"
    (toggleFilterBar)="toggleFilterBar()"
    (toggleLegend)="toggleLegend()"
    (toggleMinimap)="toggleMinimap()"
    (toggleFullscreen)="toggleFullscreen()">
  </cmdb-graph-toolbar>

  <cmdb-graph-filter-panel
    [open]="showFilterBar"
    [mode]="filterMode"
    [form]="filterForm"
    [typeOptions]="typeOptionList"
    [relationOptions]="relationOptionList"
    [profiles]="profiles"
    [selectedProfileId]="selectedProfileId"
    [scope]="scope"
    (modeChange)="switchFilterMode($event)"
    (selectedProfileIdChange)="selectedProfileId = $event"
    (applyFilters)="applyFilters()"
    (clearFilters)="clearFilters()"
    (saveAsProfile)="saveCurrentFiltersAsProfile()"
    (applyProfile)="applyProfile()"
    (manageProfiles)="openProfileManager()"
    (scopeChange)="onScopeChange($event)">
  </cmdb-graph-filter-panel>

  <!-- Main Graph Area -->
  <div class="graph-viewport" #graphContainer [class.panning]="isPanning" [class.grid-hidden]="!nodes.length"
    (mousedown)="onCanvasMouseDown($event)" (contextmenu)="onGraphContextMenu($event)">

    <div class="focus-overlay" [class.active]="focusMode"
      [style.--focus-x]="focusedNodeId ? getNodeById(focusedNodeId).x + 'px' : '50%'"
      [style.--focus-y]="focusedNodeId ? getNodeById(focusedNodeId).y + 'px' : '50%'"></div>

    <cmdb-graph-canvas
      [viewportX]="viewportX"
      [viewportY]="viewportY"
      [zoom]="zoom"
      [smooth]="!isDragging && !isPanning"
      [container]="containerRef"
      [frame]="store.frame()"
      (nodePressed)="onNodeMouseDown($event.event, $event.node)"
      (nodeClicked)="selectNode($event.node, $event.event)"
      (nodeExpandRequested)="toggleExpand($event.node, $event.event)"
      (nodeMenuRequested)="onRightClick($event.event, $event.node)"
      (nodeFocusRequested)="centerOnNode($event)"
      (connectionClicked)="onConnectionClick($event.connection, $event.event)">
    </cmdb-graph-canvas>
  </div>

  @if (showLegend) {
    <cmdb-graph-legend [counts]="edgeKindCounts()"></cmdb-graph-legend>
  }

  @if (showMinimap) {
    <cmdb-graph-minimap
      [nodes]="nodes"
      [groups]="nodeGroups"
      [selectedNodes]="selectedNodes"
      [viewBox]="getMinimapViewBox()"
      [viewportRect]="getMinimapViewportRect()"
      (minimapClick)="onMinimapClick($event)">
    </cmdb-graph-minimap>
  }

  @if (contextMenuVisible && selectedNode) {
    <cmdb-graph-context-menu
      [node]="selectedNode"
      [x]="contextMenuX"
      [y]="contextMenuY"
      [expandIcon]="getContextExpandIcon(selectedNode)"
      [expandLabel]="getContextExpandLabel(selectedNode)"
      (setAsRoot)="selectAsRootNode()"
      (toggleExpand)="onContextToggleExpand($event)"
      (focusNode)="centerOnNode(selectedNode!)">

      @if (showPerformanceHints) {
        <div class="performance-hints" [class.hidden]="!getPerformanceHint()">
          <span class="material-icons" aria-hidden="true">speed</span>
          <span>{{ getPerformanceHint() }}</span>
        </div>
      }
    </cmdb-graph-context-menu>
  }

  <app-loading-popup [isVisible]="isLoading$ | async" message="Loading graph data...">
  </app-loading-popup>
</div>
