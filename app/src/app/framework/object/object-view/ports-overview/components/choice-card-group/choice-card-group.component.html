<div class="choice-cards" role="radiogroup" [attr.aria-label]="groupLabel() || null">
  @for (choice of choices(); track choice.value) {
    <label class="choice-card" [class.choice-card--selected]="choice.value === selected()">
      <input
        class="choice-card__input"
        type="radio"
        [name]="name()"
        [checked]="choice.value === selected()"
        (change)="choiceSelected.emit(choice.value)">
      <span class="choice-card__icon" aria-hidden="true"><i [class]="choice.icon"></i></span>
      <span class="choice-card__label">{{ choice.label }}</span>
      <span class="choice-card__text">{{ choice.text }}</span>
    </label>
  }
</div>
