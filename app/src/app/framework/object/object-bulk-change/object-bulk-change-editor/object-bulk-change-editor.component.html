<div id="object-header" class="card">
  <div class="card-header d-flex justify-content-between">
    <div>
      <div id="object-view-active" *permissionLink="'base.framework.object.edit'" class="btn-group">
        <label class="btn btn-outline-cmdb-primary btn-sm" [class.active]="activeState === true"
          (click)="onActiveChange(true)">
          <input type="radio" name="on" class="btn-check" id="activeState" autocomplete="off"> Active
        </label>
        <label class="btn btn-outline-cmdb-primary btn-sm active" [class.active]="activeState === undefined"
          (click)="onActiveChange(undefined)">
          <input type="radio" name="n/a" class="btn-check" id="undefinedState" autocomplete="off" checked> N/A
        </label>
        <label class="btn btn-outline-cmdb-primary btn-sm" [class.active]="activeState === false"
          (click)="onActiveChange(false)">
          <input type="radio" name="off" class="btn-check" id="inactiveState" autocomplete="off"> Inactive
        </label>
      </div>
    </div>
    <div id="object-view-title">
      <cmdb-active-badge [activeStatus]="activeState"></cmdb-active-badge>
      {{type.label}}
    </div>
    <div id="object-view-version"></div>
  </div>
  <div class="card-body">
    <form [formGroup]="renderForm" class="renderForm needs-validation" novalidate autocomplete="off">
      <cmdb-render [mode]="mode" [renderForm]="renderForm" [changeForm]="changeForm"
        [typeInstance]="filteredData"></cmdb-render>
    </form>
  </div>
</div>
<br>
