<div id="object-header" class="card">
  <div class="card-header d-flex justify-content-between">
    <div>
      <div id="object-view-active" *permissionLink="'base.framework.object.edit'" class="dg-button-group" role="group"
        aria-label="Active state">
        <app-button label="Active" variant="outline" tone="neutral" size="sm" [ariaPressed]="activeState === true"
          (clicked)="onActiveChange(true)">
        </app-button>
        <app-button label="N/A" variant="outline" tone="neutral" size="sm" [ariaPressed]="activeState === undefined"
          (clicked)="onActiveChange(undefined)">
        </app-button>
        <app-button label="Inactive" variant="outline" tone="neutral" size="sm" [ariaPressed]="activeState === false"
          (clicked)="onActiveChange(false)">
        </app-button>
      </div>
    </div>
    <div id="object-view-title">
      <cmdb-active-badge [activeStatus]="activeState"></cmdb-active-badge>
      {{type.label}}
    </div>
    <div id="object-view-version"></div>
  </div>
  <div class="card-body">
    <form [formGroup]="renderForm" class="renderForm needs-validation" novalidate autocomplete="off">
      <cmdb-render [mode]="mode" [renderForm]="renderForm" [changeForm]="changeForm"
        [typeInstance]="filteredData"></cmdb-render>
    </form>
  </div>
</div>
<br>
