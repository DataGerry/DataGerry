<dg-modal
    icon="fas fa-stethoscope"
    title="Diagnostic Information"
    [scrollBody]="false"
    (dismiss)="activeModal.dismiss('Cross click')">

    <div class="diagnostic-content">
        <pre class="diagnostic-json">{{data | json}}</pre>
    </div>

    <app-button
        dgModalFooter
        variant="outline" tone="neutral"
        label="Close"
        type="button"
        icon="fas fa-times"
        (clicked)="activeModal.close('Close click')">
    </app-button>
</dg-modal>
