@if (relationInstance.sections.length > 0) {
<div class="card">
  <div class="card-header">
    Preview
  </div>
  <div class="card-body renderForm">
    <cmdb-render [mode]="mode" [relationInstance]="relationInstance" [renderForm]="previewForm"></cmdb-render>
  </div>
</div>
} @else {

  <div class="alert alert-warning" role="alert">
    It was not possible to create a preview.
  </div>

}
