<div class="cat-node" [class.cat-node--organizing]="isOrganizing">
  @if (isOrganizing) {
    <span class="cat-node__grip" dndHandle title="Drag to move">
      <i class="fas fa-grip-vertical" aria-hidden="true"></i>
    </span>
  } @else if (hasChildren) {
    <app-button
      class="cat-node__toggle"
      label=""
      variant="outline" tone="neutral"
      [icon]="collapsed ? 'fas fa-chevron-right' : 'fas fa-chevron-down'"
      [ariaExpanded]="!collapsed"
      [ariaLabel]="toggleLabel"
      (clicked)="onToggle()"
    ></app-button>
  } @else {
    <span class="cat-node__toggle-spacer" aria-hidden="true"></span>
  }

  <span class="cat-node__chip" aria-hidden="true">
    <i [class]="iconClass"></i>
  </span>

  <span class="cat-node__label" [title]="node.category.label">{{ node.category.label }}</span>

  @if (isOrganizing) {
    <span class="cat-node__moves">
      <app-button
        label=""
        icon="fas fa-outdent"
        variant="outline" tone="neutral"
        [disabled]="!canOutdent"
        [title]="outdentHint"
        [ariaLabel]="outdentHint"
        (clicked)="outdent.emit()"
      ></app-button>
      <app-button
        label=""
        icon="fas fa-indent"
        variant="outline" tone="neutral"
        [disabled]="!canIndent"
        [title]="indentHint"
        [ariaLabel]="indentHint"
        (clicked)="indent.emit()"
      ></app-button>
    </span>
  } @else {
    <span class="cat-node__actions">
      <ng-container *permissionLink="'base.framework.category.edit'">
        <app-button
          label=""
          icon="fas fa-pen"
          variant="outline" tone="brand" size="sm"
          [ariaLabel]="'Edit ' + node.category.label"
          title="Edit category"
          (clicked)="onEdit()"
        ></app-button>
      </ng-container>
      <ng-container *permissionLink="'base.framework.category.delete'">
        <app-button
          label=""
          icon="fas fa-trash"
          variant="outline" tone="danger" size="sm"
          [ariaLabel]="'Delete ' + node.category.label"
          title="Delete category"
          (clicked)="onDelete(node.category)"
        ></app-button>
      </ng-container>
    </span>
  }
</div>
