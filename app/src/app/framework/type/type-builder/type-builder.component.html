<div id="type-builder" class="row">
    <div class="col-md-9">
        <aw-wizard
            dgStepper
            tone="validity"
            [invalidSteps]="invalidSteps"
            [defaultStepIndex]="stepIndex"
            [navBarLayout]="'large-empty-symbols'"
            [awNavigationMode]
            navigateBackward="allow"
            navigateForward="allow"
        >
            <aw-wizard-step [stepId]="'1'" stepTitle="Basic information">
                <ng-template awWizardStepSymbol><i class="fas fa-info"></i></ng-template>
                <hr/>
                <cmdb-type-basic-step
                    [mode]="mode"
                    [typeInstance]="typeInstance"
                    (validateChange)="onBasicValidityChange($event)"
                ></cmdb-type-basic-step>
                <hr/>
                <div class="dg-button-row dg-button-row--end">
                    <app-button awNextStep variant="outline" tone="brand" label="Next Step"
                        icon="fas fa-angle-double-right" iconPosition="end" [disabled]="!basicValid"></app-button>
                </div>
            </aw-wizard-step>
            <aw-wizard-step [stepId]="'2'" stepTitle="Content">
                <ng-template awWizardStepSymbol><i class="fas fa-clipboard-check"></i></ng-template>
                <hr/>
                <cmdb-type-fields-step
                    [mode]="mode"
                    [typeInstance]="typeInstance"
                    [types]="types"
                    (validateChange)="onContentValidityChange($event)"
                ></cmdb-type-fields-step>
                <hr/>
                <div class="dg-button-row dg-button-row--between">
                    <app-button awPreviousStep variant="outline" tone="neutral" label="Previous Step"
                        icon="fas fa-angle-double-left"></app-button>
                    <app-button awNextStep variant="outline" tone="brand" label="Next Step"
                        icon="fas fa-angle-double-right" iconPosition="end"
                        [disabled]="!contentValid || blocking.blocked"></app-button>
                </div>
            </aw-wizard-step>
            <aw-wizard-step [stepId]="'3'" stepTitle="Meta">
                <ng-template awWizardStepSymbol><i class="fas fa-hashtag"></i></ng-template>
                <hr/>
                <cmdb-type-meta-step [mode]="mode" [typeInstance]="typeInstance"></cmdb-type-meta-step>
                <hr/>
                <div class="dg-button-row dg-button-row--between">
                    <app-button awPreviousStep variant="outline" tone="neutral" label="Previous Step"
                        icon="fas fa-angle-double-left"></app-button>
                    <app-button awNextStep variant="outline" tone="brand" label="Next Step"
                        icon="fas fa-angle-double-right" iconPosition="end"></app-button>
                </div>
            </aw-wizard-step>
            <aw-wizard-step [stepId]="'4'" stepTitle="ACL">
                <ng-template awWizardStepSymbol><i class="fas fa-users"></i></ng-template>
                <hr/>
                <cmdb-type-acl-step
                    [typeInstance]="typeInstance"
                    [groups]="groups"
                    (validateChange)="onAccessValidityChange($event)"
                ></cmdb-type-acl-step>
                <hr/>
                <div class="dg-button-row">
                    <app-button awPreviousStep variant="outline" tone="neutral" label="Previous Step"
                        icon="fas fa-angle-double-left"></app-button>
                </div>
            </aw-wizard-step>
        </aw-wizard>
    </div>
    <div class="col-md-3">
        <div class="card">
            <div class="card-header">
                Validation
            </div>
            <ul class="list-group list-group-flush">
                <li class="list-group-item">
                    <dg-builder-step-status
                        [step]="'Basic information'"
                        [status]="basicValid"
                    ></dg-builder-step-status>
                </li>
                <li class="list-group-item">
                    <dg-builder-step-status
                        [step]="'Type content'"
                        [status]="contentValid"
                    ></dg-builder-step-status>
                </li>
                <li class="list-group-item">
                    <dg-builder-step-status
                        [step]="'Meta data'"
                        [status]="metaValid"
                    ></dg-builder-step-status>
                </li>
                <li class="list-group-item">
                    <dg-builder-step-status
                        [step]="'Access'"
                        [status]="accessValid"
                    ></dg-builder-step-status>
                </li>
            </ul>
        </div>
        <div class="mt-2">
            <app-button
                variant="solid"
                tone="brand"
                label="Save"
                [block]="true"
                [disabled]="isSaveButtonDisabled"
                (clicked)="saveType()"
            ></app-button>
        </div>
    </div>
</div>

<app-loading-popup [isVisible]="isLoading$ | async" message="We're Processing the Data..."></app-loading-popup>
