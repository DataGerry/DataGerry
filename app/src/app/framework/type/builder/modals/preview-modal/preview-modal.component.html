<div class="modal-content">
    <div class="modal-header" style="background-color: #e94d18; color: white;">

        @if(saveValues) {
        <h4 class="modal-title">Add new entry</h4>
        }
        @else if(editValues) {
        <h4 class="modal-title">Edit entry</h4>
        }
        @else {
        <h4 class="modal-title">Preview</h4>
        }
        <button type="button" class="btn-close btn-close-white" aria-label="Close" (click)="activeModal.close(false)"></button>
    </div>
    <div class="modal-body">
        <form class="renderForm">
            <fieldset *ngFor="let section of sections">
                <legend>{{section?.label}}</legend>
                <div *ngFor="let field of section?.fields">
                    <cmdb-render-element [mode]="getViewMode()" [parentFormGroup]="renderForm" [data]="field">
                    </cmdb-render-element>
                    <ng-container *ngIf="errorAnchorField && field?.name === errorAnchorField && externalErrors?.length">
                        <div class="row mb-2">
                            <div class="col-sm-9 offset-sm-3">
                                <div class="invalid-feedback d-block" role="alert" aria-live="polite">
                                    <div *ngFor="let err of externalErrors">{{ err }}</div>
                                </div>
                            </div>
                        </div>
                    </ng-container>
                </div>
            </fieldset>
        </form>
    </div>
    <div class="modal-footer">
        <button type="button" class="btn btn-outline-danger" (click)="activeModal.close(false)">Close</button>
        <div *ngIf="saveValues">
            <button type="button" class="btn btn-success" (click)="activeModal.close(renderForm.value)"
                [disabled]="!renderForm.valid || !externalValid || externalPending">Add</button>
        </div>
        <div *ngIf="editValues">
            <button type="button" class="btn btn-success" (click)="activeModal.close(renderForm.value)"
                [disabled]="!renderForm.valid || !externalValid || externalPending">OK</button>
        </div>

    </div>
</div>
