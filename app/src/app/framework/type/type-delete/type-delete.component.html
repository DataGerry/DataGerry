<h1>Delete type: {{typeInstance?.label}}</h1>
<hr />
<dl class="row">
  <dt class="col-sm-2">Name</dt>
  <dd class="col-sm-10">{{typeInstance?.name}}</dd>

  <dt class="col-sm-2">Label</dt>
  <dd class="col-sm-10">{{typeInstance?.label}}</dd>

  <dt class="col-sm-2">Description</dt>
  <dd class="col-sm-10 text-truncate">{{typeInstance?.description}}</dd>

  <dt class="col-sm-2">Number of objects</dt>
  <dd class="col-sm-10">{{numberOfObjects}}</dd>
</dl>

<hr />

<app-button class="back-button ms-3" label="Back to Type List" (clicked)="goBack()"></app-button>
<app-button
  variant="solid"
  tone="danger"
  label="Delete"
  [disabled]="!canDeleteType()"
  (clicked)="open()"
></app-button>

<div>
  @if (numberOfObjects > 0) {
  <label id="error_message">Deletion is only possible if there are no objects of this type!</label>
  }
  <br>
  @if (!canDeleteType()) {
  <label id="error_message">
    Deletion is only possible if this type is not used in reports!
  </label>
  }
</div>
