@if (loading) {
    <button class="status-chip status-chip--loading" type="button" aria-busy="true">
        <span class="spinner-border spinner-border-sm" aria-hidden="true"></span> Checking...
    </button>
} @else if (clean) {
    <button class="status-chip status-chip--clean" type="button" disabled>
        <i class="fas fa-check-circle status-chip__icon" aria-hidden="true"></i> Clean
    </button>
} @else {
    <button class="status-chip status-chip--unclean" type="button" (click)="openModal()">
        <i class="fas fa-exclamation-circle status-chip__icon" aria-hidden="true"></i> Unclean
    </button>
}
