<dg-modal
  icon="fas fa-clone"
  eyebrow="Section template"
  title="Clone Template"
  subtitle="Enter the name for the copy and decide if it should be a global template!"
  (dismiss)="activeModal.close(false)">

  <p class="clone-source">
    Cloning of <b>{{ sectionTemplate.label }}</b> [ID: {{ sectionTemplate.public_id }}]
  </p>

  <form [formGroup]="cloneForm" novalidate>
    <!-- Template name -->
    <div class="mb-3">
      <label for="templateLabel" class="form-label fw-semibold">Template name</label>
      <input
        id="templateLabel"
        type="text"
        formControlName="templateLabel"
        class="form-control"
        placeholder="Template name"
        required
        ngbAutofocus />
    </div>

    <!-- Global Template checkbox -->
    <div class="form-check">
      <input
        id="isGlobal"
        class="form-check-input"
        type="checkbox"
        formControlName="isGlobal" />
      <label class="form-check-label" for="isGlobal">Global Template</label>
    </div>
  </form>

  <app-button
    dgModalFooter
    [bootstrapClass]="'btn-secondary'"
    label="Cancel"
    type="button"
    (clicked)="activeModal.close(false)">
  </app-button>

  <app-button
    dgModalFooter
    [bootstrapClass]="'btn-success'"
    label="Clone Template"
    type="button"
    icon="fas fa-clone"
    [disabled]="!cloneForm.valid"
    (clicked)="activeModal.close(cloneForm.value)">
  </app-button>
</dg-modal>
