<div class="actions-div">
    <a
        id="add-section-template-button"
        class="dg-button dg-button--outline dg-button--neutral dg-button--sm me-1"
        [routerLink]="['/framework/section_templates']"
    >
        <span class="dg-button__label">Cancel</span>
    </a>

    <app-button
        id="add-section-template-button"
        class="me-1"
        variant="solid"
        tone="brand"
        size="sm"
        label="Save"
        [disabled]="initialSection.fields.length == 0 || !(isValid$ | async)"
        (clicked)="handleSectionTemplate()"
    ></app-button>
</div>

@if (sectionTemplateID > 0 && initialSection.is_global) {
<div>
    <p id="global-edit-message">
        <i class="fas fa-lightbulb"></i>
        Saving changes to a global template will affect all corresponding types and objects. This action can not be
        undone!
    </p>
</div>
}

<div class="row">
    <div class="col-3">
        <dg-builder-palette [groups]="paletteGroups" />
    </div>

    <div id="form-container" class="col-9">
        <section>
            <dg-builder-section [section]="initialSection" [host]="sectionHost">
                @if (sectionTemplateID <= 0) {
                <form [formGroup]="formGroup" class="section-template-options">
                    <div class="section-template-option">
                        <app-toggle class="section-template-option-control" [id]="'is-multi-data-section-label'"
                            [controlName]="'isMultiDataSection'" [ariaLabel]="'Multi Data Section'" />
                        <span class="section-template-option-label">
                            Multi Data Section
                        </span>
                    </div>
                    <div class="section-template-option is-global">
                        <app-toggle class="section-template-option-control" [id]="'is-global-label'"
                            [controlName]="'isGlobal'" [ariaLabel]="'Global Template'" />
                        <span class="section-template-option-label">
                            Global Template
                        </span>
                    </div>
                </form>
                }
                <hr>
            </dg-builder-section>
        </section>
    </div>
</div>

<div class="actions-div">
    <a
        id="add-section-template-button"
        class="dg-button dg-button--outline dg-button--neutral dg-button--sm me-1"
        [routerLink]="['/framework/section_templates']"
    >
        <span class="dg-button__label">Cancel</span>
    </a>

    <app-button
        id="add-section-template-button"
        class="me-1"
        variant="solid"
        tone="brand"
        size="sm"
        label="Save"
        [disabled]="initialSection.fields.length == 0 || !(isValid$ | async)"
        (clicked)="handleSectionTemplate()"
    ></app-button>
</div>
