<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Object Groups</h2>
  <app-button
    *permissionLink="'base.framework.objectGroup.add'"
    variant="solid"
    tone="brand"
    size="sm"
    label="Add"
    icon="fas fa-plus"
    (clicked)="onAddNew()"
  ></app-button>
</div>
<hr />
<div *permissionLink="'base.framework.objectGroup.view'">
<cmdb-table [items]="objectGroups" [columns]="columns" [page]="page" [sort]="sort" [id]="'object-groups-table'"
  [stateEnabled]="false" [emptyMessage]="'No object groups found.'" [totalItems]="totalObjectGroups"
  [selectEnabled]="false" [loading]="loading" [pageSize]="limit" [toggleable]="true"
  [initialVisibleColumns]="initialVisibleColumns" (pageChange)="onPageChange($event)"
  (pageSizeChange)="onPageSizeChange($event)" (sortChange)="onSortChange($event)"
  (searchChange)="onSearchChange($event)"></cmdb-table>
</div>

<!-- Action Template for the table -->
<ng-template #actionTemplate let-data="data" let-item="item">
  <app-button *permissionLink="'base.framework.objectGroup.view'" variant="link" tone="brand" size="xs"
    icon="far fa-eye icon-view" ariaLabel="View Object Group" title="View Object Group" (clicked)="onView(item)"></app-button>
  <app-button *permissionLink="'base.framework.objectGroup.edit'" variant="link" tone="brand" size="xs"
    icon="far fa-edit icon-edit" ariaLabel="Edit Object Group" title="Edit Object Group" (clicked)="onEdit(item)"></app-button>

  <app-button *permissionLink="'base.framework.objectGroup.delete'" variant="link" tone="danger" size="xs"
    icon="far fa-trash-alt icon-delete" ariaLabel="Delete Object Group" title="Delete Object Group"
    (clicked)="onDelete(item)"></app-button>
</ng-template>

<ng-template #categoriesTemplate let-data="data" let-item="item">
  <span style="font-weight: 600;">{{ getCategoryNames(data) }}</span>
</ng-template>

<app-loading-popup [isVisible]="isLoading$ | async" message="We're Processing the Data..."></app-loading-popup>
