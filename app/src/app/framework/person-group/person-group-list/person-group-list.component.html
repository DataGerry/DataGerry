<div class="d-flex justify-content-between align-items-center mb-3">
  <h2>Person Groups</h2>
  <app-button
    *permissionLink="'base.framework.object.add'"
    variant="solid"
    tone="brand"
    size="sm"
    label="Add"
    icon="fas fa-plus"
    (clicked)="onAddNew()"
  ></app-button>
</div>
<hr />

<cmdb-table *permissionLink="'base.framework.object.view'" [items]="personGroups" [columns]="columns" [page]="page" [sort]="sort" [id]="'person-groups-table'"
  [emptyMessage]="'No Person Groups found.'" [totalItems]="totalPersonGroups" [selectEnabled]="false"
  [loading]="loading" [pageSize]="limit" [toggleable]="true" [initialVisibleColumns]="initialVisibleColumns"
  (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)" (sortChange)="onSortChange($event)"
  (searchChange)="onSearchChange($event)">
</cmdb-table>

<!-- Action buttons template -->
<ng-template #actionTemplate let-item="item">

  <!-- View button -->
  <a (click)="onView(item)" title="View Person Group" *permissionLink="'base.framework.object.view'">
    <i class="far fa-eye icon-margin icon-view spacing-right"></i>
  </a>

  <!-- Edit button -->
  <a (click)="onEdit(item)" title="Edit Person Group" *permissionLink="'base.framework.object.edit'">
    <i class="far fa-edit icon-margin icon-edit spacing-right"></i>
  </a>

  <!-- Delete button -->
  <a (click)="onDelete(item)" title="Delete Person Group" *permissionLink="'base.framework.object.delete'">
    <i class="far fa-trash-alt icon-delete"></i>
  </a>

</ng-template>
