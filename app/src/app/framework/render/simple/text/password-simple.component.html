@if (!showData) {
<app-button variant="link" tone="neutral" size="xs" icon="far fa-eye" ariaLabel="Show password"
    title="Show password" (click)="toggle($event)"></app-button>
}

@if (showData) {
<span>{{data.value}}</span>
<app-button variant="link" tone="neutral" size="xs" icon="far fa-eye-slash" ariaLabel="Hide password"
    title="Hide password" (click)="toggle($event)"></app-button>
}
