<div class="input-group input-group-sm">
  <ng-content></ng-content>
  @if (data != undefined) {
  <app-button variant="outline" tone="neutral" size="sm" icon="fas fa-pencil-alt" ariaLabel="Reset to the default value"
    placement="left" [ngbTooltip]="tipContent" (clicked)="changeValueToDefault()"></app-button>
  <ng-template #tipContent><b>Default:</b> {{data.default ? (data.default | dateFormatter) : 'None'}}</ng-template>
  }
  @if (data?.helperText) {
  <span class="input-group-text">
    <fa-icon icon="info" placement="left" [ngbTooltip]="data?.helperText"></fa-icon>
  </span>
  }
</div>
