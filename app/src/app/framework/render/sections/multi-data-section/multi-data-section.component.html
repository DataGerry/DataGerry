<fieldset>
    <legend>{{section?.label}}</legend>

    @if(showAddButton()) {
        <button type="button" class="btn btn-success btn-sm me-1 add-row-button" (click)="onAddRowClicked()">
            <i class="fas fa-plus"></i> Add
        </button>
    }

    <cmdb-table
        *ngIf="!updateRequired"
        [columns]="multiDataColumns"
        [items]="currentMultiDataValues"
        [page]="currentPage"
        [pageSizeEnabled]="false"
        [totalItems]="tableMultiDataValues.length"
        [searchEnabled]="false"
        [pageSize]="pageSizeLimit"
        [paginationEnabled]="showPagination()"
        (pageChange)="onPageChange($event)"
    />
</fieldset>

<ng-template #actionsTemplate let-item="item">
    <cmdb-multi-data-actions
        [data]="item"
        (previewRowEmitter)="onRowPreview($event)"
        (editRowEmitter)="onRowEdit($event)"
        (deleteRowEmitter)="onRowDelete($event)"
    />
</ng-template>

<ng-template #passwordTemplate let-item="item" let-column="column">
    <div class="d-flex justify-content-between align-items-center">
        <span class="mr-2 ml-2">
            {{ getPasswordDisplayValue(item, column.name) }}
        </span>
        <button type="button" class="btn btn-sm" (click)="togglePasswordVisibility(item, column.name)">
            <i class="far fa-eye"></i>
        </button>
    </div>
    
</ng-template>

<hr/>
