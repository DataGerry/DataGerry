<fieldset>
    <legend>{{section?.label}}</legend>

    @if(showAddButton()) {
    <app-button
        class="me-1 add-row-button"
        variant="solid"
        tone="brand"
        size="sm"
        label="Add"
        icon="fas fa-plus"
        (clicked)="onAddRowClicked()"
    ></app-button>
    }

    @if (!updateRequired) {
    <cmdb-table [columns]="multiDataColumns" [items]="currentMultiDataValues" [page]="currentPage"
        [pageSizeEnabled]="false" [totalItems]="tableMultiDataValues.length" [searchEnabled]="false"
        [pageSize]="pageSizeLimit" [paginationEnabled]="showPagination()" (pageChange)="onPageChange($event)" />
    }
</fieldset>

<ng-template #actionsTemplate let-item="item">
    <cmdb-multi-data-actions [data]="item" (previewRowEmitter)="onRowPreview($event)"
        (editRowEmitter)="onRowEdit($event)" (deleteRowEmitter)="onRowDelete($event)" />
</ng-template>

<ng-template #passwordTemplate let-item="item" let-column="column">
    <div class="d-flex justify-content-between align-items-center">
        <span class="mr-2 ml-2">
            {{ getPasswordDisplayValue(item, column.name) }}
        </span>
        <app-button
            variant="ghost"
            size="sm"
            icon="far fa-eye"
            ariaLabel="Toggle password visibility"
            (clicked)="togglePasswordVisibility(item, column.name)"
        ></app-button>
    </div>

</ng-template>

<ng-template #refTemplate let-item="item" let-column="column">
    @if (getRefObjectId(item, column.name); as refObjectId) {
        <a class="mds-ref-link"
           [routerLink]="'/framework/object/view/' + refObjectId">
            {{ item[column.name] || refObjectId }}
        </a>
    } @else {
        <span>{{ item[column.name] }}</span>
    }
</ng-template>

<hr />
