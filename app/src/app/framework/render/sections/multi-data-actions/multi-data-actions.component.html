<div class="actions-div">
    <span>
        <app-button
            variant="link"
            tone="brand"
            size="xs"
            icon="far fa-eye icon-view"
            title="Preview Row"
            ariaLabel="Preview Row"
            (clicked)="onPreviewRowClicked()"
        ></app-button>
    </span>

    <span>
        <app-button
            variant="link"
            tone="brand"
            size="xs"
            icon="fas fa-edit icon-edit"
            title="Edit Row"
            ariaLabel="Edit Row"
            (clicked)="onEditRowClicked()"
        ></app-button>
    </span>

    <span>
        <app-button
            variant="link"
            tone="danger"
            size="xs"
            icon="fas fa-trash-alt icon-delete"
            title="Delete Row"
            ariaLabel="Delete Row"
            (clicked)="onDeleteRowClicked()"
        ></app-button>
    </span>
</div>
