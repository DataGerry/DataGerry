<fieldset>
    <legend>{{section?.label}}</legend>
    @for (field of section?.fields; track field) {
    <div class="object-renderInstance">
        <cmdb-render-element [mode]="mode" [parentFormGroup]="form" [data]="getFieldByName(field)"
            [changeForm]="changeForm" [section]="section" [objectID]=objectID [value]="getValueByName(field)" />
    </div>
    }
</fieldset>
