<div class="container mt-4">

  <!-- Prompt -->
  <form [formGroup]="promptForm" class="mb-4" *ngIf="!hasSchema">
    <app-form-input
      formControlName="prompt"
      label="Prompt"
      [required]="true"
      errorMessage="Prompt is required">
    </app-form-input>

    <button
      type="button"
      class="btn btn-success"
      [disabled]="promptForm.invalid || loading"
      (click)="requestSchema()">
      <fa-icon *ngIf="loading" icon="spinner" [spin]="true" class="me-2"></fa-icon>
      Continue
    </button>
  </form>

  <!-- Invalid banner -->
  <div *ngIf="validationMessage && !hasSchema" class="alert alert-warning">
    {{ validationMessage }}
  </div>

  <!-- Selection -->
  <ng-container *ngIf="hasSchema; else aiTypeEmptyState">
    <label for="typeNameInput">Name: <span class="required">*</span></label>
    <form [formGroup]="form">
      <input type="text" formControlName="name" class="form-control" [ngClass]="{ 'is-valid': name.valid && (name.dirty || name.touched),
          'is-invalid': name.invalid && (name.dirty || name.touched) }" id="typeNameInput" name-guideline required>
      <div *ngIf="name.invalid && (name.dirty || name.touched)" class="invalid-feedback">
        <div *ngIf="name.errors.required">
          Name is required
        </div>
        <div *ngIf="name.errors.typeExists">
          A type with this name already exists
        </div>
        <div *ngIf="name.errors.invalidCharacters">
          Name can only contain letters, numbers, hyphens (-), and underscores (_)
        </div>
      </div>
    </form>
    <form [formGroup]="selectionForm" class="mt-3">
      <table class="table table-bordered align-middle ai-type-table">
        <thead>
          <tr>
            <th style="width:280px">Section</th>
            <th>Fields</th>
          </tr>
        </thead>

        <tbody>
          <tr cmdb-ai-section-selector
              *ngFor="let row of sectionRows; let ri = index; trackBy: trackByIndex"
              [row]="row"
              [rowIndex]="ri"
              [sectionUncheckDisabled]="isSectionDisabled(ri)"
              [totalSelectedFields]="totalSelectedFields()"
              [fieldLabel]="fieldLabel"
              [fieldKind]="fieldKind">
          </tr>
        </tbody>
      </table>

      <div class="d-flex justify-content-between gap-2 mt-3">
        <button type="button" class="btn btn-secondary" (click)="goBack()">
          Go Back
        </button>
        <button type="button" class="btn btn-success" (click)="submitSelection()">
          Create Type
        </button>
      </div>
    </form>

    <hr>

    <pre style="margin-top: 50px;">Backend response: {{schema | json}}</pre>
  </ng-container>

  <!-- Empty state when schema hasn't been generated yet -->
  <ng-template #aiTypeEmptyState>
    <div *ngIf="!loading" class="text-muted mt-3">
      Generate a type to review its sections and fields.
    </div>
  </ng-template>

</div>


<app-loading-popup 
[isVisible]="isLoading$ | async"
message="We're Processing the Data..."
></app-loading-popup>
