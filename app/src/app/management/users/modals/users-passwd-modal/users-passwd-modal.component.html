<dg-modal
    icon="fas fa-key"
    eyebrow="User"
    title="Change password"
    (dismiss)="activeModal.dismiss('Cross click')">

    <form [formGroup]="passwdForm" (ngSubmit)="onPasswordChange()" novalidate>
        <p class="passwd-lead">
            Set a new password for <b>{{ user.user_name }}</b>.
        </p>

        <label class="form-label" for="userPasswordInput">
            Password <span class="text-danger">*</span>
        </label>

        <div class="input-group">
            <input
                id="userPasswordInput"
                #passWordInput
                type="password"
                class="form-control"
                placeholder="Password"
                autocomplete="new-password"
                formControlName="password"
                [class.is-valid]="password.valid && (password.dirty || password.touched)"
                [class.is-invalid]="password.invalid && (password.dirty || password.touched)" />

            <button
                type="button"
                class="input-group-text passwd-toggle"
                title="Show/Hide password"
                aria-label="Show or hide the password"
                (click)="toggleInput()">
                <i class="far fa-eye" aria-hidden="true"></i>
            </button>

            @if (password.invalid && (password.dirty || password.touched)) {
            <div class="invalid-feedback">
                @if (password.errors?.required) {
                <div>Password is required</div>
                }
                @if (password.errors?.strength) {
                <div>Password is not strong enough</div>
                }
            </div>
            }
        </div>

        <password-strength-meter class="passwd-meter" [password]="password.value" [enableFeedback]="true">
        </password-strength-meter>
    </form>

    <app-button
        dgModalFooter
        bootstrapClass="btn-secondary"
        label="Close"
        type="button"
        (clicked)="activeModal.dismiss('Close click')">
    </app-button>

    <app-button
        dgModalFooter
        bootstrapClass="btn-primary"
        label="Save"
        type="button"
        icon="fas fa-key"
        [disabled]="!passwdForm.valid"
        (clicked)="onPasswordChange()">
    </app-button>
</dg-modal>
