<div id="user-delete-header">
  <h1>Delete user: {{user.user_name}}</h1>
</div>
<hr />
<app-warning-alert title="Note:"
  message="A person mirroring this user stays as a deactivated former user: unlinked, out of every mapped person group, and deletable.">
</app-warning-alert>
<app-button variant="solid" tone="danger" label="CONFIRM" (clicked)="delete()"></app-button>
