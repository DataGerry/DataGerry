<div id="user-edit-header">
    <h1>Edit user: {{user.user_name}}</h1>
    <div class="user-sync-info">
        <app-user-person-link [userId]="user.public_id"></app-user-person-link>
        <app-user-sync-pending [pending]="user.sync_pending"></app-user-sync-pending>
    </div>
</div>
<hr />

<div id="user-add-form">
    <cmdb-user-form [providers]="providers" [groups]="groups" [user]="user" (submit)="save($event)" />
</div>

@if (typeEditRight) {

@for (userGroup of userGroups; track userGroup.public_id) {
<h2>Object ACL of {{userGroup.label}}</h2>
<hr />
<cmdb-acl-objects-table [group]="userGroup" />
}

}

<app-loading-popup
  [isVisible]="isLoading$ | async"
  message="We're Processing the Data..."
></app-loading-popup>
