<div id="user-edit-header">
    <h1>Edit user: {{user.user_name}}</h1>
</div>
<hr />

<div id="user-add-form">
    <cmdb-user-form [providers]="providers" [groups]="groups" [user]="user" (submit)="save($event)" />
</div>

@if (typeEditRight) {

@for (userGroup of userGroups; track userGroup.public_id) {
<h2>Object ACL of {{userGroup.label}}</h2>
<hr />
<cmdb-acl-objects-table [group]="userGroup" />
}

}
