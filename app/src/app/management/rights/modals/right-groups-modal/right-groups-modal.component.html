<div class="modal-header bg-primary text-white">
  <h4 class="modal-title">Groups with right: {{right?.label}}</h4>
  <button type="button" class="btn-close btn-close-white" aria-label="Close" (click)="activeModal.dismiss('Cross click')">
  </button>
</div>
<div class="modal-body">
  <cmdb-group-table-list [filter]="{rights: right.name}"></cmdb-group-table-list>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-outline-dark" (click)="activeModal.dismiss('Close click')">Close</button>
</div>
