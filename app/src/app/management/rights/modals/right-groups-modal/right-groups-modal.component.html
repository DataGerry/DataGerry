<dg-modal
    icon="fas fa-user-shield"
    eyebrow="Right"
    [title]="right?.label"
    subtitle="Groups that hold this right"
    (dismiss)="activeModal.dismiss('Cross click')">

    <cmdb-table [id]="'right-groups-table'" [columns]="columns" [items]="right.groups"
                [totalItems]="right.groups_count" [searchEnabled]="false" [paginationEnabled]="false"
                [pageSizeEnabled]="false" [stateEnabled]="false">
    </cmdb-table>

    <app-button
        dgModalFooter
        variant="outline" tone="neutral"
        label="Close"
        type="button"
        (clicked)="activeModal.dismiss('Close click')">
    </app-button>
</dg-modal>

<ng-template #usersTemplate let-item="item">
    <cmdb-group-table-user-cell [group]="item"></cmdb-group-table-user-cell>
</ng-template>
