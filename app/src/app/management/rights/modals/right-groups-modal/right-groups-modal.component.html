<dg-modal
    icon="fas fa-user-shield"
    eyebrow="Right"
    [title]="right?.label"
    subtitle="Groups that hold this right"
    (dismiss)="activeModal.dismiss('Cross click')">

    <cmdb-group-table-list [filter]="{rights: right.name}"></cmdb-group-table-list>

    <app-button
        dgModalFooter
        bootstrapClass="btn-secondary"
        label="Close"
        type="button"
        (clicked)="activeModal.dismiss('Close click')">
    </app-button>
</dg-modal>
