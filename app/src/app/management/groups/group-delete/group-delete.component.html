<h1>Delete group: <strong>{{group?.label}}</strong></h1>
<hr />

<form [formGroup]="deleteForm" (ngSubmit)="delete()">

  <div class="form-group row">
    <label class="col-sm-3">Move users to group: </label>
    <div class="col-sm-9">
      <div class="row">
        <div class="col-sm-2">
          <div class="custom-control custom-radio">
            <input formControlName="deleteGroupAction" id="moveUsers" type="radio" name="deleteGroupAction" value="MOVE"
              class="custom-control-input">
            <label class="custom-control-label" for="moveUsers"></label>
          </div>
        </div>
        <div class="col-sm-10">
          <select class="custom-select" formControlName="deleteGroupOption">
            @for (g of groups | groupSelect: group.public_id; track g) {
            <option [value]="g.public_id">{{g.label}}</option>
            }
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="form-group row">
    <label class="col-sm-3">Delete all users in this group</label>
    <div class="col-sm-9">
      <div class="custom-control custom-radio">
        <input formControlName="deleteGroupAction" id="deleteUsers" type="radio" name="deleteGroupAction" value="DELETE"
          class="custom-control-input">
        <label class="custom-control-label" for="deleteUsers"></label>
      </div>
    </div>
  </div>
  <hr />
  <div class="d-flex flex-row-reverse">
    <app-button type="submit" variant="solid" tone="danger" label="Delete" [disabled]="deleteForm.invalid"></app-button>
    <a
      class="dg-button dg-button--outline dg-button--neutral dg-button--md ms-2"
      [routerLink]="['/', 'management', 'groups']">
      <span class="dg-button__label">Cancel</span>
    </a>
  </div>

</form>

<app-loading-popup [isVisible]="isLoading$ | async" message="We're Processing the Data..."></app-loading-popup>
