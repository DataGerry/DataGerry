<h1>Delete group: <strong>{{group?.label}}</strong></h1>
<hr />

<app-warning-alert title="Note:"
  message="A person group mapped to this user group stays, with its name and members, and is no longer mapped.">
</app-warning-alert>

<form [formGroup]="deleteForm" (ngSubmit)="delete()">

  @if (soleMembers > 0) {
  <p>This applies to the {{ soleMembers }} user(s) for whom this is their only group.</p>

  <div class="form-group row">
    <label class="col-sm-3" for="moveUsers">Move users to group: </label>
    <div class="col-sm-9">
      <div class="row">
        <div class="col-sm-2">
          <div class="custom-control custom-radio">
            <input formControlName="deleteGroupAction" id="moveUsers" type="radio" name="deleteGroupAction" value="MOVE"
              class="custom-control-input">
            <label class="custom-control-label" for="moveUsers"></label>
          </div>
        </div>
        <div class="col-sm-10">
          <select class="custom-select" formControlName="deleteGroupOption" aria-label="Target group">
            @for (g of groups | groupSelect: group.public_id; track g) {
            <option [ngValue]="g.public_id">{{g.label}}</option>
            }
          </select>
        </div>
      </div>
    </div>
  </div>

  <div class="form-group row">
    <label class="col-sm-3" for="deleteUsers">Delete these users</label>
    <div class="col-sm-9">
      <div class="custom-control custom-radio">
        <input formControlName="deleteGroupAction" id="deleteUsers" type="radio" name="deleteGroupAction" value="DELETE"
          class="custom-control-input">
        <label class="custom-control-label" for="deleteUsers"></label>
      </div>
    </div>
  </div>
  }
  <hr />
  <div class="dg-button-row dg-button-row--end">
    <a
      class="dg-button dg-button--outline dg-button--neutral dg-button--md"
      [routerLink]="['/', 'management', 'groups']">
      <span class="dg-button__label">Cancel</span>
    </a>
    <app-button type="submit" variant="solid" tone="danger" label="Delete" [disabled]="!usage || deleteForm.invalid"></app-button>
  </div>

</form>

<app-loading-popup [isVisible]="isLoading$ | async" message="We're Processing the Data..."></app-loading-popup>
