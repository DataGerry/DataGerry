<button
  type="button"
  class="dg-button dg-button--outline dg-button--neutral dg-button--md dg-button--icon-only"
  data-bs-toggle="dropdown"
  [ngbTooltip]="'Preset Rights'"
  aria-haspopup="menu"
  aria-expanded="false"
  aria-label="Preset Rights">
  <i class="fas fa-pencil-alt" aria-hidden="true"></i>
</button>
<ul class="dropdown-menu dropdown-menu-end p-0">
  @for (preset of presetList; track preset) {
  <li>
    <button type="button" class="dropdown-item" (click)="insertSelectedRights(preset.value)">{{preset.name}}</button>
  </li>
  }
</ul>
