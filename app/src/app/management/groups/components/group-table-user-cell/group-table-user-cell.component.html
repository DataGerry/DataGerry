@if (numberOfUsers || numberOfUsers == 0) {
<div class="text-center">
  @if (numberOfUsers > 0) {
  <app-button variant="link" tone="brand" size="sm" [label]="'' + numberOfUsers"
    [ariaLabel]="'Show the ' + numberOfUsers + ' users of this group'" (clicked)="openUserListModal(group)"></app-button>
  } @else {
  {{numberOfUsers}}
  }

</div>
} @else {
<div class="text-center">
  <div class="spinner-border spinner-border-sm" role="status">
    <span class="sr-only">Loading...</span>
  </div>
</div>
}
