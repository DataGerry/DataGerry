<dg-modal
    icon="fas fa-users"
    eyebrow="Group"
    [title]="group?.label"
    subtitle="Users assigned to this group"
    (dismiss)="activeModal.dismiss('Cross click')">

    <cmdb-user-table-list [filter]="{group_id: group.public_id}"></cmdb-user-table-list>

    <app-button
        dgModalFooter
        bootstrapClass="btn-secondary"
        label="Close"
        type="button"
        (clicked)="activeModal.dismiss('Close click')">
    </app-button>
</dg-modal>
