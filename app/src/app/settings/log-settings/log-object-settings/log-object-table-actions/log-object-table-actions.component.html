<span class="d-flex justify-content-center">
  @if (!isViewButtonEnable) {
  <div>
    <a class="text-dark" routerLink="/framework/object/log/{{publicID}}" title="View log">
      <i class="far fa-eye spacing-right icon-view"></i>
    </a>
  </div>
  }

  <a class="text-dark ms-1 deletebutton" *permissionLink="['base.framework.log.delete']" title="Delete log"
    (click)="deleteEmitter.emit(publicID);">
    <i class="far fa-trash-alt spacing-right icon-delete"></i>
  </a>
</span>
