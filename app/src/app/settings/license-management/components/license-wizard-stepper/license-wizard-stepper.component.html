<ol class="wizard-stepper" role="list">
  @for (step of steps; track step.title; let i = $index; let last = $last) {
    <li
      class="wizard-stepper__item"
      [class.is-completed]="isCompleted(i)"
      [class.is-active]="isActive(i)"
      [class.is-upcoming]="!isCompleted(i) && !isActive(i)"
      [class.is-clickable]="i <= current">

      @if (!last) {
        <span class="wizard-stepper__line" aria-hidden="true"></span>
      }

      <button
        type="button"
        class="wizard-stepper__button"
        [disabled]="i > current"
        [attr.aria-current]="isActive(i) ? 'step' : null"
        (click)="onSelect(i)">
        <span class="wizard-stepper__marker" aria-hidden="true">
          @if (isCompleted(i)) {
            <i class="fas fa-check"></i>
          } @else {
            <i [class]="step.icon"></i>
          }
        </span>
        <span class="wizard-stepper__text">
          <span class="wizard-stepper__index">Step {{ i + 1 }}</span>
          <span class="wizard-stepper__title">{{ step.title }}</span>
        </span>
      </button>
    </li>
  }
</ol>
