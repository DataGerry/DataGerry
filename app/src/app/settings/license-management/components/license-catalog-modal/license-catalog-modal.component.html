<div class="catalog-modal">
  <app-button class="catalog-modal__close" variant="ghost" tone="neutral" size="sm" icon="fas fa-times" [pill]="true"
    ariaLabel="Close" (clicked)="onDismiss()">
  </app-button>

  <header class="catalog-modal__hero">
    <h2 id="license-catalog-title" class="catalog-modal__title">Unlock Self-Hosted Features</h2>
    <p class="catalog-modal__subtitle">
      Get advanced security, automation, and integrations built for your DATAGerry instance.
    </p>
  </header>

  <div class="catalog-modal__body">
    <div class="catalog-filter">
      <span id="catalog-filter-label" class="catalog-filter__label">Show features for</span>

      <div class="catalog-filter__chips" role="group" aria-labelledby="catalog-filter-label">
        <app-button
          size="sm"
          label="All tiers"
          [pill]="true"
          [variant]="selectedTier === null ? 'solid' : 'outline'"
          [tone]="selectedTier === null ? 'brand' : 'neutral'"
          [ariaPressed]="selectedTier === null"
          (clicked)="onSelectTier(null)">
        </app-button>

        @for (option of tierFilters; track option.tier) {
          <app-button
            size="sm"
            [label]="option.label"
            [pill]="true"
            [variant]="selectedTier === option.tier ? 'solid' : 'outline'"
            [tone]="selectedTier === option.tier ? 'brand' : 'neutral'"
            [ariaPressed]="selectedTier === option.tier"
            (clicked)="onSelectTier(option.tier)">
          </app-button>
        }
      </div>

      <p class="catalog-filter__summary" aria-live="polite">{{ filterSummary }}</p>
    </div>

    <cmdb-license-feature-catalog
      [edition]="edition"
      [features]="features"
      [tierFilter]="selectedTier"
      [showHeader]="false">
    </cmdb-license-feature-catalog>
  </div>

  <footer class="catalog-modal__footer">
    <p class="catalog-modal__trust">
      <i class="fas fa-circle-check" aria-hidden="true"></i>
      Enable Self-Hosted capabilities instantly
    </p>

    <div class="catalog-modal__actions">
      <app-button class="catalog-modal__action" variant="outline" tone="neutral" label="Maybe later" [pill]="true"
        (clicked)="onDismiss()">
      </app-button>

      <app-button class="catalog-modal__action" variant="solid" tone="brand" label="Activate Self-Hosted Edition"
        icon="fas fa-arrow-right" iconPosition="end" [pill]="true" (clicked)="onActivate()">
      </app-button>
    </div>
  </footer>
</div>
