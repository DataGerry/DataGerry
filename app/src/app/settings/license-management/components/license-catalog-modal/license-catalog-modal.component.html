<div class="catalog-modal">
  <button type="button" class="catalog-modal__close" aria-label="Close" (click)="onDismiss()">
    <i class="fas fa-times" aria-hidden="true"></i>
  </button>

  <header class="catalog-modal__hero">
    <h2 id="license-catalog-title" class="catalog-modal__title">Unlock Self-Hosted Features</h2>
    <p class="catalog-modal__subtitle">
      Get advanced security, automation, and integrations built for your DATAGerry instance.
    </p>
  </header>

  <div class="catalog-modal__body">
    <cmdb-license-feature-catalog
      [edition]="edition"
      [features]="features"
      [showHeader]="false">
    </cmdb-license-feature-catalog>
  </div>

  <footer class="catalog-modal__footer">
    <p class="catalog-modal__trust">
      <i class="fas fa-circle-check" aria-hidden="true"></i>
      Enable Self-Hosted capabilities instantly
    </p>

    <div class="catalog-modal__actions">
      <button type="button" class="btn catalog-modal__action catalog-modal__action--secondary" (click)="onDismiss()">
        Maybe later
      </button>

      <button type="button" class="btn catalog-modal__action catalog-modal__action--primary" (click)="onActivate()">
        <span>Activate Self-Hosted Edition</span>
        <i class="fas fa-arrow-right" aria-hidden="true"></i>
      </button>
    </div>
  </footer>
</div>
