#                                                   ISMS - LIKELIHOOD                                                  #
# -------------------------------------------------------------------------------------------------------------------- #
type: object
properties:
    public_id:
        type: integer
        description: public_id of the Likelihood
        minimum: 1
    name:
        type: string
        description: name of the Likelihood
        minLength: 1
    calculation_basis:
        type: number
        description: calculation basis of the Likelihood (integer or float)
        minimum: 1e-9
    description:
        type: string
        description: description of the Likelihood
required:
    - name
    - calculation_basis
