# -------------------------------------------------------------------------------------------------------------------- #
#                                                  GET - ISMS CONTROL                                                  #
# -------------------------------------------------------------------------------------------------------------------- #

get:
  tags:
      - ISMS-Controls
      - Cloud
      - OnPremise
  summary: Retrieve a single Control [Cloud] [OnPremise]
  description: |
      Required User Right: **base.isms.controlMeasure.view**
      <br><hr><br>
      Returns the **Control** with the given **public_id**
  parameters:
      - name: public_id
        in: path
        description: The **public_id** of the **Control** which should be retrieved
        required: true
        schema:
            type: integer
  operationId: get_isms_control_measure
  responses:
      "200":
          description: Returns the **Control** with the given **public_id**
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          result:
                              $ref: "../../../components/schemas/isms/IsmsControl.yaml"
      "400":
          description: Failed to retrieve the requested **Control**
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "Failed to retrieve the requested Control from the database"
      "404":
          description: The **Control** was not found
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "The Control was not found"
      "500":
          description: An unexpected error occured
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "Internal server error"

# -------------------------------------------------------------------------------------------------------------------- #
#                                                 UPDATE - ISMS CONTROL                                                #
# -------------------------------------------------------------------------------------------------------------------- #

put:
  tags:
      - ISMS-Controls
      - Cloud
      - OnPremise
  summary: Update a single Control [Cloud] [OnPremise]
  description: |
      Required User Right: **base.isms.controlMeasure.edit**
      <br><hr><br>
      Updates the Control with the given **public_id**
  parameters:
      - name: public_id
        in: path
        description: The **public_id** of the Control which should be updated
        required: true
        schema:
            type: integer
  requestBody:
      required: true
      content:
          application/json:
              schema:
                  $ref: "../../../components/schemas/isms/IsmsControl.yaml"
  operationId: update_isms_control_measure
  responses:
      "200":
          description: Returns the updated Control with the given **public_id**
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          result:
                              $ref: "../../../components/schemas/isms/IsmsControl.yaml"
      "400":
          description: Failed to update the requested Control
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "Failed to update the requested Control"
      "404":
          description: The requested Control was not found
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "The requested Control was not found"
      "500":
          description: Internal server error
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "Internal server error"

# -------------------------------------------------------------------------------------------------------------------- #
#                                                 DELETE - ISMS CONTROL                                                #
# -------------------------------------------------------------------------------------------------------------------- #

delete: 
  tags:
      - ISMS-Controls
      - Cloud
      - OnPremise
  summary: Delete a single Control [Cloud] [OnPremise]
  description: |
      Required User Right: **base.isms.controlMeasure.delete**
      <br><hr><br>
      Deletes the Control with the given **public_id**
  parameters:
      - name: public_id
        in: path
        description: The **public_id** of the Control which should be deleted
        required: true
        schema:
            type: integer
  operationId: delete_isms_control_measure
  responses:
      "200":
          description: Returns the Control with the given **public_id** which was deleted
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          raw:
                              $ref: "../../../components/schemas/isms/IsmsControl.yaml"
      "400":
          description: Failed to delete the Control
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "Failed to delete the Control"
      "404":
          description: The requested Control was not found
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "The requested Control was not found"
      "500":
          description: Internal server error
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "Internal server error"
