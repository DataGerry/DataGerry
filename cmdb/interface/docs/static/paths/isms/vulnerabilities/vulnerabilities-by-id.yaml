# -------------------------------------------------------------------------------------------------------------------- #
#                                               GET - ISMS Vulnerability                                               #
# -------------------------------------------------------------------------------------------------------------------- #
get:
  tags:
      - ISMS-Vulnerabilities
      - Cloud
      - OnPremise
  summary: Retrieve a single Vulnerability [Cloud] [OnPremise]
  description: |
      Required User Right: **base.isms.vulnerability.view**
      <br><hr><br>
      Returns the **Vulnerability** with the given **public_id**
  parameters:
      - name: public_id
        in: path
        description: The **public_id** of the **Vulnerability** which should be retrieved
        required: true
        schema:
            type: integer
  operationId: get_isms_vulnerability
  responses:
      "200":
          description: Returns the **Vulnerability** with the given **public_id**
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          result:
                              $ref: "../../../components/schemas/isms/IsmsVulnerability.yaml"
      "400":
          description: Failed to retrieve the requested **Vulnerability**
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "Failed to retrieve the requested Vulnerability from the database"
      "404":
          description: The **Vulnerability** was not found
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "The Vulnerability was not found"
      "500":
          description: An unexpected error occured
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "Internal server error"

# -------------------------------------------------------------------------------------------------------------------- #
#                                              UPDATE - ISMS Vulnerability                                             #
# -------------------------------------------------------------------------------------------------------------------- #

put:
  tags:
      - ISMS-Vulnerabilities
      - Cloud
      - OnPremise
  summary: Update a single Vulnerability [Cloud] [OnPremise]
  description: |
      Required User Right: **base.isms.vulnerability.edit**
      <br><hr><br>
      Updates the Vulnerability with the given **public_id**
  parameters:
      - name: public_id
        in: path
        description: The **public_id** of the Vulnerability which should be updated
        required: true
        schema:
            type: integer
  requestBody:
      required: true
      content:
          application/json:
              schema:
                  $ref: "../../../components/schemas/isms/IsmsVulnerability.yaml"
  operationId: update_isms_vulnerability
  responses:
      "200":
          description: Returns the updated Vulnerability with the given **public_id**
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          result:
                              $ref: "../../../components/schemas/isms/IsmsVulnerability.yaml"
      "400":
          description: Failed to update the requested Vulnerability
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "Failed to update the requested Vulnerability"
      "404":
          description: The requested Vulnerability was not found
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "The requested Vulnerability was not found"
      "500":
          description: Internal server error
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "Internal server error"

# -------------------------------------------------------------------------------------------------------------------- #
#                                              DELETE - ISMS Vulnerability                                             #
# -------------------------------------------------------------------------------------------------------------------- #

delete: 
  tags:
      - ISMS-Vulnerabilities
      - Cloud
      - OnPremise
  summary: Delete a single Vulnerability [Cloud] [OnPremise]
  description: |
      Required User Right: **base.isms.vulnerability.delete**
      <br><hr><br>
      Deletes the Vulnerability with the given **public_id**
  parameters:
      - name: public_id
        in: path
        description: The **public_id** of the Vulnerability which should be deleted
        required: true
        schema:
            type: integer
  operationId: delete_isms_vulnerability
  responses:
      "200":
          description: Returns the Vulnerability with the given **public_id** which was deleted
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          raw:
                              $ref: "../../../components/schemas/isms/IsmsVulnerability.yaml"
      "400":
          description: Failed to delete the Vulnerability
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "Failed to delete the Vulnerability"
      "404":
          description: The requested Vulnerability was not found
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "The requested Vulnerability was not found"
      "500":
          description: Internal server error
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "Internal server error"
