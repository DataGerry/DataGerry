# -------------------------------------------------------------------------------------------------------------------- #
#                                               CREATE - REPORT CATEGORY                                               #
# -------------------------------------------------------------------------------------------------------------------- #
post:
  tags:
      - ReportCategories
      - Cloud
      - OnPremise
  summary: Insert a new ReportCategory [Cloud] [OnPremise]
  description: |
      Inserts a new ReportCategory into the database
      <br><br>
      The **public_id** property will be automatically created and don't need to be provided
  operationId: create_cmdb_report_category
  requestBody:
      required: true
      content:
          application/json:
              schema:
                  $ref: '../../components/schemas/CmdbReportCategory.yaml'
  responses:
      "200":
          description: The assigned **public_id** and the created ReportCategory is returned
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          result_id:
                              type: integer
                              description: "The **public_id** of the created ReportCategory"
                              example: 12345
                          raw:
                              $ref: "../../components/schemas/CmdbReportCategory.yaml"
      "400":
          description: The ReportCategory could not be inserted
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "The ReportCategory could not be inserted"
      "404":
          description: Could not retrieve the created ReportCategory from database
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "Could not retrieve the created ReportCategory from database"
      "500":
          description: Internal server error
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "Internal server error"

# -------------------------------------------------------------------------------------------------------------------- #
#                                                GET - REPORT CATEGORIES                                               #
# -------------------------------------------------------------------------------------------------------------------- #

get:
  tags:
      - ReportCategories
      - Cloud
      - OnPremise
  summary: Retrieve multiple ReportCategories [Cloud] [OnPremise]
  description: |
      Returns all **ReportCategories** if no **CollectionParameters** are passed
  operationId: get_cmdb_report_categories
  parameters:
      - name: CollectionParameters
        in: query
        description: Parameters for filtering, limiting, sorting, and pagination of **ReportCategories**
        required: false
        schema:
            $ref: "../../components/schemas/CollectionParameters.yaml"
  responses:
      "200":
          description: Returns a **list of ReportCategories** matching the filter criteria
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          results:
                              type: array
                              items:
                                  $ref: "../../components/schemas/CmdbReportCategory.yaml"
                          total:
                              type: integer
                              description: The amount of ReportCategories returned
      "400":
          description: Could not iterate **ReportCategories**
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "Could not iterate ReportCategories"
      "500":
          description: An unexpected error occured
          content:
              application/json:
                  schema:
                      type: object
                      properties:
                          error:
                              type: string
                              example: "Internal server error!"
