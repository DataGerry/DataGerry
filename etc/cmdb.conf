[Database]
host = 127.0.0.1
port = 27017
database_name = cmdb

[WebServer]
host = 0.0.0.0
port = 4000
# ssl = false
# certfile = /etc/ssl/certs/cmdb.pem
# keyfile = /etc/ssl/private/cmdb.key

# [Frontend]
# The address browsers use to reach DataGerry.
#
# Not the same as [WebServer] above: that one says where the API binds, this one says where the
# browser should call it. Behind a reverse proxy or under a subdomain the two differ, and only
# this one can be handed to the user's browser.
#
# The port may be omitted, in which case the scheme's default is used (443 for https, 80 for http).
# Leave this commented out and the frontend keeps the address it was built with.
# url = https://cmdb.example.com

# [OpenCelium]
# host = 127.0.0.1
# port = 9090
# protocol = http
# email = email
# user = username
# password = password

[ChatGPT]
api_key = <the api key>
